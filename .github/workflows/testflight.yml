name: TestFlight

# Manual, plus a daily check that uploads once the newest build is 85 days old:
# TestFlight builds expire after 90 days.
on:
  workflow_dispatch:
    inputs:
      only_if_due:
        description: "Upload only if the newest build is 85+ days old (what the schedule does)"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  # Cheap Linux job that decides whether the macOS upload runs.
  due:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      upload: ${{ steps.age.outputs.upload }}
    steps:
      - uses: actions/checkout@v7
      - id: age
        env:
          CHECK: ${{ github.event_name == 'schedule' || inputs.only_if_due }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ "$CHECK" = true ] || { echo "upload=true" >> "$GITHUB_OUTPUT"; exit 0; }
          pip install --quiet 'pyjwt[crypto]'
          days=$(python3 scripts/testflight_build_age.py)
          echo "newest TestFlight build is $days days old"
          [ "$days" -ge 85 ] && echo "upload=true" >> "$GITHUB_OUTPUT" || echo "upload=false" >> "$GITHUB_OUTPUT"
      - name: Require What to Test notes for this version
        if: steps.age.outputs.upload == 'true'
        run: python3 scripts/testflight_notes.py --check
      # Every release runs the UI tests, so the commit needs a green run of the full suite.
      - name: Require a green test run
        if: steps.age.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$passed" -gt 0 ] || { echo "::error::no green Test run for $GITHUB_SHA; push it to the ci branch first"; exit 1; }

  upload:
    needs: due
    if: needs.due.outputs.upload == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets
        run: |
          for s in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!s}" ] || { echo "::error::secret $s is missing (AGENTS.md: Build and ship)"; exit 1; }
          done
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Unsigned archive: automatic signing would want a development profile,
      # which needs a registered device. Export signs it for distribution.
      - name: Archive
        run: |
          xcodebuild archive \
            -project Klassik.xcodeproj -scheme Klassik \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Klassik.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # Export signs locally; altool uploads. destination=upload failed with
      # "No Accounts with App Store Connect Access" under API-key auth.
      - name: Export (sign for distribution)
        run: |
          plutil -replace teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          plutil -replace destination -string export ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Klassik.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Distribution logs
        if: failure()
        run: find "$TMPDIR" -name '*.xcdistributionlogs' -exec sh -c 'cat "$1"/IDEDistribution*.log | tail -80' _ {} \;
      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      # The 85-day refresh uploads the same version again; its tag already exists then.
      - name: Tag the version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          git rev-parse -q --verify "refs/tags/v$version" >/dev/null && exit 0
          git ls-remote --exit-code --tags origin "v$version" >/dev/null && exit 0
          git tag "v$version" && git push origin "v$version"

  # Linux job: it only waits for App Store Connect to finish processing the build.
  notes:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet 'pyjwt[crypto]'
      - name: Set What to Test
        run: python3 scripts/testflight_notes.py "${{ github.run_number }}"
