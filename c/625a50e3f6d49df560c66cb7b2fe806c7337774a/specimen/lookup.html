<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MusicBrainz</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=47" />
    <link rel="stylesheet" href="specimen.css?v=47" />
    <script src="specimen.js?v=47"></script>
  </head>
  <body>
    <script>
      // The lookup page of Settings, with the section for the Wikidata pass of ADR 0042.
      // ?state= running, upToDate (default), waiting, connection or slowDown.
      K.start(() => {
        const { el, href } = K;
        const { scroll } = K.page({
          tab: "library",
          title: "MusicBrainz",
          back: { label: "Settings", href: href("settings.html", { place: "library", back: "Library" }) },
        });
        const state = K.params.get("state") || "upToDate";
        const row = (label, value) =>
          el("div", { class: "row" }, el("span", { class: "main" }, label), el("span", { class: "trail" }, value));
        const status = {
          running: [
            el(
              "div",
              { class: "row-block", "data-id": "people-progress" },
              el(
                "div",
                { class: "row" },
                el(
                  "span",
                  { class: "main" },
                  el("span", { class: "t-body" }, "Looking up 120 of 540 people"),
                  el("progress", { class: "bar", value: 120, max: 540 }),
                ),
              ),
            ),
          ],
          upToDate: [row("Status", "Up to date")],
          waiting: [row("Status", "Waiting")],
          connection: [row("Status", "Paused: no suitable connection")],
          slowDown: [row("Status", "Paused: Wikidata asked for a pause. Klassik tries again in 5 minutes.")],
        }[state] || [row("Status", "Up to date")];
        const checked = state === "upToDate" ? "540" : state === "running" ? "120" : "310";
        const extra = state === "upToDate" ? [] : [row("New", "230"), row("Due for a New Check", "12")];
        scroll.append(
          el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "MusicBrainz")),
          el(
            "section",
            { class: "section" },
            el("div", { class: "section-head t-footnote" }, "People from Wikidata"),
            el("div", { class: "list" }, ...status, row("People Checked", checked), ...extra),
            el(
              "p",
              { class: "section-foot t-footnote" },
              "Klassik looks up every composer and performer of your library, new people first, one request every " +
                "1.1 seconds. It asks again for living people after 30 days and for others after a year. It waits " +
                "for a connection that is not metered and not in Low Data Mode.",
            ),
          ),
        );
      });
    </script>
  </body>
</html>
