<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Klassik specimen: Library</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=52" />
    <link rel="stylesheet" href="specimen.css?v=52" />
    <link rel="stylesheet" href="sheet.css?v=52" />
    <link rel="stylesheet" href="filters.css?v=53" />
    <link rel="stylesheet" href="library.css?v=3" />
    <link rel="stylesheet" href="library-edit.css?v=1" />
    <script src="specimen.js?v=52"></script>
    <script src="sheet.js?v=52"></script>
    <script src="filters.js?v=52"></script>
    <script src="library.js?v=5"></script>
    <script src="library-edit.js?v=3"></script>
  </head>
  <body>
    <!--
  The Library tab: a page of rows that the listener sets up.
  - Default rows: Daily pick, Composers, Favourites, the link list, Recently added, Recently heard.
  - A row with nothing to show hides. A card holds the full name in up to three lines, then one fact line, the same kind for the whole row.
  - A strip is as tall as its tallest card. Strips hold 6, 9 or 12 cards; tiles hold 3, 6 or 9.
  - The Daily pick is the only larger text in the app. A tap on its cover or title opens the item and plays nothing.
  - ?rows=all draws every row kind. ?rows=composers,performers,... draws the kinds named.
  - Edit raises the sheet that sets up the rows. ?edit=1 opens it on load; ?edit=row opens the settings of the Composers row; ?edit=empty adds a row with nothing to show.
  - The rows stay for the browser session, except with ?rows=. The Reset rows control of the specimen bar clears them.
-->
    <script>
      K.start(async () => {
        const { el, href, ICON } = K;
        await Library.load();
        const { nav, scroll } = K.page({ tab: "library", title: "Library" });
        const actions = nav.querySelector(".actions");
        const editButton = el("button", { class: "t-body tint", onclick: () => openEdit() }, "Edit");
        actions.append(
          editButton,
          el("a", {
            class: "settings-link",
            href: href("settings.html", { tab: "library", back: "Library" }),
            "aria-label": "Settings",
            html: ICON.settings,
          }),
        );
        const all = K.params.get("rows") === "all";
        const host = el("div");
        scroll.append(
          el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "Library")),
          host,
          el(
            "p",
            { class: "section-foot t-footnote" },
            "Sample library. ",
            el(
              "a",
              { class: "link", href: href(location.pathname.split("/").pop(), { rows: all ? null : "all" }) },
              all ? "Show the default rows" : "Show all kinds",
            ),
          ),
        );
        // A ?rows= view draws what it names and keeps nothing.
        const named = K.params.get("rows");
        const rows = named ? Library.fromParam(named) : (Library.stored() ?? Library.defaults());
        // Specimen only: ?edit=empty adds a row whose two conditions exclude each other, so it has nothing to show.
        if (K.params.get("edit") === "empty")
          rows.unshift(
            Library.make("recordings", {
              id: "p-empty",
              conds: [["composer:Ludwig van Beethoven"], ["composer:Johann Sebastian Bach"]],
            }),
          );
        let edit = null;
        const startEdit = K.params.get("edit");
        const tab = Library.mount(host, rows, { onSelect: (id) => edit?.select(id) });
        function openEdit(start = null) {
          if (edit) return;
          editButton.style.visibility = "hidden";
          edit = LibraryEdit.open({
            rows,
            tab,
            start,
            onChange: named || startEdit === "empty" ? null : Library.keep,
            onClose: () => {
              edit = null;
              editButton.style.visibility = "";
            },
          });
        }
        if (startEdit) openEdit(startEdit === "row" ? "row" : null);
        // Specimen only: a reset for the rows.
        document.querySelector(".specimen-bar")?.append(
          el(
            "button",
            {
              onclick: () => {
                K.store("library.rows", null);
                location.reload();
              },
            },
            "Reset rows",
          ),
        );
      });
    </script>
  </body>
</html>
