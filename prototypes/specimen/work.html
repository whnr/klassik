<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work page</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css?v=35">
<link rel="stylesheet" href="specimen.css?v=35">
<script src="specimen.js?v=35"></script>
</head>
<body>
<script>
K.start(() => {
  const { el, href, ICON, M } = K;
  const id = K.params.get("work") || "Ludwig van Beethoven|Symphony No. 5 in C minor, Op. 67";
  const work = M.works.get(id);
  const { scroll } = K.page({ tab: "library", title: work.name, back: { label: work.composer, href: "index.html" } });

  const head = el("div", { class: "page-head" });
  const workFav = "work:" + work.id;
  const mark = el("button", { "aria-label": "Favourite work", onclick: () => { K.toggleFavourite(workFav); mark.replaceChildren(K.fermata(K.isFavourite(workFav))); } }, K.fermata(K.isFavourite(workFav)));
  const title = el("h1", { class: "t-title1" }, K.titled(work.name, mark));
  head.append(title, el("div", { class: "meta t-subheadline" },
    el("a", { class: "link", href: K.personHref(work.composer, { back: work.name }) }, work.composer),
    el("span", { class: "secondary" }, work.year ? `, composed${K.NB}${work.year}` : ""),
    work.grouping ? el("div", { class: "secondary" }, work.grouping) : null));

  const playBtn = el("button", { class: "capsule filled t-headline", html: ICON.play.replace("<svg", '<svg width="14" height="14"') + "<span>Play</span>" });
  playBtn.addEventListener("click", () => {
    const rec = K.orderedRecordings(work)[0];
    K.playItem(K.resolveItem(["recording", rec.album.id, rec.work]));
  });
  const buttons = el("div", { class: "button-row" }, playBtn);

  const listBox = el("div", { class: "list" });
  const section = el("section", { class: "section" },
    el("div", { class: "section-head t-footnote" }, el("span", {}, "Recordings"), el("span", { class: "count" }, `(${work.recordings.length})`)), listBox);

  // Every name shows; the row grows instead. The principal performers lead (conductor and soloists); the ensembles follow.
  const ENSEMBLE = new Set(["Orchestra", "Choir", "Ensemble", "Trio", "Quartet"]);
  const isEnsemble = (p) => ENSEMBLE.has(p.subRole);
  const lead = (r) => (r.performers.some((p) => !isEnsemble(p)) ? r.performers.filter((p) => !isEnsemble(p)) : r.performers);
  const others = (r) => r.performers.filter((p) => !lead(r).includes(p));
  const people = (r) => K.joinNames(lead(r).map((p) => p.name));
  // Facts as prose (sz-rs30.1.83.16): "Recorded in 1972 on Dvořák Symphonies. 42 minutes, 4 movements."
  const facts = (r) => [r.year ? `Recorded in ${r.year} on ${r.album.name}.` : `On ${r.album.name}.`,
    r.songs.length > 1 ? `${K.duration(r.duration)}, ${K.count(r.songs.length, "movement")}.` : `${K.duration(r.duration)}.`].join(" ");

  function render() {
    const playing = K.current() && K.current().recording;
    listBox.replaceChildren(...K.orderedRecordings(work).map((r, i) => {
      const isPlaying = playing && playing.id === r.id;
      const recFav = "rec:" + r.id;
      const slot = isPlaying
        ? el("button", { class: "round quiet", "aria-label": K.P.paused ? "Resume" : "Pause", html: K.P.paused ? ICON.play : ICON.pause, onclick: (e) => { e.preventDefault(); K.togglePause(); } })
        : el("span", { html: ICON.chevron });
      return el("a", { class: "row" + (isPlaying ? " playing" : ""), href: href("player.html", { recording: r.id, back: work.name }), style: "--sep-inset: calc(var(--space-l) + var(--size-coverRow) + var(--space-m))" },
        K.coverImage(r.album),
        el("div", { class: "main" },
          el("div", { class: "t-body" }, K.isFavourite(recFav) ? K.titled(people(r), K.fermata(true)) : people(r)),
          others(r).length ? el("div", { class: "t-subheadline" }, K.joinNames(others(r).map((p) => p.name))) : null,
          el("div", { class: "t-subheadline secondary" }, facts(r)),
          i === 0 ? el("div", { class: "t-footnote tint" }, "Plays first") : null),
        el("div", { class: "trail" }, slot));
    }));
  }
  K.onPlay(() => { const now = (K.current() && K.current().id) + K.P.paused; if (now !== render.last) { render.last = now; render(); } });
  render();

  scroll.append(head, buttons, section,
    el("p", { class: "section-foot t-footnote", style: "margin: var(--space-s) var(--pad-right) 0 var(--pad-left)" },
      "Favourite recordings come first, in your order. Then the newest."));
});
</script>
</body>
</html>
