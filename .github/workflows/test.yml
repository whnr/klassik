name: Test

# The full suite against a fixture Navidrome: unit, library sync, gapless and UI tests, plus screenshots.
# A push to main starts no macOS run. testflight.yml refuses a commit that has no green run of this workflow.
on:
  push:
    branches: [screens]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, because macOS runner time is expensive. The macOS job starts only on clean code.
  lint:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint.sh

  # ffmpeg is quick to install on Linux; the macOS job only needs the finished files.
  # The tarball keeps the colons in the file names, which artifact paths reject.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install mutagen
      - run: python3 scripts/fixtures.py fixture/music && tar czf fixture-music.tgz -C fixture music
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-music
          path: fixture-music.tgz
          retention-days: 1

  test:
    needs: [lint, fixtures]
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: fixture-music
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/fixture" && tar xzf "$RUNNER_TEMP/fixture-music.tgz" -C "$RUNNER_TEMP/fixture"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Start Navidrome on the fixture library
        run: scripts/fixture-server.sh "$RUNNER_TEMP/fixture"
      - name: Run all tests and walk the screens
        run: scripts/screens.sh "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/screens/*.txt
          if-no-files-found: warn
      - name: Navidrome log
        if: failure()
        run: tail -50 "$RUNNER_TEMP/fixture/navidrome.log"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screens-xcresult
          path: ${{ runner.temp }}/screens/screens.xcresult
