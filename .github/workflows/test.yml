name: Test

# Unit, library sync and gapless tests against a fixture Navidrome, then the UI walk and its screenshots on every
# run. During the interface rebuild the walk is a warning, never a red check: a failed walk shows in the job summary
# and fails the run only if the repository variable UI_TESTS_REQUIRED is "true". The screenshots always upload.
# After a walk, screens-diff compares each screenshot with the newest walk on the same branch, else on ci.
# A failed build or unit test fails the run. The "ui" input of a run by hand narrows the walk, such as "browse,settings".
# TestFlight needs a green run for the exact merge commit on main.
on:
  push:
    branches: [ci, main]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:
    inputs:
      ui:
        description: 'Walk the screens: "all", or areas such as "browse,settings"'
        type: string
        default: ""

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux, because macOS runner time is expensive. The macOS job starts only on clean code.
  lint:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint.sh

  # ffmpeg installs quickly on Linux; the macOS job only needs the finished files.
  # The tarball keeps the colons in the file names, which artifact paths reject.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A pinned static build: the Ubuntu mirror can take ten minutes for ffmpeg's packages.
      # BtbN prunes old builds; when this one is gone the step warns and falls back to apt.
      - name: Install ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
        run: |
          if curl -sfL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL" \
            && echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c --quiet; then
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg'
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          else
            echo "::warning::The pinned ffmpeg build is gone or changed; installing from apt. Pin a newer build."
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: ffmpeg -version | head -1
      - run: pip install mutagen
      - run: python3 scripts/fixtures.py fixture/music && tar czf fixture-music.tgz -C fixture music
      - name: Test the screenshot scripts
        run: python3 -m unittest discover -s scripts -p "test_screens.py"
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-music
          path: fixture-music.tgz
          retention-days: 1

  test:
    needs: [lint, fixtures]
    runs-on: xcode-27
    timeout-minutes: 40
    # The xcode-27 image holds the iOS 27 SDK. Its default Xcode 27.1 has one simulator on its own iOS;
    # Xcode 27.2 matches the newest simulator runtime.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      ui: ${{ steps.ui.outputs.ui }}
      screens: ${{ steps.report.outputs.screens }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Choose the UI areas
        id: ui
        env:
          INPUT: ${{ inputs.ui }}
        run: |
          echo "ui=${INPUT:-all}" | tee -a "$GITHUB_OUTPUT"
      # The cached DerivedData helps only if unchanged files keep their time.
      - run: python3 scripts/git_mtimes.py
      - id: xcode
        run: echo "version=$(xcodebuild -version | tr -s '\n ' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: deriveddata-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Klassik/**', 'KlassikTests/**', 'KlassikUITests/**') }}
          restore-keys: deriveddata-${{ steps.xcode.outputs.version }}-
      - uses: actions/download-artifact@v8
        with:
          name: fixture-music
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/fixture" && tar xzf "$RUNNER_TEMP/fixture-music.tgz" -C "$RUNNER_TEMP/fixture"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Start Navidrome on the fixture library
        run: scripts/fixture-server.sh "$RUNNER_TEMP/fixture"
      - name: Run the tests
        env:
          KLASSIK_UI: ${{ steps.ui.outputs.ui }}
          UI_TESTS_REQUIRED: ${{ vars.UI_TESTS_REQUIRED || 'false' }}
        run: scripts/screens.sh "$RUNNER_TEMP/screens"
      # The script passes after a tolerated UI failure, so this step tells the truth about each result.
      - name: Results and time of each phase
        id: report
        if: always()
        run: |
          out="$RUNNER_TEMP/screens"
          mkdir -p "$out"
          python3 scripts/screen_report.py summary "$out" >> "$GITHUB_STEP_SUMMARY"
          (echo '```'; cat "$out/timings.txt"; echo '```') >> "$GITHUB_STEP_SUMMARY" || true
          echo "ui=$(grep '^ui=' "$out/results.txt" | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT" || true
          if ls "$out"/*.png >/dev/null 2>&1; then echo "screens=true"; else echo "screens=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/screens/*.txt
          if-no-files-found: warn
      - name: Navidrome log
        if: failure()
        run: tail -50 "$RUNNER_TEMP/fixture/navidrome.log"
      - uses: actions/upload-artifact@v7
        if: failure() || steps.report.outputs.ui == 'failed'
        with:
          name: screens-xcresult
          path: ${{ runner.temp }}/screens/*.xcresult

  # The diff informs; it never fails the run. It runs when screenshots exist, also after a failed test job.
  # Without screenshots the job shows as skipped, and the summary of test says why.
  screens-diff:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.screens == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: screens
          path: current
      - run: pip install pillow numpy
      - name: Collect the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/screen_baseline.py current baseline
      - name: Compare
        run: python3 scripts/screen_diff.py baseline current screens-diff
      # A comparison that did not finish must read as skipped, not as a clean result.
      - name: Report
        if: always()
        run: |
          python3 scripts/screen_report.py diff current screens-diff baseline >> "$GITHUB_STEP_SUMMARY"
          cat screens-diff/diff.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: warn
          name: screens-diff
          path: screens-diff
