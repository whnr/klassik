<!doctype html>
<!--
  PROTOTYPE, throw away. Map tickets sz-rs30.1.74.8 (composer page) and sz-rs30.1.74.12 (performer page), round 1.
  Base: pages round 3 with ADR 0015 locked (the player is the page of what plays; the next item rises).
  Question: what the composer page and the performer page show. ?c=A|B|C for the composer page, ?p=A|B|C for the performer page.
  Weak cases: Zelenka (no portrait, weak tags), "Strauss" (a surname only), "Anonymous" (no lookup), Pärt (a credit is needed).
  Recordings, albums, bios and portraits are sample data. Portraits are generated drawings. No audio, no cover art.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Composer and performer pages, round 1</title>
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.1); --fill: rgba(118,118,128,.14); --track: rgba(118,118,128,.32);
  --glass: rgba(250,250,252,.82); --glassLine: rgba(0,0,0,.08); --gap: #dcdce2;
  --barW: 26px; --lineX: 12px; --edgeTop: calc(env(safe-area-inset-top) + 52px);
  --bot: calc(env(safe-area-inset-bottom) + 12px); --tabH: 56px; --miniH: 76px; --navH: 44px;
  --top: calc(env(safe-area-inset-top) + 48px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.14); --fill: rgba(118,118,128,.24); --track: rgba(118,118,128,.5);
  --glass: rgba(40,40,44,.82); --glassLine: rgba(255,255,255,.1); --gap: #2a2a2e;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: left; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }
.lk { color: var(--tint); }

/* ---------- the stack of pages ---------- */
#nav { position: fixed; inset: 0; overflow: hidden; }
.pg { position: absolute; top: 0; left: 0; bottom: 0; right: var(--barW); background: var(--bg); color: var(--label); transition: transform .35s cubic-bezier(.2,.8,.2,1), background-color .6s, right .35s, border-radius .35s; will-change: transform; }
.pg .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--top) + var(--navH) + 4px) 6px calc(var(--bot) + var(--tabH) + var(--miniH) + 40px) 16px; }
#navbar { position: fixed; top: var(--top); left: 0; right: var(--barW); height: var(--navH); z-index: 8; display: flex; align-items: center; padding: 0 8px; gap: 6px; pointer-events: none; }
#navbar > * { pointer-events: auto; }
#back { color: var(--tint); font-size: 17px; max-width: 42%; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 6px; border-radius: 22px; }
#back b { font-size: 26px; font-weight: 400; line-height: 1; margin-top: -3px; }
#nt { flex: 1; text-align: center; font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .2s; padding-right: 40px; }
#navbar.solid #nt { opacity: 1; }
#navbg { position: fixed; top: 0; left: 0; right: var(--barW); height: calc(var(--top) + var(--navH)); z-index: 7; opacity: 0; transition: opacity .2s; border-width: 0 0 .5px; }
#navbg.solid { opacity: 1; }

h1.pt { font-size: 28px; line-height: 1.15; margin: 4px 0 4px; }
.sub { font-size: 17px; margin-bottom: 10px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 8px 6px 14px; }
.sh button { text-transform: none; font-size: 15px; color: var(--tint); }
.foot { font-size: 13px; color: var(--label2); margin: 8px 14px 0; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.meta { font-size: 13px; color: var(--label2); margin: 6px 0 0; }
.sum { margin: 12px 0 0; font-size: 15px; line-height: 1.4; }
.sum p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum.open p { -webkit-line-clamp: unset; }
.sum .more { color: var(--tint); font-size: 15px; }
.sum .cred { font-size: 12px; color: var(--label2); }
.acts { display: flex; gap: 8px; margin: 14px 0 0; }
.btn { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--tint); color: #fff; min-width: 112px; justify-content: center; }
.stub { font-size: 13px; color: var(--label2); background: var(--fill); border-radius: 10px; padding: 8px 12px; margin: 8px 0 0; }

/* plain link rows (library, composer, performer stubs) */
.pr { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; position: relative; }
.pr + .pr::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.pr .m { flex: 1; min-width: 0; } .pr .s { font-size: 13px; color: var(--label2); } .pr .chev { color: var(--label3); }
.pr:active { background: var(--fill); }

/* ---------- recording rows on the work page ---------- */
.rr { position: relative; overflow: hidden; }
.rr + .rr::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 3; }
.rr .fg { position: relative; z-index: 2; background: var(--card); display: flex; gap: 12px; padding: 12px 8px 12px 14px; touch-action: pan-y; transition: transform .25s; }
.rr .fg.drag { transition: none; }
.rr .fg:active { background: color-mix(in srgb, var(--card), var(--label) 4%); }
.rr .ra { position: absolute; top: 0; bottom: 0; display: flex; z-index: 1; }
.rr .ra.L { left: 0; } .rr .ra.R { right: 0; }
.rr .ra button { white-space: pre-line; width: 84px; color: #fff; font-size: 14px; font-weight: 600; display: grid; place-items: center; text-align: center; padding: 0 6px; line-height: 1.15; }
.rr .ra .q1 { background: #5856d6; } .rr .ra .q2 { background: #ff9500; } .rr .ra .d1 { background: #34a0a4; } .rr .ra .f1 { background: var(--tint); }
.rr .cv { flex: none; border-radius: 6px; overflow: hidden; }
.rr .mn { flex: 1; min-width: 0; }
.rr .l1 { font-size: 16px; font-weight: 600; } .rr .l2 { font-size: 14px; color: var(--label); } .rr .l3 { font-size: 13px; color: var(--label2); margin-top: 2px; }
.rr .why { font-size: 13px; color: var(--tint); margin-top: 3px; }
.rr .side { width: 64px; flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 4px; }
.rr .st { font-size: 12px; color: var(--tint); text-align: right; line-height: 1.25; white-space: pre-line; min-height: 15px; }
.rr .slot { width: 34px; height: 34px; display: grid; place-items: center; color: var(--label3); font-size: 15px; border-radius: 17px; }
.rr .slot.go { background: var(--tintSoft); color: var(--tint); font-size: 13px; }
.rr .slot.hd { font-size: 20px; color: var(--label2); touch-action: none; }
.rr.now .l1 { color: var(--tint); }
.rr.dim { opacity: .45; }
.rr.lifted { z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.rr .rb2 { display: none; background: var(--card); position: relative; z-index: 2; padding: 0 0 8px; }
.rr.open .rb2 { display: block; }
.strip { display: flex; gap: 2px; height: 6px; margin-top: 8px; }
.strip i { display: block; height: 100%; background: var(--track); border-radius: 1px; }
.rr.now .strip i { background: color-mix(in srgb, var(--tint), transparent 45%); }
body.rows-card .rr .fg { flex-wrap: wrap; }

/* ---------- recording and album pages: the player's layout ---------- */
.hero { padding: 0 0 6px; }
.hero .art { width: min(240px, 100%); aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hero h2 { font-size: 22px; margin: 0 0 3px; line-height: 1.15; font-weight: 700; }
.hero h2 button { font-weight: 700; color: var(--label); }
.hero .c { color: var(--tint); font-size: 16px; display: block; margin-bottom: 8px; }
.facts { background: var(--card); border-radius: 12px; margin-top: 4px; }
.fact { display: flex; gap: 10px; padding: 9px 14px; font-size: 15px; position: relative; width: 100%; }
.fact + .fact::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.fact .k { color: var(--label2); width: 92px; flex: none; } .fact .v { flex: 1; min-width: 0; }
button.fact .v { color: var(--tint); }
.grp { margin: 22px 0 6px 14px; } .grp .gt { font-size: 16px; font-weight: 600; color: var(--label); } .grp .gs { font-size: 13px; color: var(--label2); }
.list.rows { margin-top: 14px; }
.grp + .list.rows { margin-top: 0; }
.row { position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 1; }
.rh { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 8px 11px 14px; min-height: 48px; }
.rh:active { background: var(--fill); }
.rh .main { flex: 1; min-width: 0; } .rh .t { font-size: 16px; }
.rh .t .d { font-size: 14px; color: var(--label2); white-space: nowrap; margin-left: 6px; }
.row.cur .rh .t { color: var(--tint); font-weight: 600; }
.rh .slot { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--label3); font-size: 15px; }
.rh .slot.go { border-radius: 17px; background: var(--tintSoft); color: var(--tint); font-size: 13px; }
.rb { display: none; padding: 0 0 10px; }
.row.open .rb { display: block; }
.rb .fact { font-size: 14px; padding: 7px 14px; }
.seek { position: relative; height: 22px; touch-action: none; margin: 4px 14px 0; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--track); } .seek .tr i { display: block; height: 100%; background: var(--tint); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--label2); margin: -2px 14px 0; }
.ctl { display: flex; align-items: center; justify-content: space-between; margin: 6px 18px 0; }
.ctl button { width: 48px; height: 44px; display: grid; place-items: center; font-size: 18px; }
.ctl button.pp { width: 56px; height: 56px; font-size: 24px; }

/* ---------- the player: a page washed with the colour of what plays ---------- */
.player-look { background: hsl(var(--h), 55%, 87%); transition: transform .35s cubic-bezier(.2,.8,.2,1), background-color 2.5s; }
@media (prefers-color-scheme: dark) { .player-look { background: hsl(var(--h), 42%, 15%); } }
.player-look .list, .player-look .facts, .player-look .nx { background: color-mix(in srgb, var(--card), hsl(var(--h), 60%, 55%) 9%); }
.cont { margin-top: 26px; }
.ch { display: flex; gap: 10px; align-items: center; margin: 0 0 8px 6px; }
.ch .cv { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; flex: none; }
.ch .m { min-width: 0; } .gt { font-size: 16px; font-weight: 600; color: var(--label); }
.cont .list.rows { margin-top: 0; }
.nx { display: flex; gap: 12px; align-items: center; width: 100%; margin-top: 14px; background: var(--card); border-radius: 12px; padding: 10px 12px; }
.nx .cv { width: 52px; height: 52px; border-radius: 6px; overflow: hidden; flex: none; }
.nx .m { flex: 1; min-width: 0; } .nx .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--label2); }
.nx .t { font-size: 16px; font-weight: 600; } .nx .s { font-size: 13px; color: var(--label2); } .nx .chev { color: var(--label3); }
.rr.now .fg { background: color-mix(in srgb, var(--card), var(--tint) 9%); }
.fm { width: 1.05em; height: 1.05em; vertical-align: -.12em; }
#arrow { position: fixed; right: calc(var(--barW) + 10px); width: 44px; height: 44px; border-radius: 22px; z-index: 9; display: none; place-items: center; font-size: 20px; color: var(--tint); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#arrow.up { top: calc(var(--top) + var(--navH) + 10px); display: grid; } #arrow.down { bottom: calc(var(--bot) + var(--tabH) + 16px); display: grid; }
body.onplayer #mini, body.gone #mini, body.gone #bar { opacity: 0; pointer-events: none; }
#mini, #bar { transition: opacity .4s; }
.hero.grow .art { animation: grow .55s cubic-bezier(.2,.8,.2,1); transform-origin: top left; }
.hero.grow > :not(.art) { animation: fadein .55s; }
@keyframes grow { from { transform: scale(.22); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.endq { margin: 26px 16px 0; text-align: center; font: italic 16px/1.4 ui-serif, Georgia, serif; color: var(--label2); animation: fadein 1.2s; }
@media (prefers-reduced-motion: reduce) { .hero.grow .art, .hero.grow > * { animation: none; } }

/* ---------- tabs, mini player, timeline, player (locked, ADR 0014) ---------- */
#tabs { position: fixed; left: 16px; right: calc(var(--barW) + 6px); bottom: var(--bot); height: var(--tabH); display: flex; gap: 8px; z-index: 5; transition: opacity .3s; }
#tabs .cap { flex: 1; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 1px; } #tabs .cap b { font-size: 20px; font-weight: 400; }
#tabs .cap .on { color: var(--tint); }
#tabs .circ { width: var(--tabH); border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); flex: none; }
#mini { position: fixed; left: 16px; right: var(--lineX); bottom: calc(var(--bot) + var(--tabH) + 8px); height: var(--miniH); z-index: 6;
  background: var(--card); border-radius: 18px 0 0 18px; box-shadow: 0 4px 18px rgba(0,0,0,.14); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; transition: opacity .3s; }
#mini .art { width: 58px; height: 58px; border-radius: 8px; overflow: hidden; flex: none; }
#mini .txt { flex: 1; min-width: 0; line-height: 1.22; }
#mini .mv { font-size: 15px; font-weight: 600; } #mini .by, #mini .wk { font-size: 13px; color: var(--label2); }
#mini .pp { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; font-size: 18px; flex: none; }
.mq { overflow: hidden; white-space: nowrap; } .mq span { display: inline-block; padding-right: 32px; }
.mq.run span { animation: mq var(--dur) linear infinite; }
@keyframes mq { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift)); } }
body.player #mini, body.player #tabs, body.player #navbar, body.player #navbg { opacity: 0; pointer-events: none; }
#bar { position: fixed; right: 0; width: var(--barW); top: var(--edgeTop); bottom: calc(var(--bot) + var(--tabH) + 8px); z-index: 20; touch-action: none; }
#bar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#bubble { position: fixed; right: calc(var(--barW) + 6px); z-index: 25; pointer-events: none; display: none; max-width: 250px; padding: 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.25; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#bubble b { color: var(--tint); font-weight: 600; }
#player { position: fixed; top: 0; left: 0; bottom: 0; right: var(--barW); z-index: 10; transform: translateX(-102%); transition: transform .4s cubic-bezier(.2,.8,.2,1); box-shadow: 6px 0 24px rgba(0,0,0,.12); background: var(--bg); color: var(--label); }
body.player #player { transform: none; }
#player .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top) + 100px) 6px calc(var(--bot) + 60px) 16px; }
#pin { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 46px); height: 52px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
#pin .close { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); display: grid; place-items: center; flex: none; font-size: 18px; }

/* prototype switches */
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 6px; right: 6px; z-index: 30; display: flex; gap: 5px; justify-content: center; }
#sw .p { display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; height: 34px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
#sw .p button, #sw .p a { color: #fff; height: 34px; padding: 0 9px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; text-decoration: none; }
#sw .p button.arr { font-size: 18px; padding: 0 8px; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 46px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }

/* ---------- people pages (this round) ---------- */
.pr .s .fm { width: .95em; height: .95em; }
.pr.ind { padding-left: 30px; } .pr.ind + .pr::before, .pr + .pr.ind::before { left: 30px; }
.pr.on .m { color: var(--tint); }
.pr.fold .chev { transition: transform .2s; } .pr.fold.open .chev { transform: rotate(90deg); }
.pr.fold .m { font-weight: 600; }
.sh .cnt { text-transform: none; }
.sh.sm2 { margin-top: 16px; }
.ch1 { display: flex; gap: 14px; align-items: center; margin: 4px 0 8px; }
.ch1 .m { min-width: 0; } .ch1 h1.pt { margin: 0; }
.face { flex: none; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.face.sm { width: 48px; height: 48px; } .face.lg { width: 112px; height: 112px; margin: 0 auto 10px; display: block; }
.yrs { font-size: 15px; color: var(--label2); }
.desc { font-size: 15px; color: var(--label2); margin: 2px 0 0; }
.bio { margin: 10px 0 0; } .bio p { margin: 0 0 8px; font-size: 15px; line-height: 1.42; }
.bio.short p:not(:first-child) { display: none; }
.bio.short p:first-child { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; }
.biob { display: flex; gap: 18px; margin: 4px 0 6px; font-size: 15px; }
.cred { font-size: 12px; color: var(--label2); line-height: 1.35; margin: 4px 0 0; }
.s2 { font-size: 12px; color: var(--label2); }
.lk.small { font-size: 13px; margin-top: 6px; display: inline-block; }
.foot0 { font-size: 13px; color: var(--label2); margin: 8px 0 0; line-height: 1.35; }
.pick { margin: 10px 0 0; } .pk-t { font-weight: 600; font-size: 17px; } .pk-s { font-size: 14px; color: var(--label2); margin: 2px 0 8px; line-height: 1.35; }
.banner { position: relative; margin: -6px -6px 0 -16px; height: 230px; overflow: hidden; }
.banner .img { position: absolute; inset: 0; }
.banner .shade2 { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 45%, rgba(0,0,0,.6)); }
.banner .nm { position: absolute; left: 16px; right: 60px; bottom: 12px; color: #fff; }
.banner .n { font-size: 28px; font-weight: 700; line-height: 1.1; } .banner .y { font-size: 15px; opacity: .85; }
.banner .info { position: absolute; right: 10px; bottom: 12px; width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-size: 17px; color: var(--label); }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 16px 0 4px; }
.seg button { flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.facts .fact .v { line-height: 1.3; }
.pr.rec { align-items: center; } .pr.rec .cv { width: 52px; height: 52px; border-radius: 6px; overflow: hidden; flex: none; }
.pr .t1 { font-size: 16px; } .pr.wk .t1 { font-weight: 600; }
.pr.rec.on .t1 { color: var(--tint); }
.phead { text-align: center; margin-top: 4px; } .phead h1.pt { margin: 0; }
.chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 8px 0 4px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 12px; background: var(--fill); color: var(--label2); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .cv { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }

function peopleAct(a, d, el) {

// ---------- covers ----------
let coverN = 0;
const hueOf = seed => { let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
function cover(albumId) {
  const a = ALBUMS[albumId], h = hueOf(a.title + a.label), b = (h + 50) % 360, sat = a.mono ? 0 : 1, id = "g" + (++coverN), r0 = RECS[a.recs[0]];
  return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},${45 * sat}%,${a.mono ? 22 : 36}%)"/><stop offset="1" stop-color="hsl(${b},${55 * sat}%,${a.mono ? 70 : 62}%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id})"/><text x="8" y="80" font-family="Georgia,serif" font-size="11" fill="rgba(255,255,255,.9)">${esc(surname(COMP[WORKS[r0.work].comp].name, COMP[WORKS[r0.work].comp].sort))}</text><text x="8" y="92" font-family="Georgia,serif" font-size="8" fill="rgba(255,255,255,.75)">${esc((r0.cond || r0.ens[0][1]).split(" ").pop())}</text></svg>`;
}

// ---------- what plays ----------
let P = null, T = 0;
function itemsOf(key) {
  const [kind, id] = key.split(":"), recs = kind === "rec" ? [id] : ALBUMS[id].recs;
  let s = 0, i = 0; const out = [];
  for (const rid of recs) for (const x of tracksOf(rid)) { out.push({ ...x, rec: rid, work: RECS[rid].work, i: i++, start: s }); s += x.d; }
  return out;
}
function setPlaying(key, at) { const items = itemsOf(key); P = { key, items, total: items.reduce((a, x) => a + x.d, 0) }; T = items[at || 0].start; S.playing = true; }
const cur = () => P.items.findLast(x => T >= x.start) || P.items[0];
const FERMATA = `<svg class="fm" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 17 C3.2 6.5, 20.8 6.5, 21.5 17 L19.3 17 C18.3 10, 5.7 10, 4.7 17 Z" fill="currentColor"/><circle cx="12" cy="15.4" r="2" fill="currentColor"/></svg>`;
const isPlayingRec = id => P && (P.key === "rec:" + id || (P.key.startsWith("album:") && cur().rec === id));
function commonOf(rid) { const t = tracksOf(rid), k = r => r.join("|"); return t[0].r.filter(r => t.every(x => x.r.some(y => k(y) === k(r)))); }
const extra = x => { const c = new Set(commonOf(x.rec).map(r => r.join("|"))); return x.r.filter(r => !c.has(r.join("|"))); };

// ---------- the player page ----------
// The player page is the page of the queue item that plays. When the queue moves on, it becomes the next item's page.
const loaded = () => !!P && !S.gone;
const isPlayerPage = key => loaded() && key === P.key;

// ---------- pages ----------
const pageOf = key => S.pages[key] ||= { open: new Set(), editing: false, order: null };
function titleOf(key) {
  const [k, id] = key.split(":");
  if (k === "lib") return "Library"; if (k === "comp") return CAND[id] ? surname(dispName(id), "") .split(" ").pop() : surname(COMP[id].name, COMP[id].sort);
  if (k === "work") return WORKS[id].title; if (k === "rec") return WORKS[RECS[id].work].title;
  if (k === "album") return ALBUMS[id].title; if (k === "perf") return decodeURIComponent(id);
  if (k === "perfs") return "Performers"; if (k === "genre") return plural(decodeURIComponent(key.split(":")[2]));
}
const link = (key, text, cls = "lk") => `<button class="${cls}" data-link="${key}">${esc(text)}</button>`;
const perfKey = n => "perf:" + encodeURIComponent(n);
const albumOfKey = key => key.startsWith("rec:") ? RECS[key.slice(4)].album : key.slice(6);

function pageHTML(key) {
  const [k, id] = key.split(":");
  if (k === "lib") return libHTML(); if (k === "perfs") return performersHTML();
  if (k === "comp") return composerHTML(id); if (k === "perf") return performerHTML(decodeURIComponent(id));
  if (k === "genre") return genreHTML(id, decodeURIComponent(key.split(":")[2]));
  if (k === "work") return workHTML(id);
  return playableHTML(key);

  const set = ev => { const r = sk.getBoundingClientRect(); T = x.start + Math.min(.999, Math.max(0, (ev.clientX - r.left) / r.width)) * x.d; tick(true); };
  set(e); sk.onpointermove = set; sk.onpointerup = () => sk.onpointermove = null;
});

// ---------- the timeline (locked) ----------
let G = null;
function drawBar() {
  const el = $("#bar"), H = el.clientHeight, n = P.items.length, gap = n > 12 ? 2 : 4, min = 3;
  let fixed = new Set(), k = 0; const avail = H - gap * (n - 1);
  for (let it = 0; it < 6; it++) { const free = P.items.filter(x => !fixed.has(x.i)).reduce((a, x) => a + x.d, 0); k = (avail - min * fixed.size) / free; let ch = false; for (const x of P.items) if (!fixed.has(x.i) && x.d * k < min) { fixed.add(x.i); ch = true; } if (!ch) break; }
  let y = 0; const segs = P.items.map(x => { const h = fixed.has(x.i) ? min : x.d * k; const s = { y, h }; y += h + gap; return s; });
  G = { y(t) { const x = P.items.findLast(x => t >= x.start) || P.items[0], s = segs[x.i]; return s.y + Math.min(1, (t - x.start) / x.d) * s.h; },
    t(py) { for (const x of P.items) { const s = segs[x.i]; if (py < s.y + s.h + gap / 2 || x.i === n - 1) return x.start + Math.min(1, Math.max(0, (py - s.y) / s.h)) * x.d; } return 0; } };
  const w = el.clientWidth, lx = w - 14;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><defs><clipPath id="pc"><rect id="pcr" x="0" y="0" width="${w}" height="0"/></clipPath></defs>`
    + `<g fill="var(--track)">${segs.map(s => `<rect x="${lx}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g>`
    + `<g fill="var(--tint)" clip-path="url(#pc)">${segs.map(s => `<rect x="${lx}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g></svg>`;
}
(() => {
  const el = $("#bar"); let on = false, mode = null, t = 0, x0 = 0, y0 = 0;
  const at = e => { const r = el.getBoundingClientRect(); t = G.t(e.clientY - r.top); const x = P.items.findLast(x => t >= x.start) || P.items[0], b = $("#bubble");
    b.style.display = "block"; b.style.top = Math.max(60, Math.min(innerHeight - 140, e.clientY - 30)) + "px";
    b.innerHTML = `<b class="tnum">${fmt(t - x.start)}</b> of ${fmt(x.d)}<br>${esc(x.t)}`; $("#pcr").setAttribute("height", G.y(t)); };
  el.onpointerdown = e => { on = true; mode = null; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => { if (!on) return; const dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0); if (!mode && (dx > 8 || dy > 8)) mode = dy > dx * 1.5 ? "scrub" : "ignore"; if (mode === "scrub") at(e); };
  el.onpointerup = el.onpointercancel = e => {
    if (!on) return; on = false; $("#bubble").style.display = "none";
    if (e.type === "pointerup" && mode === "scrub") { T = t; moved(); }
    else if (e.type === "pointerup" && !mode) { const r = el.getBoundingClientRect(), x = P.items.findLast(x => G.t(e.clientY - r.top) >= x.start) || P.items[0]; T = x.start; S.playing = true; moved(); }
    $("#pcr").setAttribute("height", G.y(T)); mode = null;
  };
})();


// ---------- swipe actions: the row's label changes in place, no toast ----------
let openSwipe = null;
function closeSwipe() { if (openSwipe) { openSwipe.querySelector(".fg").style.transform = ""; openSwipe = null; } }
function swipeAct(id, what) {
  const k = "rec:" + id;
  if (what === "next") { S.queue = [k, ...S.queue.filter(x => x !== k)]; }
  if (what === "queue") { if (!S.queue.includes(k)) S.queue.push(k); }
  if (what === "dl") { S.dl[id] == null ? S.dl[id] = 0 : delete S.dl[id]; }
  if (what === "fav") toggleFav(id); // the row stays where it is; the order changes the next time the page opens
  navigator.vibrate && navigator.vibrate(10);
  const row = openSwipe; closeSwipe();
  setTimeout(() => { const w = RECS[id].work; if (what === "fav" || what === "dl") paintList(w); else row && (row.querySelector(".st").textContent = stateText(id)); }, 260);
}
// Long press on a favourite, or the handle in Edit, lifts the row to reorder it.
let G2 = null, lpTimer = 0, dragRow = null;
document.addEventListener("pointerdown", e => {
  const fg = e.target.closest(".rr .fg"); if (!fg || openSwipe) return;
  const row = fg.closest(".rr"), pg = pageOf("work:" + row.dataset.w);
  G2 = { x: e.clientX, y: e.clientY, row, fg, mode: null, id: e.pointerId, dx: 0 };
  if (row.dataset.fav === "1" && (pg.editing ? e.target.closest(".hd") : true)) {
    const lift = () => { if (!G2) return; G2.mode = "drag"; dragRow = row; row.classList.add("lifted"); fg.classList.add("drag"); navigator.vibrate && navigator.vibrate(15); };
    if (pg.editing) lift(); else lpTimer = setTimeout(lift, 450);
  }
});
document.addEventListener("pointermove", e => {
  if (!G2) return; const dx = e.clientX - G2.x, dy = e.clientY - G2.y;
  if (G2.mode === "drag") { G2.row.style.transform = `translateY(${dy}px)`; return; }
  if (!G2.mode && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { clearTimeout(lpTimer); G2.mode = Math.abs(dx) > Math.abs(dy) * 1.5 && !pageOf("work:" + G2.row.dataset.w).editing ? "swipe" : "none"; if (G2.mode === "swipe") G2.fg.classList.add("drag"); }
  if (G2.mode === "swipe") { G2.dx = Math.max(-168, Math.min(168, dx)); G2.fg.style.transform = `translateX(${G2.dx}px)`; }
});
const endPointer = e => {
  clearTimeout(lpTimer); if (!G2) return; const g = G2; G2 = null;
  if (g.mode === "swipe") { g.fg.classList.remove("drag"); suppressUntil = Date.now() + 300;
    if (Math.abs(g.dx) > 60) { g.fg.style.transform = `translateX(${g.dx > 0 ? 168 : -168}px)`; openSwipe = g.row; } else g.fg.style.transform = ""; }
  if (g.mode === "drag") { suppressUntil = Date.now() + 300; const w = g.row.dataset.w, pg = pageOf("work:" + w), favs = [...g.row.parentNode.querySelectorAll('.rr[data-fav="1"]')];
    const y = e.clientY, others = favs.filter(r => r !== g.row), idx = others.filter(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 < y; }).length;
    const ids = others.map(r => r.dataset.rec); ids.splice(idx, 0, g.row.dataset.rec);
    FAV[w] = ids; pg.order = ordered(w); g.row.style.transform = ""; dragRow = null; paintList(w); }
};
document.addEventListener("pointerup", endPointer); document.addEventListener("pointercancel", endPointer);
document.addEventListener("touchmove", e => { if (dragRow || (G2 && G2.mode === "swipe")) e.preventDefault(); }, { passive: false });


// ---------- per frame ----------
let t0 = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - t0) / 1000); t0 = now;
  if (S.playing && !S.ended) { T += dt; if (T >= P.total) advance(1); }
  for (const id in S.dl) if (S.dl[id] < 1) S.dl[id] = Math.min(1, S.dl[id] + dt / 12);
  if (now - slow > 250) { slow = now; tick(); arrow(); document.querySelectorAll(".st[data-st]").forEach(s => { const t = stateText(s.dataset.st); if (s.textContent !== t) s.textContent = t; });
    if (Date.now() - lastTouch > IDLE) placeNow(true); }
  requestAnimationFrame(frame);
}

// ---------- switches ----------
const VTXT = {
  c: { A: "Composer A, Inline: portrait and bio on the page. More shows the whole lead. Groupings open in place.",
       B: "Composer B, Tabs: a wide portrait, then Works and About. A genre opens its own page.",
       C: "Composer C, Sheet: works first. About opens a sheet. One Group menu for every composer." },
  p: { A: "Performer A, By composer: one kind of page for everyone, recordings under each composer.",
       B: "Performer B, By work: photo and roles, recordings under each work, then who they play with.",
       C: "Performer C, Albums: the albums they are on, newest first." } };
function pills() { $("#cvl").textContent = "Composer " + S.cv; $("#pvl").textContent = "Performer " + S.pv; }
document.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => {
  const k = b.dataset.sv, v = k + "v", keys = "ABC"; S[v] = keys[(keys.indexOf(S[v]) + +b.dataset.d + 3) % 3];
  history.replaceState(null, "", "?" + new URLSearchParams({ c: S.cv, p: S.pv })); pills(); closeOverlays(); repaintPeople(); toast(VTXT[k][S[v]]);
});
let tt = 0;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
addEventListener("resize", () => { drawBar(); tick(true); });

// Start: Kleiber's Fifth plays after Die Schöpfung, and Harnoncourt's Sixth is next. The listener is on the Fifth's work page.
S.history = ["rec:ja09"]; S.queue = ["rec:ha90b"]; setPlaying("rec:k74", 1); T += 40;
pills();
for (const k of ["lib", "comp:lvb"]) { const e = { key: k, el: makePage(k) }; stack.push(e); paint(e); }
layout(); renderMini(); drawBar(); repaintLive(); requestAnimationFrame(frame);
toast(VTXT.c[S.cv]);
</script>
