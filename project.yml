name: Klassik
options:
  bundleIdPrefix: de.whnr
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.24.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Klassik:
    type: application
    platform: iOS
    sources: [Klassik]
    dependencies:
      - target: TaskRegistry
      - target: KlassikEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.whnr.klassik
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Klassik/Tokens.swift holds the typed colour names (ADR 0021); the generator costs about 40 s of each CI build.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Klassik/Info.plist
      properties:
        CFBundleDisplayName: Klassik
        CFBundleDevelopmentRegion: en
        # Every language of the String Catalogs (Klassik/Localizable.xcstrings, InfoPlist.xcstrings). iOS offers them in
        # Settings, Klassik, Language. scripts/l10n_check.py fails when this list and the catalogs differ.
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [de.whnr.klassik.people]
        NSLocalNetworkUsageDescription: Klassik connects to your music server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  TaskRegistry:
    type: library.static
    platform: iOS
    sources: [TaskRegistry]
    settings:
      base:
        # Swift 6 checks handler isolation only at a boundary to Swift 5 code, as at the Objective-C API.
        SWIFT_VERSION: "5.0"
  # The playback engine, apart from the app, so that another app can link it. It knows no server model: the app maps
  # its songs to `PlaybackTrack`.
  KlassikEngine:
    type: library.static
    platform: iOS
    sources: [KlassikEngine]
  # The Playback Lab: a separate app on the engine, with its own bundle id and its own TestFlight lane. It holds no
  # audio cache and no library database.
  KlassikLab:
    type: application
    platform: iOS
    sources: [KlassikLab]
    dependencies:
      - target: KlassikEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.whnr.klassik.lab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    info:
      path: KlassikLab/Info.plist
      properties:
        CFBundleDisplayName: Playback Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Playback Lab connects to your test server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  KlassikLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KlassikLabTests]
    dependencies:
      - target: KlassikLab
      - target: KlassikEngine
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KlassikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KlassikTests]
    dependencies:
      - target: Klassik
      # The app links the libraries. A second copy in the tests would give the fake another protocol.
      - target: TaskRegistry
        link: false
      - target: KlassikEngine
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KlassikUITests:
    type: bundle.ui-testing
    platform: iOS
    # The walk measures the screens against the same layout tokens as the app. `Tokens.swift` reads the palette
    # overrides and the accent pick, so their files come along.
    sources:
      [
        KlassikUITests, Klassik/Tokens.swift, Klassik/Layout.swift, Klassik/PaletteOverrides.swift,
        Klassik/Accent.swift, Klassik/Localization.swift,
      ]
    dependencies:
      - target: Klassik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Klassik:
    build:
      targets:
        Klassik: all
    test:
      # Automatic video capture competes with UI automation on the simulator.
      preferredScreenCaptureFormat: screenshots
      targets: [KlassikTests, KlassikUITests]
  # TestFlight gets a Release build, which can differ from the debug build at run time.
  KlassikRelease:
    build:
      targets:
        Klassik: all
    test:
      config: Release
      preferredScreenCaptureFormat: screenshots
      targets: [KlassikUITests]
  # The Lab has its own scheme, so that building or archiving it never touches the Klassik schemes.
  KlassikLab:
    build:
      targets:
        KlassikLab: all
    test:
      targets: [KlassikLabTests]
