name: Test

# One build runs unit tests and supplies the requested UI shards.
# Main pushes run no walk. Nightly runs and release pull requests walk every group.
# UI_TESTS_REQUIRED controls whether a failed walk blocks the run.
# A push that changes only documentation starts no run. TestFlight accepts such a commit through
# scripts/green_test_gate.py, which keeps the same ignore list.
on:
  push:
    branches: [ci, main]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  schedule:
    - cron: "23 3 * * *"
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:
    inputs:
      ui:
        description: 'Walk the screens: "all", or areas such as "browse,settings"'
        type: string
        default: ""

# A newer push cancels only a pull request's older run. Any other run has its own group:
# a shared group would drop a queued run when a newer one arrives, and TestFlight needs
# a complete run for each commit on main.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which UI groups run, so an unrequested walk starts no macOS runner.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.plan.outputs.ui }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.ui }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        # Explicit bash adds pipefail, so a parser error fails this job and not only the walk's matrix.
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[].commit.message' > "$RUNNER_TEMP/messages"
          else
            : > "$RUNNER_TEMP/messages"
          fi
          python3 scripts/screen_report.py plan "$EVENT" "$INPUT" "$TITLE" "$GITHUB_REF" < "$RUNNER_TEMP/messages" | tee -a "$GITHUB_OUTPUT"

  # Runs on Linux, because macOS runner time is expensive. The macOS job starts only on clean code.
  lint:
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint.sh

  # The view code takes its layout numbers from Klassik/Layout.swift, and each of those cites the specimen CSS.
  # The swift image has no Python, so these checks run on their own runner.
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/layout_tokens.py --check
      - run: python3 scripts/layout_lint.py
      - run: python3 -m unittest discover -s scripts -p "test_layout.py"

  # Generate audio on Linux to keep package installation off the macOS runners.
  # The tarball keeps the colons in the file names, which artifact paths reject.
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # A pinned static build: the Ubuntu mirror can take ten minutes for ffmpeg's packages.
      # BtbN prunes old builds; when this one is gone the step warns and falls back to apt.
      - name: Install ffmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
          FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79
        run: |
          if curl -sfL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL" \
            && echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c --quiet; then
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg'
            echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          else
            echo "::warning::The pinned ffmpeg build is gone or changed; installing from apt. Pin a newer build."
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: ffmpeg -version | head -1
      - run: pip install mutagen
      - run: python3 scripts/fixtures.py fixture/music && tar czf fixture-music.tgz -C fixture music
      - name: Generate audio for the UI walk
        run: python3 scripts/fixtures.py fixture-ui/music 120 && tar czf fixture-ui-music.tgz -C fixture-ui music
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-ui-music
          path: fixture-ui-music.tgz
          retention-days: 1
      - name: Test the CI scripts
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-music
          path: fixture-music.tgz
          retention-days: 1

  build:
    needs: [lint, layout, fixtures]
    runs-on: xcode-27
    timeout-minutes: 40
    # The xcode-27 image holds the iOS 27 SDK. Its default Xcode 27.1 has one simulator on its own iOS;
    # Xcode 27.2 matches the newest simulator runtime.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The runner image includes devices whose watchOS and tvOS runtimes are absent.
      - name: Remove unavailable runner simulators
        run: xcrun simctl delete unavailable
      # The cached DerivedData helps only if unchanged files keep their time.
      - run: python3 scripts/git_mtimes.py
      - id: xcode
        env:
          SOURCES_HASH: ${{ hashFiles('project.yml', 'Klassik/**', 'KlassikTests/**', 'KlassikUITests/**') }}
        run: |
          echo "version=$(xcodebuild -version | tr -s '\n ' '--')" >> "$GITHUB_OUTPUT"
          echo "sources=$SOURCES_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: build/DerivedData
          key: deriveddata-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.sources }}
          restore-keys: deriveddata-${{ steps.xcode.outputs.version }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/download-artifact@v8
        with:
          name: fixture-music
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/fixture" && tar xzf "$RUNNER_TEMP/fixture-music.tgz" -C "$RUNNER_TEMP/fixture"
      - name: Start Navidrome on the fixture library
        run: scripts/fixture-server.sh "$RUNNER_TEMP/fixture"
      - name: Build and run unit tests
        env:
          KLASSIK_UI: "false"
          KLASSIK_PHASE: all
        run: |
          scripts/screens.sh "$RUNNER_TEMP/build-report"
          tar czf "$RUNNER_TEMP/test-products.tgz" -C build/DerivedData/Build Products
      - uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: ${{ runner.temp }}/test-products.tgz
          retention-days: 1
      - name: Build timing
        if: always()
        run: |
          cat "$RUNNER_TEMP/build-report/timings.txt" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$RUNNER_TEMP/build-report/"*-retries.txt >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/screen_report.py console "$RUNNER_TEMP/build-report/"*-console.txt >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-report
          path: |
            ${{ runner.temp }}/build-report/*.txt
            ${{ runner.temp }}/build-report/*.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-xcresult
          path: ${{ runner.temp }}/build-report/*.xcresult

  # The groups are UI_GROUPS in scripts/screen_report.py; the plan job drops the unrequested ones.
  walk:
    if: needs.plan.outputs.ui != 'false'
    needs: [plan, build, fixtures]
    runs-on: xcode-27
    # A failed test gets one retry within its shard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      # The runner image includes devices whose watchOS and tvOS runtimes are absent.
      - name: Remove unavailable runner simulators
        run: xcrun simctl delete unavailable
      - name: Boot the simulator early
        run: scripts/start-simulator.sh
      - name: Choose the UI areas
        id: ui
        env:
          INPUT: ${{ needs.plan.outputs.ui }}
          AREAS: ${{ matrix.areas }}
        run: |
          selected=$(python3 scripts/screen_report.py select "$INPUT" "$AREAS")
          echo "ui=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}
      - run: mkdir -p build/DerivedData/Build && tar xzf "$RUNNER_TEMP/test-products.tgz" -C build/DerivedData/Build
      - uses: actions/download-artifact@v8
        with:
          name: fixture-ui-music
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/fixture" && tar xzf "$RUNNER_TEMP/fixture-ui-music.tgz" -C "$RUNNER_TEMP/fixture"
      - name: Start Navidrome on the fixture library
        run: scripts/fixture-server.sh "$RUNNER_TEMP/fixture"
      - name: Run the tests
        env:
          KLASSIK_PHASE: ui
          KLASSIK_UI_TESTS: ${{ matrix.tests }}
          KLASSIK_UI: ${{ steps.ui.outputs.ui }}
          UI_TESTS_REQUIRED: ${{ vars.UI_TESTS_REQUIRED || 'false' }}
        run: scripts/screens.sh "$RUNNER_TEMP/screens"
      - name: Results and time of each phase
        id: report
        if: always()
        run: |
          out="$RUNNER_TEMP/screens"
          mkdir -p "$out"
          python3 scripts/screen_report.py summary "$out" >> "$GITHUB_STEP_SUMMARY"
          cat "$out/timings.txt" >> "$GITHUB_STEP_SUMMARY" || true
          python3 scripts/screen_report.py console "$out/"*-console.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "ui=$(grep '^ui=' "$out/results.txt" | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: walk-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/screens/*.png
            ${{ runner.temp }}/screens/*.txt
            ${{ runner.temp }}/screens/*.log
      - name: Navidrome log
        if: failure() || steps.report.outputs.ui == 'failed'
        run: tail -50 "$RUNNER_TEMP/fixture/navidrome.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-xcresult-${{ matrix.group }}
          path: ${{ runner.temp }}/screens/*.xcresult

  # TestFlight gets an optimized Release build. This job opens one after a login and after a relaunch.
  release-launch:
    needs: [lint, layout, fixtures]
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      # The runner image includes devices whose watchOS and tvOS runtimes are absent.
      - name: Remove unavailable runner simulators
        run: xcrun simctl delete unavailable
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/download-artifact@v8
        with:
          name: fixture-music
          path: ${{ runner.temp }}
      - run: mkdir -p "$RUNNER_TEMP/fixture" && tar xzf "$RUNNER_TEMP/fixture-music.tgz" -C "$RUNNER_TEMP/fixture"
      - name: Start Navidrome on the fixture library
        run: scripts/fixture-server.sh "$RUNNER_TEMP/fixture"
      - name: Open a Release build
        run: scripts/release-launch.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-launch
          path: |
            ${{ runner.temp }}/release/*.txt
            ${{ runner.temp }}/release/*.log
            ${{ runner.temp }}/release/*.xcresult

  # Keep the public artifact and check names stable for comparisons and release checks.
  test:
    needs: [plan, build, walk, release-launch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      screens: ${{ steps.report.outputs.screens }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: walk-*
          path: reports
      - name: Preserve the single walk report directory
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          # A single artifact downloads directly into reports, without its artifact directory.
          if [ -f reports/results.txt ]; then
            group=$(jq -er '.include | select(length == 1) | .[0].group' <<< "$MATRIX")
            mkdir -p "reports/walk-$group"
            find reports -maxdepth 1 -type f -exec mv -t "reports/walk-$group" {} +
          fi
      - uses: actions/download-artifact@v8
        with:
          name: build-report
          path: reports/build-report
      - name: Collect screenshots and results
        id: report
        env:
          INPUT: ${{ needs.plan.outputs.ui }}
          BUILD: ${{ needs.build.result }}
          WALK: ${{ needs.walk.result }}
          UI_TESTS_REQUIRED: ${{ vars.UI_TESTS_REQUIRED || 'false' }}
        run: |
          mkdir -p screens
          find reports -name '*.png' -exec cp {} screens/ \;
          for report in reports/*; do
            [ -d "$report" ] || continue
            for file in "$report"/*.txt "$report"/*.log; do
              [ -f "$file" ] || continue
              cp "$file" "screens/$(basename "$report")-$(basename "$file")"
            done
            if [ -f "$report/timings.txt" ]; then
              echo "### $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
              cat "$report/timings.txt" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          if [ -f reports/build-report/gapless-report.txt ]; then
            cp reports/build-report/gapless-report.txt screens/
          fi
          {
            echo "ui_areas=$INPUT"
            echo "ui_required=$UI_TESTS_REQUIRED"
            echo "build=$([ "$BUILD" = success ] && echo passed || echo failed)"
            grep '^unit=' reports/build-report/results.txt | tail -1 || echo 'unit=not run'
          } > screens/results.txt
          incomplete=0
          python3 scripts/screen_report.py aggregate-ui reports "$INPUT" >> screens/results.txt || incomplete=$?
          python3 scripts/screen_report.py summary screens >> "$GITHUB_STEP_SUMMARY"
          if ls screens/*.png >/dev/null 2>&1; then echo screens=true; else echo screens=false; fi >> "$GITHUB_OUTPUT"
          exit "$incomplete"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens
          path: screens
      - name: Require plan, build, test and release launch jobs
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          WALK: ${{ needs.walk.result }}
          RELEASE: ${{ needs.release-launch.result }}
        run: |
          test "$PLAN" = success && test "$BUILD" = success && { test "$WALK" = success || test "$WALK" = skipped; } && test "$RELEASE" = success

  # The diff informs; it never fails the run. It runs when screenshots exist, also after a failed test job.
  # Without screenshots the job shows as skipped, and the summary of test says why.
  screens-diff:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.screens == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: screens
          path: current
      - run: pip install pillow numpy
      - name: Collect the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/screen_baseline.py current baseline
      - name: Compare
        run: python3 scripts/screen_diff.py baseline current screens-diff
      # A comparison that did not finish must read as skipped, not as a clean result.
      - name: Report
        if: always()
        run: |
          python3 scripts/screen_report.py diff current screens-diff baseline >> "$GITHUB_STEP_SUMMARY"
          cat screens-diff/diff.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: warn
          name: screens-diff
          path: screens-diff
