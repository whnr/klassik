<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.6, round 2. A function sample, not the future UI.
  Locked in round 1: Levels. Periods, then the composers of one period, then one composer.
  Question: a cleaner composer level. A move to another composer glides, without a zoom. Every composer shows the dots of works the library holds. ?variant=A|B|C.
  A Side lines: the nearest contemporaries stand left of the focus line; a tap glides one into focus.
  B Carousel: every composer in birth order; swipe sideways, or tap a line.
  C Label column: the contemporaries form a staircase; the focus names its works in a column on the right.
  Fixed: years run down; a set is one dot with a count;
  undated works collect at the end of the composer line; no filters; a tap on a work opens its work page.
  Data: real composers, life dates and well-known works (public facts). What "your library" holds is generated.
  Some dates are removed on purpose to show undated works. No audio, no cover art.
-->

<title>Chronology, round 2</title>
<style>

/* ---------- the place: title, state line, drawing area ---------- */

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Q = new URLSearchParams(location.search);
const VARIANTS = { A: "Side lines", B: "Carousel", C: "Label column" };
const V = VARIANTS[Q.get("variant")] ? Q.get("variant") : "A";
document.body.classList.add("v" + V);

// ---------- sample library: real composers and dates, generated holdings ----------
// [surname, full name, born, died or null, works]. A work is [title, year or null, set size, last year].
// A null year is an undated work: some are removed on purpose.
const RAW = [

  ["Mozart", "Wolfgang Amadeus Mozart", 1756, 1791, [["Sinfonia concertante, K. 364", 1779], ["Piano Concerto No. 21, K. 467", 1785], ["Le nozze di Figaro", 1786], ["Don Giovanni", 1787], ["Eine kleine Nachtmusik", 1787], ["Symphony No. 40, K. 550", 1788], ["Symphony No. 41 “Jupiter”", 1788], ["Clarinet Concerto, K. 622", 1791], ["Die Zauberflöte", 1791], ["Requiem, K. 626", 1791]]],
  ["Beethoven", "Ludwig van Beethoven", 1770, 1827, [["Piano Sonatas, Op. 2", 1795, 3], ["Piano Sonata No. 14 “Moonlight”", 1801], ["Symphony No. 3 “Eroica”", 1804], ["Violin Concerto, Op. 61", 1806], ["Symphony No. 5, Op. 67", 1808], ["Symphony No. 6 “Pastoral”", 1808], ["Piano Concerto No. 5 “Emperor”", 1809], ["Missa solemnis", 1823], ["Symphony No. 9, Op. 125", 1824], ["String Quartet No. 14, Op. 131", 1826]]],
  ["Schubert", "Franz Schubert", 1797, 1828, [["Erlkönig", 1815], ["Piano Quintet “Trout”", 1819], ["Symphony No. 8 “Unfinished”", 1822], ["Die schöne Müllerin", 1823], ["Symphony No. 9 “Great”", 1826], ["Winterreise", 1827], ["Impromptus, D. 899", 1827, 4], ["String Quintet, D. 956", 1828]]],
  ["Mendelssohn", "Felix Mendelssohn", 1809, 1847, [["Octet, Op. 20", 1825], ["A Midsummer Night's Dream, Overture", 1826], ["The Hebrides", 1830], ["Symphony No. 4 “Italian”", 1833], ["Violin Concerto in E minor", 1844], ["Elijah", 1846]]],
  ["Chopin", "Frédéric Chopin", 1810, 1849, [["Piano Concerto No. 2", 1830], ["Piano Concerto No. 1", 1830], ["Études, Op. 10", 1829, 12, 1832], ["Ballade No. 1", 1835], ["Études, Op. 25", 1835, 12, 1837], ["Préludes, Op. 28", 1839, 24], ["Piano Sonata No. 2", 1839], ["Polonaise, Op. 53", 1842], ["Barcarolle, Op. 60", 1846], ["Nocturne in C-sharp minor, B. 49", null], ["Waltz in A minor, B. 150", null], ["Mazurkas, Op. 17", null]]],
  ["Schumann", "Robert Schumann", 1810, 1856, [["Carnaval", 1835], ["Kinderszenen", 1838], ["Kreisleriana", 1838], ["Dichterliebe", 1840], ["Piano Concerto", 1845], ["Symphony No. 3 “Rhenish”", 1850]]],
  ["Liszt", "Franz Liszt", 1811, 1886, [["Hungarian Rhapsodies", 1846, 19, 1885], ["Piano Sonata in B minor", 1853], ["Les préludes", 1854], ["A Faust Symphony", 1857], ["Liebestraum No. 3", null]]],
  ["Wagner", "Richard Wagner", 1813, 1883, [["Der fliegende Holländer", 1843], ["Tannhäuser", 1845], ["Tristan und Isolde", 1859], ["Die Meistersinger von Nürnberg", 1867], ["Siegfried Idyll", 1870], ["Götterdämmerung", 1874], ["Parsifal", 1882]]],
  ["Verdi", "Giuseppe Verdi", 1813, 1901, [["Nabucco", 1842], ["Rigoletto", 1851], ["La traviata", 1853], ["Aida", 1871], ["Messa da Requiem", 1874], ["Otello", 1887], ["Falstaff", 1893]]],
  ["Brahms", "Johannes Brahms", 1833, 1897, [["Piano Concerto No. 1", 1858], ["Ein deutsches Requiem", 1868], ["Hungarian Dances", 1869, 21], ["Symphony No. 1", 1876], ["Violin Concerto", 1878], ["Symphony No. 4", 1885], ["Clarinet Quintet", 1891]]],
  ["Tchaikovsky", "Pyotr Ilyich Tchaikovsky", 1840, 1893, [["Romeo and Juliet", 1870], ["Piano Concerto No. 1", 1875], ["Swan Lake", 1876], ["Violin Concerto", 1878], ["Eugene Onegin", 1878], ["The Nutcracker", 1892], ["Symphony No. 6 “Pathétique”", 1893]]],
  ["Dvořák", "Antonín Dvořák", 1841, 1904, [["Slavonic Dances, Op. 46", 1878, 8], ["Symphony No. 9 “From the New World”", 1893], ["String Quartet No. 12 “American”", 1893], ["Cello Concerto", 1895], ["Rusalka", 1901]]],
  ["Mahler", "Gustav Mahler", 1860, 1911, [["Symphony No. 1", 1888], ["Symphony No. 2 “Resurrection”", 1894], ["Symphony No. 5", 1902], ["Kindertotenlieder", 1904], ["Das Lied von der Erde", 1909], ["Symphony No. 9", 1909]]],
  ["Debussy", "Claude Debussy", 1862, 1918, [["Suite bergamasque", 1890], ["String Quartet", 1893], ["Prélude à l'après-midi d'un faune", 1894], ["La mer", 1905], ["Préludes, Book I", 1910, 12], ["Jeux", 1913]]],
  ["Strauss", "Richard Strauss", 1864, 1949, [["Don Juan", 1888], ["Also sprach Zarathustra", 1896], ["Salome", 1905], ["Der Rosenkavalier", 1910], ["Metamorphosen", 1945], ["Vier letzte Lieder", 1948]]],
  ["Rachmaninoff", "Sergei Rachmaninoff", 1873, 1943, [["Piano Concerto No. 2", 1901], ["Piano Concerto No. 3", 1909], ["All-Night Vigil", 1915], ["Rhapsody on a Theme of Paganini", 1934], ["Symphonic Dances", 1940]]],
  ["Ravel", "Maurice Ravel", 1875, 1937, [["String Quartet", 1903], ["Daphnis et Chloé", 1912], ["Le tombeau de Couperin", 1917], ["Boléro", 1928], ["Piano Concerto in G", 1931]]],
  ["Bartók", "Béla Bartók", 1881, 1945, [["Bluebeard's Castle", 1911], ["Music for Strings, Percussion and Celesta", 1936], ["Concerto for Orchestra", 1943]]],
  ["Stravinsky", "Igor Stravinsky", 1882, 1971, [["The Firebird", 1910], ["Petrushka", 1911], ["The Rite of Spring", 1913], ["Symphony of Psalms", 1930], ["Agon", 1957]]],
  ["Shostakovich", "Dmitri Shostakovich", 1906, 1975, [["Symphony No. 5", 1937], ["Symphony No. 7 “Leningrad”", 1941], ["24 Preludes and Fugues, Op. 87", 1951, 24], ["Symphony No. 10", 1953], ["String Quartet No. 8", 1960]]],
  ["Messiaen", "Olivier Messiaen", 1908, 1992, [["Quatuor pour la fin du temps", 1941], ["Turangalîla-Symphonie", 1948], ["Des canyons aux étoiles…", 1974]]],
  ["Britten", "Benjamin Britten", 1913, 1976, [["Peter Grimes", 1945], ["The Young Person's Guide to the Orchestra", 1946], ["War Requiem", 1962]]],
  ["Pärt", "Arvo Pärt", 1935, null, [["Tabula rasa", 1977], ["Fratres", 1977], ["Spiegel im Spiegel", 1978], ["Te Deum", 1985]]],
  ["Reich", "Steve Reich", 1936, null, [["Drumming", 1971], ["Music for 18 Musicians", 1976], ["Different Trains", 1988]]],
  ["Glass", "Philip Glass", 1937, null, [["Einstein on the Beach", 1976], ["Glassworks", 1982], ["Violin Concerto No. 1", 1987]]],
];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NOW = 2026;
// The periods of ADR 0011. A composer belongs to the period of the year they turned 35, or of their death if it came first.
const PERIODS = [["Early Music", null, 1600], ["Baroque", 1600, 1750], ["Classical", 1750, 1820], ["Romantic", 1820, 1910], ["Modern", 1910, 1975], ["Contemporary", 1975, null]]
  .map(([name, start, end], i) => ({ i, name, start, end }));
const periodOfYear = y => PERIODS.findLast(p => (p.start ?? -1e9) <= y);
const COMPS = RAW.map(([n, full, b, d, ws], i) => {
  const c = { i, n, full, b, d, end: d ?? NOW };
  c.works = ws.map(([t, y, set, y2], j) => ({ id: `${i}-${j}`, t, y, set: set || 0, y2: y2 || y, c, rec: 1 + Math.floor(rnd() * 4) }));
  c.dated = c.works.filter(w => w.y != null).sort((a, b) => a.y - b.y);
  c.undated = c.works.filter(w => w.y == null);
  c.period = periodOfYear(Math.min(b + 35, c.end));
  return c;
});
const NWORKS = COMPS.reduce((s, c) => s + c.works.length, 0);

// ---------- the year axis: the empty centuries after Hildegard fold into a short gap ----------
const Y0 = 1090, F0 = 1185, F1 = 1560, FOLD = 14, YEND = 2030;
const U = y => y <= F0 ? y - Y0 : y < F1 ? (F0 - Y0) + (y - F0) * FOLD / (F1 - F0) : (F0 - Y0) + FOLD + (y - F1);
const Yr = u => { const a = F0 - Y0; return u <= a ? u + Y0 : u < a + FOLD ? F0 + (u - a) * (F1 - F0) / FOLD : F1 + (u - a - FOLD); };
const UT = U(YEND);

// Packed lanes: a composer reuses the lane of one who died before they were born.
const laneEnd = [];
for (const c of COMPS) {
  let l = laneEnd.findIndex(e => e + 3 < c.b);
  if (l < 0) { l = laneEnd.length; laneEnd.push(0); }
  laneEnd[l] = c.end + (c.undated.length ? 6 : 0); c.lane = l;
}
const NL = laneEnd.length;

// ---------- drawing basics ----------
const cv = $("#cv"), area = $("#area"), spacer = $("#spacer");

  const parts = [["All periods", 0]];
  if (Cz.lvl >= 1) parts.push([Cz.p.name, 1]);
  if (Cz.lvl === 2) parts.push([Cz.c.n, 2]);
  const hint = ["tap a period", "tap a composer", V === "B" ? "swipe sideways, or tap a line" : "tap a work, or another line"][Cz.lvl];
  state.innerHTML = parts.map(([s, l], i) => `<span class="cr${i === parts.length - 1 ? " here" : ""}" data-l="${l}">${esc(s)}</span>`).join(`<span class="sepc">›</span>`) + `<span class="sepc">·</span>${hint}`;
}
state.addEventListener("click", e => { const s = e.target.closest(".cr"); if (!s) return; const l = +s.dataset.l; if (l < Cz.lvl) cGo(l, Cz.p, Cz.c, W / 2, H / 2, -1); });
// A level change zooms the old picture out of the way and the new one in, around the tapped point.
const off = document.createElement("canvas"), offB = document.createElement("canvas");
function cGo(lvl, p, c, ax, ay, dir) {
  select(null);
  off.width = cv.width; off.height = cv.height; off.getContext("2d").drawImage(cv, 0, 0);
  Cz.lvl = lvl; Cz.p = p; Cz.c = c; if (lvl === 2) l2Enter(c); cCrumbs();
  offB.width = cv.width; offB.height = cv.height; const gb = offB.getContext("2d"); gb.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCLevel(gb);
  const t0 = performance.now();
  Cz.anim = t => {
    const k = Math.min(1, (t - t0) / 340), e = 1 - Math.pow(1 - k, 3);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    const so = dir > 0 ? 1 + .6 * e : 1 - .3 * e, sn = dir > 0 ? .7 + .3 * e : 1.5 - .5 * e;
    const X = ax * dpr, Y = ay * dpr;
    ctx.globalAlpha = 1 - e; ctx.setTransform(so, 0, 0, so, X - X * so, Y - Y * so); ctx.drawImage(off, 0, 0);
    ctx.globalAlpha = e; ctx.setTransform(sn, 0, 0, sn, X - X * sn, Y - Y * sn); ctx.drawImage(offB, 0, 0);
    ctx.restore();
    if (k < 1) requestAnimationFrame(Cz.anim); else { Cz.anim = null; draw(); }
  };
  requestAnimationFrame(Cz.anim);
}
function cTap(x, y) {
  const h = hitAt(x, y);
  if (!h) return select(null);
  if (h.kind === "period") return cGo(1, h.obj, null, x, y, 1);
  if (h.kind === "zoomc") return cGo(2, Cz.p, h.obj, x, y, 1);
  if (h.kind === "lateral") return glideTo(h.obj);
  select(h.kind, h.obj);
}

// =====================================================================
// shared: drawing, taps, gestures, switcher
// =====================================================================
function draw() { if (!W || Cz.anim) return; drawCLevel(ctx); }
let down = null, tap = null;
area.addEventListener("pointerdown", e => {
  const r = area.getBoundingClientRect();
  down = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX - r.left, ly: e.clientY - r.top, px: e.clientX, moved: false, id: e.pointerId, v: 0 };
  if (V === "B" && Cz.lvl === 2) { L2.anim = null; area.setPointerCapture(e.pointerId); }
});
area.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
  // B: the lines follow the finger sideways
  if (V === "B" && Cz.lvl === 2 && down.moved) {
    const dp = -(e.clientX - down.px) / DB; down.px = e.clientX; down.v = dp;
    L2.p = Math.max(0, Math.min(BYBIRTH.length - 1, L2.p + dp)); L2.scene = sceneAt(L2.p); draw();
  }
});
area.addEventListener("pointerup", e => {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  tap = !d.moved && performance.now() - d.t < 600 ? d : null;
  if (!tap && V === "B" && Cz.lvl === 2) { const i = Math.max(0, Math.min(BYBIRTH.length - 1, Math.round(L2.p + d.v * 4))); glideTo(BYBIRTH[i]); }
});
// A tap acts on click, after the browser has placed it. A card that opens under the finger cannot catch the same tap.
area.addEventListener("click", () => { const d = tap; tap = null; if (d) cTap(d.lx, d.ly); });
area.addEventListener("pointercancel", () => { down = null; });
document.addEventListener("gesturestart", e => e.preventDefault());

const keys = Object.keys(VARIANTS);
function goVariant(d) { const i = (keys.indexOf(V) + d + keys.length) % keys.length; location.search = "?variant=" + keys[i]; }
$("#vname").textContent = `${V} · ${VARIANTS[V]}`;
$("#prev").onclick = () => goVariant(-1); $("#next").onclick = () => goVariant(1);
$("#reset").href = "?variant=" + V;
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") goVariant(-1); if (e.key === "ArrowRight") goVariant(1); });

function boot() { readColors(); sizeCanvas(); spacer.style.height = "0"; cCrumbs(); draw(); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); mixCache.clear(); draw(); });
addEventListener("resize", () => { sizeCanvas(); if (Cz.lvl === 2) L2.scene = V === "B" ? sceneAt(L2.p) : sceneFor(Cz.c); draw(); });
boot();
</script>
</body>
