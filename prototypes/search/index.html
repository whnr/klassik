<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.5: how does composable search look and behave?
  Variants of the Search place, switched with ?variant=A|B|C|D|E or the pill at the top.
  A: sentence. B: tokens with an All/Any switch. C: funnel of sets. D: results first, refine rows. E: overlapping circles.
  Generated library only. Real composer and performer names are public facts, not anyone's library.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Search prototype</title>
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.12); --fill: rgba(118,118,128,.12);
  --glass: rgba(250,250,252,.72); --glassLine: rgba(0,0,0,.08); --groupBg: rgba(181,72,47,.08);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.18); --fill: rgba(118,118,128,.24);
  --glass: rgba(40,40,44,.7); --glassLine: rgba(255,255,255,.1); --groupBg: rgba(255,122,92,.12);
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; }
body { overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#app { padding: calc(env(safe-area-inset-top) + 44px) 0 calc(env(safe-area-inset-bottom) + 170px); min-height: 100vh; }
h1.large { font-size: 34px; font-weight: 700; margin: 6px 16px 10px; letter-spacing: .3px; }
.section-h { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 32px 6px; letter-spacing: .2px; }
.section-f { font-size: 13px; color: var(--label2); margin: 6px 32px 0; }
.list { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 44px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row:active { background: var(--fill); }
.row .main { flex: 1; min-width: 0; }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 14px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .n { font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
.row .n.zero { color: var(--label3); }
.chev::after { content: "›"; color: var(--label3); font-size: 22px; margin-left: 4px; }
.kind { font-size: 12px; color: var(--label2); background: var(--fill); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.icon { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-size: 15px; color: #fff; flex: none; }
.k-genre { background: #8e8e93; } .k-composer { background: #b5482f; } .k-conductor { background: #5e5ce6; } .k-performer { background: #30a46c; } .k-work { background: #0a84ff; }
.empty { text-align: center; color: var(--label2); padding: 40px 32px; }
.hit { font-weight: 600; }

/* bottom chrome: mini player plus the search field, as in an iOS 26 search tab */
#bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(env(safe-area-inset-bottom) + 8px); z-index: 10; transition: bottom .2s; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
#mini { border-radius: 26px; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; margin: 0 4px 8px; }
#mini .art { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg,#b5482f,#e7a15a); }
#mini .t { flex: 1; font-size: 15px; }
#mini .t small { display: block; color: var(--label2); font-size: 13px; }
.searchrow { display: flex; gap: 8px; align-items: center; }
.roundbtn { width: 50px; height: 50px; border-radius: 25px; display: grid; place-items: center; font-size: 20px; flex: none; }
.field { flex: 1; min-height: 50px; border-radius: 25px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 14px; }
.field .mag { color: var(--label2); }
.field input { flex: 1; min-width: 80px; border: 0; outline: 0; background: transparent; font: inherit; color: var(--label); padding: 6px 0; }
.field input::placeholder { color: var(--label2); }
body.typing #mini { display: none; }

/* tokens and chips */
.tok { display: inline-flex; align-items: center; gap: 4px; background: var(--tintSoft); color: var(--tint); border-radius: 8px; padding: 4px 8px; font-size: 15px; white-space: nowrap; }
.tok .x { opacity: .6; font-size: 13px; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 16px; }
.seg button { flex: 1; padding: 6px; border-radius: 7px; font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* A: sentence */
.sentence { margin: 4px 16px 0; font-size: 26px; line-height: 1.55; font-weight: 600; letter-spacing: -.2px; }
.sentence .lead { color: var(--label2); font-weight: 500; }
.sentence .grp { background: var(--groupBg); border-radius: 10px; padding: 1px 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sentence .term { color: var(--tint); border-bottom: 2px solid var(--tintSoft); }
.sentence .verb { color: var(--label2); font-weight: 500; }
.sentence .conn { color: var(--label2); font-weight: 500; font-style: italic; border-bottom: 2px dashed var(--label3); }
.sentence .count { color: var(--label2); font-weight: 400; font-size: 15px; display: block; letter-spacing: 0; line-height: 1.4; margin-top: 4px; }
.hint { font-size: 13px; color: var(--label2); margin: 6px 16px 0; }

/* C: funnel */
.funnel { margin: 0 16px; }
.set { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; position: relative; }
.set.target { box-shadow: 0 0 0 2px var(--tint); }
.set .or { color: var(--label2); font-size: 14px; font-style: italic; }
.set .cnt { margin-left: auto; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.and { display: flex; align-items: center; gap: 8px; margin: 4px 0 4px 18px; color: var(--label2); font-size: 13px; font-style: italic; }
.and::before { content: ""; width: 2px; height: 18px; background: var(--sep); }
.orbtn { font-size: 13px; color: var(--tint); background: var(--tintSoft); border-radius: 12px; padding: 4px 10px; white-space: nowrap; }
.total { font-size: 13px; color: var(--label2); margin: 0 16px 8px; font-variant-numeric: tabular-nums; }

/* D: refine rows */
.dsum { margin: 0 16px 4px; font-size: 15px; color: var(--label2); display: flex; gap: 8px; align-items: baseline; }
.dsum .q { flex: 1; min-width: 0; }
.dsum .q b { color: var(--label); font-weight: 600; }
.dsum .clr { color: var(--tint); font-size: 15px; flex: none; }
.drow { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 5px 16px; scrollbar-width: none; }
.drow::-webkit-scrollbar { display: none; }
.drow .lab { font-size: 13px; color: var(--label2); flex: none; width: 70px; }
.dchip { flex: none; display: inline-flex; align-items: baseline; gap: 5px; background: var(--card); border: .5px solid var(--sep); border-radius: 17px; padding: 6px 12px; font-size: 15px; white-space: nowrap; }
.dchip:active { background: var(--fill); }
.dchip small { font-size: 12px; color: var(--label2); }
.dchip .c { font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.dchip.on { background: var(--tint); border-color: var(--tint); color: #fff; }
.dchip.on small, .dchip.on .c { color: rgba(255,255,255,.8); }
.dchip.on::after { content: "✕"; font-size: 11px; opacity: .8; margin-left: 1px; }
.dchip.sug { background: var(--tintSoft); border-color: transparent; color: var(--tint); }
.dchip.sug::before { content: "+"; font-weight: 600; }
.dmode { flex: none; display: flex; background: var(--fill); border-radius: 8px; padding: 2px; }
.dmode button { font-size: 13px; padding: 4px 9px; border-radius: 6px; color: var(--label2); }
.dmode button.on { background: var(--card); color: var(--label); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.dfoot { font-size: 12px; color: var(--label2); margin: 4px 16px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* E: overlap */
:root { --eSel: #b5482f; --e0: #c27c0e; --e1: #5e5ce6; --e2: #1f8f5a; }
@media (prefers-color-scheme: dark) { :root { --eSel: #d9583b; --e0: #ffb340; --e1: #8e8cff; --e2: #4cd18a; } }
.evenn { margin: 0 16px; background: var(--card); border-radius: 16px; overflow: hidden; }
.evenn svg { display: block; width: 100%; height: auto; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.evenn .esel { fill: var(--eSel); }
.evenn text { text-anchor: middle; dominant-baseline: central; pointer-events: none; font-variant-numeric: tabular-nums; }
.evenn .ecount { font-size: 15px; font-weight: 600; fill: var(--label); }
.evenn .ecount.zero { fill: var(--label3); }
.evenn .ename { font-size: 13px; font-weight: 600; fill: var(--label); }
.evenn .on { fill: #fff; }
.evenn .ecount.zero.on { fill: rgba(255,255,255,.7); }
.seg.eseg { margin-top: 10px; }
.seg.eseg button { min-height: 40px; }
.elegend { display: flex; flex-wrap: wrap; gap: 0 6px; margin: 4px 16px 0; align-items: center; }
.elegend .lab { font-size: 13px; color: var(--label2); margin-right: 2px; }
.echip { min-height: 44px; display: inline-flex; align-items: center; }
.echip > span { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: .5px solid var(--sep); border-radius: 16px; padding: 5px 10px; font-size: 15px; white-space: nowrap; }
.echip:active > span { background: var(--fill); }
.echip .dot { width: 10px; height: 10px; border-radius: 5px; }
.echip .x { color: var(--label3); font-size: 12px; }
.esum { margin: 4px 16px 0; font-size: 15px; color: var(--label2); }
.esum b { color: var(--label); font-weight: 600; }
.efoot { font-size: 13px; color: var(--label2); margin: 4px 16px 0; }
.efoot + .evenn { margin-top: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* work page stub */
#page { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding: calc(env(safe-area-inset-top) + 8px) 0 40px; }
#page.open { transform: none; }
.navbar { display: flex; align-items: center; height: 44px; padding: 0 8px; }
.navbar button { color: var(--tint); font-size: 17px; display: flex; align-items: center; gap: 2px; }
.navbar button::before { content: "‹"; font-size: 30px; line-height: 1; margin-top: -3px; }

/* prototype switcher: at the top, because the bottom belongs to the iOS search field */
#switcher { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
#switcher button { color: #fff; padding: 7px 12px; font-size: 15px; }
#switcher span { padding: 0 2px; white-space: nowrap; }
#switcher a { color: #ff9f87; padding: 7px 10px 7px 4px; text-decoration: none; }
</style>
</head>
<body>
<div id="switcher"><button id="prev">‹</button><span id="vlabel"></span><button id="next">›</button><a id="reset" href="#">reset</a></div>
<div id="app"></div>
<div id="bottom">
  <div id="mini" class="glass"><div class="art"></div><div class="t">Symphony No. 4 in E minor<small>Brahms · Kleiber</small></div><span>▶︎</span></div>
  <div class="searchrow">
    <button class="roundbtn glass" title="Back to the other places">⌂</button>
    <div class="field glass" id="field"><span class="mag">⌕</span><span id="fieldToks" style="display:contents"></span><input id="q" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>
  </div>
</div>
<div id="page"></div>

<script>
// ---------- generated library ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[Math.floor(rnd() * a.length)];
const pickN = (a, n) => { const c = [...a], out = []; while (out.length < n && c.length) out.push(c.splice(Math.floor(rnd() * c.length), 1)[0]); return out; };

const COMPOSERS = [
  ["Johann Sebastian Bach", "Bach", 1685, "Baroque", "BWV", ["Orchestral", "Concerto", "Piano", "Choral", "Chamber"]],
  ["Antonio Vivaldi", "Vivaldi", 1678, "Baroque", "RV", ["Concerto", "Choral"]],
  ["George Frideric Handel", "Handel", 1685, "Baroque", "HWV", ["Orchestral", "Choral", "Opera"]],
  ["Joseph Haydn", "Haydn", 1732, "Classical", "Hob.", ["Orchestral", "Chamber", "Piano"]],
  ["Wolfgang Amadeus Mozart", "Mozart", 1756, "Classical", "K.", ["Orchestral", "Concerto", "Piano", "Chamber", "Opera", "Choral"]],
  ["Ludwig van Beethoven", "Beethoven", 1770, "Classical", "Op.", ["Orchestral", "Concerto", "Piano", "Chamber"]],
  ["Franz Schubert", "Schubert", 1797, "Romantic", "D.", ["Orchestral", "Piano", "Chamber", "Vocal"]],
  ["Frédéric Chopin", "Chopin", 1810, "Romantic", "Op.", ["Piano", "Concerto"]],
  ["Robert Schumann", "Schumann", 1810, "Romantic", "Op.", ["Orchestral", "Piano", "Concerto", "Vocal"]],
  ["Franz Liszt", "Liszt", 1811, "Romantic", "S.", ["Piano", "Orchestral"]],
  ["Johannes Brahms", "Brahms", 1833, "Romantic", "Op.", ["Orchestral", "Concerto", "Piano", "Chamber", "Choral"]],
  ["Anton Bruckner", "Bruckner", 1824, "Romantic", "WAB", ["Orchestral", "Choral"]],
  ["Pyotr Ilyich Tchaikovsky", "Tchaikovsky", 1840, "Romantic", "Op.", ["Orchestral", "Concerto", "Piano"]],
  ["Antonín Dvořák", "Dvořák", 1841, "Romantic", "Op.", ["Orchestral", "Concerto", "Chamber"]],
  ["Gustav Mahler", "Mahler", 1860, "Romantic", "", ["Orchestral", "Vocal"]],
  ["Claude Debussy", "Debussy", 1862, "Modern", "L.", ["Orchestral", "Piano", "Chamber"]],
  ["Jean Sibelius", "Sibelius", 1865, "Romantic", "Op.", ["Orchestral", "Concerto"]],
  ["Sergei Rachmaninoff", "Rachmaninoff", 1873, "Romantic", "Op.", ["Piano", "Concerto", "Orchestral"]],
  ["Maurice Ravel", "Ravel", 1875, "Modern", "M.", ["Orchestral", "Piano", "Concerto", "Chamber"]],
  ["Igor Stravinsky", "Stravinsky", 1882, "Modern", "", ["Orchestral"]],
  ["Dmitri Shostakovich", "Shostakovich", 1906, "Modern", "Op.", ["Orchestral", "Chamber", "Concerto"]],
];
const TITLES = {
  Orchestral: n => `Symphony No. ${n}`, Concerto: n => pick([`Piano Concerto No. ${n}`, `Violin Concerto No. ${n}`, `Cello Concerto`, `Concerto for Orchestra`]),
  Piano: n => pick([`Piano Sonata No. ${n + 10}`, `Études`, `Nocturnes`, `Préludes`, `Variations`, `Impromptus`, `Ballade No. ${n}`]),
  Chamber: n => pick([`String Quartet No. ${n}`, `Piano Trio No. ${n}`, `Cello Sonata No. ${n}`, `Piano Quintet`]),
  Choral: () => pick(["Requiem", "Mass in B minor", "Te Deum", "Magnificat", "Stabat Mater"]),
  Vocal: () => pick(["Lieder", "Winterreise", "Songs of a Wayfarer", "Dichterliebe"]),
  Opera: () => pick(["Le nozze di Figaro", "Giulio Cesare", "Don Giovanni", "Rinaldo"]),
};
const KEYS = ["C major", "C minor", "D major", "D minor", "E-flat major", "E minor", "F major", "G minor", "A major", "A minor", "B-flat major", "B minor"];
const CONDUCTORS = ["Herbert von Karajan", "Claudio Abbado", "Leonard Bernstein", "Wilhelm Furtwängler", "Carlos Kleiber", "Georg Solti", "Simon Rattle", "John Eliot Gardiner", "Nikolaus Harnoncourt", "Bernard Haitink", "Mariss Jansons", "Yannick Nézet-Séguin", "Trevor Pinnock", "Teodor Currentzis"];
const ORCHESTRAS = ["Berliner Philharmoniker", "Wiener Philharmoniker", "Royal Concertgebouw Orchestra", "London Symphony Orchestra", "Chamber Orchestra of Europe", "English Baroque Soloists", "Concentus Musicus Wien", "Gewandhausorchester Leipzig"];
const SOLOISTS = { Piano: ["Martha Argerich", "Maurizio Pollini", "Krystian Zimerman", "Mitsuko Uchida", "Daniil Trifonov", "Glenn Gould", "Alfred Brendel"], Violin: ["Anne-Sophie Mutter", "Gidon Kremer", "Hilary Hahn", "Isabelle Faust"], Cello: ["Mstislav Rostropovich", "Jacqueline du Pré", "Sol Gabetta"], Tenor: ["Ian Bostridge", "Jonas Kaufmann"], Baritone: ["Dietrich Fischer-Dieskau", "Christian Gerhaher"] };
const QUARTETS = ["Alban Berg Quartett", "Emerson String Quartet", "Quatuor Ébène", "Hagen Quartett"];
const CHOIRS = ["Monteverdi Choir", "Arnold Schoenberg Chor", "RIAS Kammerchor"];

const composers = COMPOSERS.map(([name, short, born, period, cat, scorings], i) => ({ id: "c" + i, name, short, born, period, cat, scorings }));
const works = [], recs = [];
for (const c of composers) {
  const count = 4 + Math.floor(rnd() * 6), seen = new Set();
  for (let i = 0; i < count; i++) {
    const scoring = pick(c.scorings), n = 1 + Math.floor(rnd() * 9);
    let title = TITLES[scoring](n);
    if (seen.has(title)) continue; seen.add(title);
    if (/No\.|Sonata|Concerto|Quartet|Trio|Quintet/.test(title)) title += ` in ${pick(KEYS)}`;
    const catNo = c.cat ? `${c.cat} ${Math.floor(10 + rnd() * (c.cat === "K." ? 600 : c.cat === "BWV" ? 1000 : 120))}` : "";
    const w = { id: "w" + works.length, composer: c, title, catNo, genres: ["Classical", scoring, c.period] };
    works.push(w);
    const nr = 1 + Math.floor(rnd() * 4);
    for (let r = 0; r < nr; r++) {
      const rec = { id: "r" + recs.length, work: w, conductor: null, performers: [], year: 1950 + Math.floor(rnd() * 74) };
      const conductor = () => (rnd() < 0.3 ? "Herbert von Karajan" : pick(CONDUCTORS));
      if (["Orchestral", "Concerto", "Choral", "Opera"].includes(scoring)) {
        rec.conductor = conductor();
        const orch = rec.conductor === "Herbert von Karajan" && rnd() < .7 ? "Berliner Philharmoniker" : pick(ORCHESTRAS);
        rec.performers.push({ name: orch, sub: "Orchestra" });
      }
      if (scoring === "Concerto") { const inst = title.includes("Violin") ? "Violin" : title.includes("Cello") ? "Cello" : "Piano"; rec.performers.unshift({ name: pick(SOLOISTS[inst]), sub: inst }); }
      if (scoring === "Piano") rec.performers.push({ name: pick(SOLOISTS.Piano), sub: "Piano" });
      if (scoring === "Chamber") rec.performers.push(title.includes("Quartet") ? { name: pick(QUARTETS), sub: "String Quartet" } : { name: pick(SOLOISTS.Piano), sub: "Piano" });
      if (scoring === "Choral" || scoring === "Opera") rec.performers.push({ name: pick(CHOIRS), sub: "Choir" });
      if (scoring === "Vocal") { const v = rnd() < .5 ? "Tenor" : "Baritone"; rec.performers.push({ name: pick(SOLOISTS[v]), sub: v }, { name: pick(SOLOISTS.Piano), sub: "Piano" }); }
      recs.push(rec);
    }
  }
}

// ---------- search terms ----------
// A term is one picked value. Genres carry no facet: the app does not know which value is the period.
const termKey = t => t.kind + ":" + t.value;
const terms = new Map();
const addTerm = (kind, value, extra = {}) => { const k = kind + ":" + value; if (!terms.has(k)) terms.set(k, { kind, value, ...extra }); };
for (const w of works) { w.genres.forEach(g => addTerm("genre", g)); addTerm("composer", w.composer.name, { short: w.composer.short }); }
for (const r of recs) { if (r.conductor) addTerm("conductor", r.conductor); r.performers.forEach(p => addTerm("performer", p.name, { sub: p.sub })); }
const termList = [...terms.values()];
const lastName = s => s.split(" ").slice(-1)[0];
const shortName = t => t.kind === "composer" ? t.short : t.kind === "genre" ? t.value : lastName(t.value).replace(/^Pré$/, "du Pré");

const recMatches = (r, t) => {
  switch (t.kind) {
    case "genre": return r.work.genres.includes(t.value);
    case "composer": return r.work.composer.name === t.value;
    case "conductor": return r.conductor === t.value;
    case "performer": return r.performers.some(p => p.name === t.value);
  }
};
// groups: AND between groups, OR inside a group
const matchGroups = (r, groups) => groups.every(g => g.length === 0 || g.some(t => recMatches(r, t)));
const run = groups => recs.filter(r => matchGroups(r, groups));

const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const wordStarts = (s, q) => fold(s).split(/[\s\-.,]+/).some(w => w.startsWith(q)) || fold(s).startsWith(q);
function suggest(q, within, exclude) {
  q = fold(q.trim()); if (!q) return { terms: [], works: [] };
  const ex = new Set(exclude.map(termKey));
  const ts = termList.filter(t => !ex.has(termKey(t)) && wordStarts(t.value, q))

// ---------- shared rendering ----------

// ---------- state ----------

// ---------- variant E: overlapping circles, tap regions ----------

  const pole = {};
  for (let y = 1; y < H; y += 3) for (let x = 1; x < W; x += 3) {
    const m = at(x, y); if (!m) continue;
    const d = Math.min(...c.map(k => Math.abs(Math.hypot(x - k.x, y - k.y) - k.r)));
    if (!pole[m] || d > pole[m].d) pole[m] = { x, y, d };
  }
  const circle = (k, extra) => `<circle cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="${k.r.toFixed(1)}" ${extra}/>`;
  let defs = c.map((k, i) => `<clipPath id="e-c${i}">${circle(k, "")}</clipPath>`).join(""), hi = "";
  for (const m of sel) {
    const outs = c.filter((_, i) => !(m >> i & 1));
    if (outs.length) defs += `<mask id="e-m${m}"><rect width="${W}" height="${H}" fill="#fff"/>${outs.map(k => circle(k, 'fill="#000"')).join("")}</mask>`;
    let s = `<rect class="esel" width="${W}" height="${H}"${outs.length ? ` mask="url(#e-m${m})"` : ""}/>`;
    c.forEach((_, i) => { if (m >> i & 1) s = `<g clip-path="url(#e-c${i})">${s}</g>`; });
    hi += s;
  }
  let fills = "", strokes = "", labels = "";
  c.forEach((k, i) => { fills += circle(k, `style="fill:var(--e${i})" fill-opacity=".14"`); strokes += circle(k, `fill="none" style="stroke:var(--e${i})" stroke-width="2"`); });
  for (const m of eMasks(c.length)) {
    const p = pole[m]; if (!p) continue;
    const n = counts[m] || 0, on = sel.has(m) ? " on" : "", num = `<text class="ecount${n ? "" : " zero"}${on}" x="${p.x}" y="${p.y + (ePop(m) === 1 ? 10 : 0)}">${n}</text>`;
    if (ePop(m) === 1) {
      const lines = eLines(dName(circ[Math.log2(m)])), top = p.y - 8 - (lines.length - 1) * 15;
      labels += lines.map((s, j) => `<text class="ename${on}" x="${p.x}" y="${top + j * 15}">${esc(s)}</text>`).join("");
      if (p.d >= 16) labels += num;
    } else if (p.d >= 9) labels += num;
  }
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>${defs}</defs>${fills}${hi}${strokes}${labels}</svg>`;
}

const E = {
  name: "Overlap",
  // exact when the selection is an AND of OR groups; with a "not" region it returns the circles the
  // selection touches, a superset, because the shared groups model has no "not"
  groups() {
    const { fixed, circ } = eSplit(), n = circ.length, out = fixed.map(t => [t]);
    if (!n) return out;
    const gs = eCnf(S.E.sel, n), bits = gs || [S.E.sel.reduce((a, m) => a | m, 0)];
    return out.concat(bits.map(g => circ.filter((_, i) => g >> i & 1)));
  },
  add(t) { if (!S.E.picks.some(x => termKey(x) === termKey(t))) S.E.picks.push(t); eDefault(); },
  render() {
    const { fixed, circ } = eSplit(), n = circ.length, sel = new Set(S.E.sel);
    const base = run(fixed.map(t => [t])), counts = {};
    for (const r of base) { const m = eMask(r, circ); counts[m] = (counts[m] || 0) + 1; }
    const matched = base.filter(r => sel.has(eMask(r, circ)));
    let h = `<h1 class="large">Search</h1>`;
    const chip = (t, i, dot) => `<button class="echip" data-eremove="${i}" aria-label="Remove ${esc(dName(t))}"><span>${dot ? `<i class="dot" style="background:var(--e${dot - 1})"></i>` : ""}${esc(dName(t))}<span class="x">✕</span></span></button>`;
    if (fixed.length) h += `<div class="elegend"><span class="lab">Always</span>${fixed.map((t, i) => chip(t, i)).join("")}</div><div class="efoot">From four picks on, the oldest picks leave the circles and always apply (“and”). Remove a circle to bring one back.</div>`;
    if (n && !S.q) {
      h += `<div class="evenn">${eSvg(circ, base, counts, sel)}</div>`;
      if (n > 1) {
        const all = eMasks(n), and = eSame(sel, [eFull(n)]), or = eSame(sel, all);
        h += `<div class="seg eseg"><button data-eset="and" class="${and ? "on" : ""}">Overlap</button><button data-eset="or" class="${or ? "on" : ""}">Any of them</button></div>`;
      }
      h += `<div class="sr-only" role="group" aria-label="Regions">${eMasks(n).sort((a, b) => ePop(b) - ePop(a)).map(m => `<button data-eregion="${m}" aria-pressed="${sel.has(m)}" aria-label="${esc(eRegionName(m, circ))}: ${counts[m] || 0} recordings">${esc(eRegionName(m, circ))}</button>`).join("")}</div>`;
    }
    if (n) h += `<div class="elegend">${circ.map((t, i) => chip(t, fixed.length + i, i + 1)).join("")}</div>`;
    if (n && !S.q) {
      const fx = fixed.map(t => [t]), gs = eCnf(S.E.sel, n);
      let say;
      if (!sel.size) say = "Nothing chosen. Tap a region in the circles";
      else if (gs) say = eSentence(fx.concat(gs.map(g => circ.filter((_, i) => g >> i & 1))));
      else say = eCubes(S.E.sel, n).map((cb, j) => {
        const pos = circ.filter((_, i) => cb.pos >> i & 1).map(t => [t]), nots = circ.filter((_, i) => cb.neg >> i & 1);
        const free = circ.filter((_, i) => !((cb.pos | cb.neg) >> i & 1));
        const s = eSentence(fx.concat(pos.length ? pos : [free]), nots);
        return j ? s.replace(/^Recordings/, "recordings") : s;
      }).join("; or ");
      h += `<div class="esum">${say}: <b>${matched.length}</b></div>`;
      if (n > 1) h += `<div class="efoot">Tap a region to add it or take it away.</div>`;
    }
    if (S.q) h += suggestionRows(suggest(S.q, run(S.E.picks.map(t => [t])), S.E.picks), S.q);
    else if (!n) h += startRows();
    else h += sel.size ? resultRows(matched) : `<div class="empty">Tap a region to choose recordings.</div>`;
    app.innerHTML = h;
    fieldToks.innerHTML = "";
    input.placeholder = n ? "Add a circle …" : "Genres, composers, performers";
    const svg = app.querySelector(".evenn svg");
    if (svg) svg.addEventListener("click", e => {
      const b = svg.getBoundingClientRect(), m = E.lay.at((e.clientX - b.left) * E.lay.W / b.width, (e.clientY - b.top) * E.lay.H / b.height);
      if (m) { E.toggle(m); render(); }
    });
  },
  toggle(m) { const i = S.E.sel.indexOf(m); i < 0 ? S.E.sel.push(m) : S.E.sel.splice(i, 1); },
  click(el) {
    if (el.dataset.eregion) { E.toggle(Number(el.dataset.eregion)); return true; }
    if (el.dataset.eset) { const n = eSplit().circ.length; S.E.sel = el.dataset.eset === "and" ? [eFull(n)] : eMasks(n); return true; }
    if (el.dataset.eremove) { S.E.picks.splice(Number(el.dataset.eremove), 1); eDefault(); return true; }
  },
};

// ---------- wiring ----------
const VARIANTS = { A, B, C, D, E }, KEYS_V = Object.keys(VARIANTS);
let V = new URLSearchParams(location.search).get("variant");
if (!VARIANTS[V]) V = "A";
function setVariant(v) { V = v; const u = new URL(location); u.searchParams.set("variant", v); history.replaceState(null, "", u); render(); }
function render() { document.getElementById("vlabel").textContent = `${V} · ${VARIANTS[V].name}`; VARIANTS[V].render(); }
document.getElementById("prev").onclick = () => setVariant(KEYS_V[(KEYS_V.indexOf(V) + KEYS_V.length - 1) % KEYS_V.length]);
document.getElementById("next").onclick = () => setVariant(KEYS_V[(KEYS_V.indexOf(V) + 1) % KEYS_V.length]);
document.getElementById("reset").onclick = e => { e.preventDefault(); S.q = ""; input.value = ""; S.A = []; S.B = { picks: [], mode: "all" }; S.C = { groups: [], target: null }; S.D = { picks: { composer: [], conductor: [], performer: [], genre: [] }, gmode: "all" }; S.E = { picks: [], sel: [] }; render(); };
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});
input.addEventListener("input", () => { S.q = input.value; render(); });
input.addEventListener("focus", () => document.body.classList.add("typing"));
input.addEventListener("blur", () => setTimeout(() => document.body.classList.remove("typing"), 150));
input.addEventListener("keydown", e => {
  if (e.key === "Backspace" && !input.value && V === "B" && S.B.picks.length) { S.B.picks.pop(); render(); }
  if (e.key === "Enter") input.blur();
});

function choose(t, intoTarget) { VARIANTS[V].add(t, intoTarget); S.q = ""; input.value = ""; render(); }
document.addEventListener("click", e => {
  const el = e.target.closest("button, [data-orinto]"); if (!el) return;
  if (el.dataset.orinto) { e.stopPropagation(); S.C.target = S.C.groups.length - 1; choose(terms.get(el.dataset.orinto), true); return; }
  if (el.dataset.term) { choose(terms.get(el.dataset.term), true); return; }
  if (el.dataset.work) { openWork(el.dataset.work); return; }
  if (el.dataset.back != null) { document.getElementById("page").classList.remove("open"); return; }
  if (VARIANTS[V].click(el)) render();
});

// Work page stub: the real one is map ticket sz-rs30.1.74.10. It shows which recordings matched.
function openWork(id) {
  const w = works.find(w => w.id === id), groups = VARIANTS[V].groups();
  const rs = recs.filter(r => r.work === w), hit = rs.filter(r => matchGroups(r, groups));
  const row = r => `<div class="row"><span class="main"><div class="t">${esc(r.conductor ? r.conductor : r.performers[0].name)}</div><div class="s">${esc(r.performers.map(p => p.name).filter(n => n !== r.conductor).join(", "))} · ${r.year}</div></span></div>`;
  let h = `<div class="navbar"><button data-back>Search</button></div><h1 class="large" style="font-size:28px">${esc(w.title)}</h1><div class="section-f" style="margin:0 16px">${esc(w.composer.name)}${w.catNo ? " · " + esc(w.catNo) : ""} · ${esc(w.genres.join("; "))}</div>`;
  if (groups.flat().length && hit.length < rs.length) h += `<div class="section-h">Match your search</div><div class="list">${hit.map(row).join("")}</div><div class="section-h">Other recordings</div><div class="list">${rs.filter(r => !hit.includes(r)).map(row).join("")}</div>`;
  else h += `<div class="section-h">Recordings</div><div class="list">${rs.map(row).join("")}</div>`;
  h += `<div class="section-f">Stub. The work page is its own map ticket.</div>`;
  const p = document.getElementById("page"); p.innerHTML = h; p.scrollTop = 0; p.classList.add("open");
}

// keep the search field above the keyboard
if (window.visualViewport) {
  const bottom = document.getElementById("bottom");
  const place = () => { const kb = innerHeight - visualViewport.height - visualViewport.offsetTop; bottom.style.bottom = Math.max(0, kb) + "px"; };
  visualViewport.addEventListener("resize", place); visualViewport.addEventListener("scroll", place);
}
render();
</script>
