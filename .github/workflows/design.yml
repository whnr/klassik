# The design system and the Python and web code: format, lint, tokens, contrast, ADR links, specimen pages.
# Linux only, and only when those files change. It is not a required check, so a skipped run never blocks a merge.
name: Design

on:
  pull_request:
    paths: &paths
      - "design/**"
      - "docs/adr/**"
      - "**/*.md"
      - "scripts/**.py"
      - "Klassik/Tokens.swift"
      - "Klassik/Layout.swift"
      - "Klassik/Assets.xcassets/Colors/**"
      - "ruff.toml"
      - ".prettierrc.json"
      - ".prettierignore"
      - "biome.jsonc"
      - ".github/workflows/design.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      # The browser download and the apt packages are separate steps, so a slow Ubuntu mirror shows as its own step
      # and a cached browser skips the download. The step timeout keeps one slow step from using the whole job.
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: uv run --no-project --with playwright==$PLAYWRIGHT_VERSION playwright install chromium
      # A mirror file can stall for minutes. apt then waits on one connection and the step passes its limit. A short
      # network timeout with retries makes apt reconnect by itself. Killing apt from outside leaves its lock behind,
      # so no outer retry wraps it.
      - name: Install Chromium system libraries
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          uv run --no-project --with playwright==$PLAYWRIGHT_VERSION playwright install-deps chromium
      - run: design/scripts/lint.sh
      # A pull-request run checks out a merge commit; the revision of the specimen is the head the author pushed.
      - name: Package the validated specimen
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp -R design "$RUNNER_TEMP/specimen"
          printf '%s\n' "$REVISION" > "$RUNNER_TEMP/specimen/revision.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: specimen
          path: ${{ runner.temp }}/specimen
          retention-days: 14
