# The design system and the Python and web code: format, lint, tokens, contrast, ADR links, specimen pages.
# Linux only, and only when those files change. It is not a required check, so a skipped run never blocks a merge.
name: Design

on:
  pull_request:
    paths: &paths
      - "design/**"
      - "docs/adr/**"
      - "scripts/**.py"
      - "Klassik/Tokens.swift"
      - "Klassik/Assets.xcassets/Colors/**"
      - "ruff.toml"
      - ".prettierrc.json"
      - ".prettierignore"
      - "biome.jsonc"
      - ".github/workflows/design.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: uv run --no-project --with playwright==1.64.1 playwright install --with-deps chromium
      - run: design/scripts/lint.sh
