<html lang="en">
<head>

<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.1); --fill: rgba(118,118,128,.14); --track: rgba(118,118,128,.32);
  --glass: rgba(250,250,252,.82); --glassLine: rgba(0,0,0,.08); --onTint: #fff;
  --barW: 26px; --lineX: 12px; --edgeTop: calc(env(safe-area-inset-top) + 52px);
  --bot: calc(env(safe-area-inset-bottom) + 12px); --tabH: 56px; --miniH: 64px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.14); --fill: rgba(118,118,128,.24); --track: rgba(118,118,128,.5);
  --glass: rgba(40,40,44,.82); --glassLine: rgba(255,255,255,.1); --onTint: #000;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- place ---------- */
#place { position: fixed; top: 0; left: 0; bottom: 0; right: var(--barW); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 56px) 4px 220px 16px; }
#place h1 { font-size: 34px; margin: 0 0 12px; }
#place .sh { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 16px 6px; }
#place .pl { background: var(--card); border-radius: 12px; overflow: hidden; }
#place .pr { padding: 11px 16px; position: relative; display: flex; gap: 8px; } #place .pr + .pr::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
#place .pr .m { flex: 1; min-width: 0; } #place .pr .s { font-size: 13px; color: var(--label2); } #place .pr .eq { color: var(--tint); font-size: 13px; }
#tabs { position: fixed; left: 16px; right: calc(var(--barW) + 6px); bottom: var(--bot); height: var(--tabH); display: flex; gap: 8px; z-index: 5; transition: opacity .3s; }
#tabs .cap { flex: 1; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 1px; } #tabs .cap b { font-size: 20px; font-weight: 400; }
#tabs .cap .on { color: var(--tint); }
#tabs .circ { width: var(--tabH); border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); flex: none; }

/* ---------- mini player: an island with a flat right face that meets the timeline line ---------- */
#mini { position: fixed; left: 16px; right: var(--lineX); bottom: calc(var(--bot) + var(--tabH) + 8px); height: var(--miniH); z-index: 6;
  background: var(--card); border-radius: 18px 0 0 18px; box-shadow: 0 4px 18px rgba(0,0,0,.14); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; transition: opacity .3s, transform .3s; }
body.three #mini { --miniH: 76px; }
#mini .art { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex: none; }
body.three #mini .art { width: 58px; height: 58px; }
#mini .txt { flex: 1; min-width: 0; line-height: 1.22; }
#mini .mv { font-size: 15px; font-weight: 600; }
#mini .by { font-size: 13px; color: var(--label2); } #mini .wk { font-size: 12px; color: var(--label2); }
#mini .hd { font-size: 12px; color: var(--label2); }
#mini .big { font-size: 16px; font-weight: 600; }
#mini .pp { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; font-size: 18px; flex: none; }
/* marquee: a long movement title glides once, pauses, and returns; short titles stay still */
.mq { overflow: hidden; white-space: nowrap; }
.mq span { display: inline-block; padding-right: 32px; }
.mq.run span { animation: mq var(--dur) linear infinite; }
@keyframes mq { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift)); } }
body.player #mini, body.player #tabs { opacity: 0; pointer-events: none; }

/* ---------- the timeline: one bar on the right edge, always the same ---------- */
#bar { position: fixed; right: 0; width: var(--barW); top: var(--edgeTop); bottom: calc(var(--bot) + var(--tabH) + 8px); z-index: 20; touch-action: none; }
#bar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#bubble { position: fixed; right: calc(var(--barW) + 6px); z-index: 25; pointer-events: none; display: none; max-width: 250px; padding: 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.25; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#bubble b { color: var(--tint); font-weight: 600; }

/* ---------- player: slides in from the left, beside the bar ---------- */
#player { position: fixed; top: 0; left: 0; bottom: 0; right: var(--barW); background: var(--bg); z-index: 10; transform: translateX(-102%); transition: transform .4s cubic-bezier(.2,.8,.2,1); box-shadow: 6px 0 24px rgba(0,0,0,.12); }
body.player #player { transform: none; }
#content { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top) + 100px) 6px calc(var(--bot) + 120px) 16px; }
#pin { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 46px); height: 52px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
#pinbg { position: absolute; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top) + 98px); z-index: 3; opacity: 0; transition: opacity .2s; border-width: 0 0 .5px; }
#player.solid #pinbg { opacity: 1; }
#pin .close { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); display: grid; place-items: center; flex: none; font-size: 18px; }
#pin .ttl { flex: 1; min-width: 0; opacity: 0; transition: opacity .2s; display: flex; gap: 8px; align-items: center; }
#player.solid #pin .ttl { opacity: 1; }
#pin .ttl .pa { width: 34px; height: 34px; border-radius: 6px; overflow: hidden; flex: none; }
#pin .ttl .a { font-size: 15px; font-weight: 600; } #pin .ttl .b { font-size: 12px; color: var(--label2); }
.hero { padding: 0 0 16px; }
.hero .art { width: min(260px, 100%); aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hero h2 { font-size: 22px; margin: 0 0 3px; line-height: 1.15; }
.hero .c { color: var(--tint); font-size: 16px; margin-bottom: 8px; }
.hero .meta { font-size: 13px; color: var(--label2); margin-top: 8px; }
.facts { background: var(--card); border-radius: 12px; margin-top: 4px; }
.fact { display: flex; gap: 10px; padding: 9px 14px; font-size: 15px; position: relative; }
.fact + .fact::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.fact .k { color: var(--label2); width: 92px; flex: none; } .fact .v { flex: 1; min-width: 0; }

.list { background: var(--card); border-radius: 12px; overflow: hidden; margin-top: 18px; }
.row { position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 1; }
.rh { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 8px 11px 14px; min-height: 48px; }
.rh:active { background: var(--fill); }
.rh .main { flex: 1; min-width: 0; }
.rh .t { font-size: 16px; } .rh .s { font-size: 13px; color: var(--label2); }
.rh .t .d { font-size: 14px; color: var(--label2); font-weight: 400; white-space: nowrap; margin-left: 6px; }
.row.cur .rh .t { color: var(--tint); font-weight: 600; }
.rh .slot { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--label3); font-size: 15px; }
.rh .slot.go { border-radius: 17px; background: var(--tintSoft); color: var(--tint); font-size: 13px; }
.rb { display: none; padding: 0 0 10px; }
.row.open .rb { display: block; }
.rb .fact { font-size: 14px; padding: 7px 14px; } .rb .fact .k { width: 92px; }
.seek { position: relative; height: 22px; touch-action: none; margin: 4px 14px 0; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--track); } .seek .tr i { display: block; height: 100%; background: var(--tint); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--label2); margin: -2px 14px 0; }
.ctl { display: flex; align-items: center; justify-content: space-between; margin: 6px 18px 0; }
.ctl button { width: 48px; height: 44px; display: grid; place-items: center; font-size: 18px; }
.ctl button.pp { width: 56px; height: 56px; font-size: 24px; }
#arrow { position: absolute; right: 10px; width: 44px; height: 44px; border-radius: 22px; z-index: 5; display: none; place-items: center; font-size: 20px; color: var(--tint); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#arrow.up { top: calc(env(safe-area-inset-top) + 104px); display: grid; } #arrow.down { bottom: calc(var(--bot) + 12px); display: grid; }

/* the bar on the left: everything mirrors */
body.left #place { left: var(--barW); right: 0; padding-left: 4px; padding-right: 16px; }
body.left #tabs { left: calc(var(--barW) + 6px); right: 16px; }
body.left #mini { left: var(--lineX); right: 16px; border-radius: 0 18px 18px 0; }
body.left #bar { left: 0; right: auto; }
body.left #bubble { left: calc(var(--barW) + 6px); right: auto; }
body.left #player { left: var(--barW); right: 0; transform: translateX(102%); box-shadow: -6px 0 24px rgba(0,0,0,.12); }
body.left.player #player { transform: none; }
body.left #content { padding-left: 6px; padding-right: 16px; }
body.left #arrow { right: auto; left: 10px; }

/* listening notes */
.note { display: flex; gap: 10px; padding: 7px 14px; font-size: 14px; position: relative; }
.note .k { width: 92px; flex: none; color: var(--label2); } .note .v { flex: 1; min-width: 0; font-style: italic; }
.note.on .k { color: var(--tint); }
.caption { margin: 8px 14px 0; min-height: 44px; font: italic 16px/1.35 ui-serif, Georgia, serif; color: var(--label); text-align: center; transition: opacity .6s; }
.caption small { display: block; font: 12px -apple-system, system-ui, sans-serif; color: var(--label2); font-style: normal; margin-top: 3px; }
.caption.off { opacity: 0; }
.tn { font: italic 13px/1.3 ui-serif, Georgia, serif; color: var(--label2); margin-top: 3px; }
.tn.on { color: var(--tint); }
.addn { display: block; margin: 8px 14px 0; font-size: 14px; color: var(--tint); }
.nin { display: block; width: calc(100% - 28px); margin: 6px 14px 0; font: italic 15px ui-serif, Georgia, serif; border: 0; border-bottom: .5px solid var(--sep); background: transparent; color: var(--label); padding: 6px 0; outline: none; user-select: text; -webkit-user-select: text; }

/* sections of the open row */
.sec { padding: 4px 0; }
.sl { display: none; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--label2); margin: 6px 14px 2px; }
body.v-space .sec + .sec { border-top: .5px solid var(--sep); margin-top: 8px; padding-top: 10px; }
body.v-labels .sl { display: block; }
body.v-groups .sec { background: var(--fill); border-radius: 10px; margin: 6px 10px; padding: 4px 0; }
body.v-groups .sec .fact, body.v-groups .sec .note { padding-left: 10px; padding-right: 10px; }
.note { cursor: pointer; } .note .v { font-style: normal; } .note .k { color: var(--tint); text-align: left; font-size: 14px; }
.note.on .v { color: var(--tint); }
.nin { font: 15px -apple-system, system-ui, sans-serif; }
.seek .nm { position: absolute; top: 7.5px; height: 8px; width: 8px; margin-left: -4px; border-radius: 4px; background: var(--label2); opacity: .55; pointer-events: none; }
.seek .nm.span { margin-left: 0; min-width: 8px; }
.seek .nm.on { background: var(--tint); opacity: 1; }
.seek .tr { z-index: 1; }

/* prototype switches */
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 8px; right: 8px; z-index: 30; display: flex; gap: 6px; justify-content: center; }
#sw .p { display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; height: 36px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
#sw .p button { color: #fff; height: 36px; padding: 0 10px; font-size: 14px; white-space: nowrap; }
#sw .p button.arr { font-size: 19px; padding: 0 10px; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 48px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }
</style>

function factRows(pairs) { return pairs.map(([k, v]) => `<div class="fact"><span class="k">${esc(cap(k))}</span><span class="v">${esc(v)}</span></div>`).join(""); }
function rowHead(x) {
  const { t, s } = rowText(x), isCur = x === cur(), open = isCur || S.open.has(x.i);
  const tn = "";
  // The play button takes the chevron's slot, so opening a row never reflows its title.
  const slot = isCur ? `<span class="slot"></span>` : open ? `<span class="slot go" data-a="play" data-i="${x.i}">▶</span>` : `<span class="slot">›</span>`;
  return `<button class="rh" data-row="${x.i}"><span class="main"><div class="t">${esc(t)}<span class="d tnum">${fmt(x.d)}</span></div>${s ? `<div class="s">${esc(s)}</div>` : ""}${tn}</span>${slot}</button>`;
}
// The open row in three sections: who plays, the player, the notes. Notes sit below the controls.
function rowBody(x) {
  const sec = (label, body) => body ? `<div class="sec"><div class="sl">${label}</div>${body}</div>` : "";
  const isCur = x === cur(), ns = notesOf(x.i);
  // Marks on the movement's own bar: a dot for a moment, a dot stretched to a line for a span.
  const marks = ns.map(n => `<span class="nm ${n.len ? "span" : ""}" data-n="${n.i}-${n.t}" style="left:${n.t / x.d * 100}%;${n.len ? `width:${n.len / x.d * 100}%` : ""}"></span>`).join("");
  const player = isCur ? `<div class="seek"><div class="tr"><i></i></div>${marks}</div><div class="times tnum"><span class="el"></span><span class="rm"></span></div>
    <div class="ctl"><button data-a="prev" aria-label="Previous">⏮</button><button data-a="back" aria-label="Back 15 seconds">↺</button><button class="pp" data-a="pp" aria-label="Play or pause"></button><button data-a="fwd" aria-label="Forward 15 seconds">↻</button><button data-a="next" aria-label="Next">⏭</button></div>` : "";
  // A tap on a note jumps there. A tap on its time jumps there and plays.
  let nb = ns.map(n => `<div class="note" data-a="nseek" data-at="${x.start + n.t}" data-n="${n.i}-${n.t}"><button class="k tnum" data-a="nplay" data-at="${x.start + n.t}">${when(n)}</button><span class="v">${esc(n.x)}</span></div>`).join("");
  if (isCur) nb += S.editing ? `<input class="nin" placeholder="Write the note" value="">` : `<button class="addn" data-a="note">${S.marking ? "End the note here" : "Add a note here"}</button>`;
  return sec("Performers", factRows(extra(x))) + sec("Playing", player) + sec("Notes", nb);
}
let lastCur = null;
// Re-render the rows without moving the anchor row on screen: changes happen in place.
function renderRows(anchor) {
  const c = $("#content"), el = anchor != null ? document.querySelector(`.row[data-i="${anchor}"]`) : null, before = el ? el.getBoundingClientRect().top : null;
  const now = cur();
  $("#rows").innerHTML = P.items.map(x => `<div class="row ${x === now ? "cur open" : ""} ${S.open.has(x.i) ? "open" : ""}" data-i="${x.i}">${rowHead(x)}<div class="rb">${rowBody(x)}</div></div>`).join("");
  lastCur = now;
  if (before != null) { const after = document.querySelector(`.row[data-i="${anchor}"]`).getBoundingClientRect().top; progUntil = Date.now() + 80; c.scrollTop += after - before; }
  tick(true);
}
function renderPlayer() {
  const head = [P.cond && ["conductor", P.cond], ...P.common].filter(Boolean);
  $("#content").innerHTML = `<div class="hero"><div class="art">${cover()}</div><h2>${esc(P.title)}</h2>${P.composer ? `<div class="c">${esc(P.composer)}</div>` : ""}
    <div class="facts">${factRows(head)}</div><div class="meta">${esc(P.label)}${P.year ? " · " + P.year : ""} · ${P.items.length} ${P.album ? "tracks" : "movements"} · ${fmt(P.total)}</div></div><div class="list" id="rows"></div>`;
  $("#pin .ttl").innerHTML = `<div class="pa">${cover()}</div><div style="min-width:0"><div class="a ell">${esc(P.title)}</div><div class="b ell">${esc(P.composer || head.map(h => h[1]).join(" · "))}</div></div>`;
  renderRows(); placeNow(false);
}
function firstVisibleRow() { const top = $("#content").getBoundingClientRect().top + 100; return [...document.querySelectorAll(".row")].find(r => r.getBoundingClientRect().bottom > top); }

// ---------- the bar ----------
let G = null;
function drawBar() {
  const el = $("#bar"), H = el.clientHeight, n = P.items.length, gap = n > 12 ? 2 : 4, min = 3;
  let fixed = new Set(), k = 0; const avail = H - gap * (n - 1);
  for (let it = 0; it < 6; it++) { const free = P.items.filter(x => !fixed.has(x.i)).reduce((a, x) => a + x.d, 0); k = (avail - min * fixed.size) / free; let ch = false; for (const x of P.items) if (!fixed.has(x.i) && x.d * k < min) { fixed.add(x.i); ch = true; } if (!ch) break; }
  let y = 0; const segs = P.items.map(x => { const h = fixed.has(x.i) ? min : x.d * k; const s = { y, h }; y += h + gap; return s; });
  G = { segs, y(t) { const x = P.items.findLast(x => t >= x.start) || P.items[0], s = segs[x.i]; return s.y + Math.min(1, (t - x.start) / x.d) * s.h; },
    t(py) { for (const x of P.items) { const s = segs[x.i]; if (py < s.y + s.h + gap / 2 || x.i === n - 1) return x.start + Math.min(1, Math.max(0, (py - s.y) / s.h)) * x.d; } return 0; } };
  const w = el.clientWidth, lx = S.side === "left" ? 10 : w - 14;
  const lx2 = S.side === "left" ? 10 : w - 14, dir = S.side === "left" ? 1 : -1, base = S.side === "left" ? lx2 + 4 : lx2;
  const marks = "";
  el.innerHTML = `<svg viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><defs><clipPath id="pc"><rect id="pcr" x="0" y="0" width="${w}" height="0"/></clipPath></defs><g fill="var(--label2)">${marks}</g>`
    + `<g fill="var(--track)">${segs.map(s => `<rect x="${lx}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g>`
    + `<g fill="var(--tint)" clip-path="url(#pc)">${segs.map(s => `<rect x="${lx}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g></svg>`;
}
// A vertical drag scrubs. A tap starts the movement under the finger. A sideways swipe changes nothing.
(() => {
  const el = $("#bar"); let on = false, mode = null, t = 0, x0 = 0, y0 = 0;
  const at = e => { const r = el.getBoundingClientRect(); t = G.t(e.clientY - r.top); const x = P.items.findLast(x => t >= x.start) || P.items[0], tx = rowText(x), b = $("#bubble");
    b.style.display = "block"; b.style.top = Math.max(60, Math.min(innerHeight - 140, e.clientY - 30)) + "px";
    b.innerHTML = `<b class="tnum">${fmt(t - x.start)}</b> of ${fmt(x.d)}<br>${esc(tx.t)}${tx.s ? `<br><span style="color:var(--label2)">${esc(tx.s)}</span>` : ""}`;
    $("#pcr").setAttribute("height", G.y(t)); };
  el.onpointerdown = e => { on = true; mode = null; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); touched(); };
  el.onpointermove = e => { if (!on) return; const dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0); if (!mode && (dx > 8 || dy > 8)) mode = dy > dx * 1.5 ? "scrub" : "ignore"; if (mode === "scrub") at(e); };
  el.onpointerup = el.onpointercancel = e => {
    if (!on) return; on = false; $("#bubble").style.display = "none";
    if (e.type === "pointerup" && mode === "scrub") { T = t; changed(null); toast("Seek"); }
    else if (e.type === "pointerup" && !mode) { const r = el.getBoundingClientRect(), tt = G.t(e.clientY - r.top), x = P.items.findLast(x => tt >= x.start) || P.items[0]; T = x.start; S.playing = true; changed(null); toast("Plays " + rowText(x).t); }
    $("#pcr").setAttribute("height", G.y(T)); mode = null;
  };
})();

// ---------- calm following ----------
// The view moves only when the listener asks (the arrow) or after a quiet spell without touches.
const IDLE = 8000;
let lastTouch = Date.now(), progUntil = 0;
const touched = () => lastTouch = Date.now();
["touchstart", "pointerdown", "wheel"].forEach(ev => addEventListener(ev, touched, { passive: true, capture: true }));
function where() { const r = document.querySelector(".row.cur"); if (!r) return 0; const c = $("#content").getBoundingClientRect(), a = r.getBoundingClientRect(), top = c.top + 100, bot = c.bottom - 20;
  const vis = Math.min(a.bottom, bot) - Math.max(a.top, top); return vis > Math.min(60, a.height * .5) ? 0 : a.bottom < top + 30 ? -1 : 1; }
function placeNow(smooth) { // the playing row in the upper part, the previous title just above it
  const c = $("#content"), r = document.querySelector(".row.cur"); if (!r) return;
  const prev = r.previousElementSibling, ref = prev || r, cr = c.getBoundingClientRect();
  const target = c.scrollTop + ref.getBoundingClientRect().top - cr.top - 100 - 8;
  if (Math.abs(target - c.scrollTop) < 4) return;
  progUntil = Date.now() + (smooth ? 900 : 80); c.scrollTo({ top: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
}
// A new movement: the old row closes, the new one opens, and the rows on screen stay put.
function changed(anchorRow) { const a = anchorRow ?? (firstVisibleRow() ? +firstVisibleRow().dataset.i : null); renderRows(a); miniKey = ""; renderMini(); }
$("#content").addEventListener("scroll", () => {
  if (Date.now() > progUntil) touched();
  const h2 = document.querySelector(".hero h2"); $("#player").classList.toggle("solid", !!h2 && h2.getBoundingClientRect().bottom < $("#content").getBoundingClientRect().top + 100);
  arrow();
}, { passive: true });
let arrowKey = "";
function arrow() { const w = where(), key = w + "" + cur().i; if (key === arrowKey) return; arrowKey = key; const a = $("#arrow"); a.className = "glass"; if (w) { a.classList.add(w < 0 ? "up" : "down"); a.textContent = w < 0 ? "↑" : "↓"; } }
$("#arrow").onclick = () => { placeNow(true); toast("Back to what plays"); };

// ---------- taps ----------
document.addEventListener("click", e => {
  const a = e.target.closest("[data-a]");
  if (a) { e.stopPropagation(); row_at = a.dataset.at; act(a.dataset.a, +a.dataset.i, a.closest(".row")); return; }
  const rh = e.target.closest(".rh[data-row]");
  if (rh) { const i = +rh.dataset.row; if (P.items[i] === cur()) return; S.open.has(i) ? S.open.delete(i) : S.open.add(i); renderRows(i); }
}, true);
let row_at = null;
function act(a, i, row) {
  const c = cur();
  if (a === "pp") { S.playing = !S.playing; miniKey = ""; renderMini(); tick(true); return; }
  if (a === "nseek" || a === "nplay") { T = +row_at; if (a === "nplay") S.playing = true; miniKey = ""; renderMini(); toast(a === "nplay" ? "Plays from the note" : "Jumps to the note"); if (cur() !== lastCur) changed(row ? +row.dataset.i : null); else tick(true); return; }
  if (a === "note") {
    if (!S.marking) { S.marking = { i: c.i, t: Math.floor(T - c.start) }; renderRows(c.i); toast("Note starts at " + fmt(S.marking.t)); return; }
    const m = S.marking, len = c.i === m.i ? Math.max(0, Math.round(T - c.start - m.t)) : 0;
    S.marking = null; S.editing = { i: m.i, t: m.t, len }; renderRows(c.i);
    const inp = document.querySelector(".nin"); inp.focus();
    inp.onkeydown = ev => { if (ev.key === "Enter") inp.blur(); };
    inp.onblur = () => { const e = S.editing; if (!e) return; S.editing = null; (notes[P.key] ||= []).push({ ...e, x: inp.value.trim() || "Note" }); drawBar(); renderRows(cur().i); toast(e.len ? `Note: ${fmt(e.t)}–${fmt(e.t + e.len)}` : `Note at ${fmt(e.t)}`); };
    return;
  }
  if (a === "play") { T = P.items[i].start; S.playing = true; S.open.delete(i); changed(i); return; }
  if (a === "back") T = Math.max(0, T - 15);
  if (a === "fwd") T = Math.min(P.total - 1, T + 15);
  if (a === "prev") T = T - c.start > 3 || !c.i ? c.start : P.items[c.i - 1].start;
  if (a === "next" && c.i < P.items.length - 1) T = P.items[c.i + 1].start;
  if (cur() !== lastCur) changed(row ? +row.dataset.i : null); else tick(true);
}
document.addEventListener("pointerdown", e => {
  const sk = e.target.closest(".seek"); if (!sk) return; const x = cur(); sk.setPointerCapture(e.pointerId);
  const set = ev => { const r = sk.getBoundingClientRect(); T = x.start + Math.min(.999, Math.max(0, (ev.clientX - r.left) / r.width)) * x.d; tick(true); };
  set(e); sk.onpointermove = set; sk.onpointerup = () => sk.onpointermove = null;
});

// ---------- per frame ----------
let lastPP = null;
function tick(force) {
  const x = cur();
  if (x !== lastCur && !force) { changed(null); return; }
  const f = (T - x.start) / x.d, i = document.querySelector(".row.cur .tr i"); if (i) i.style.width = f * 100 + "%";
  const el = document.querySelector(".row.cur .el"); if (el) { el.textContent = fmt(T - x.start); document.querySelector(".row.cur .rm").textContent = "−" + fmt(x.d - (T - x.start)); }
  if (force || lastPP !== S.playing) { lastPP = S.playing; document.querySelectorAll(".row.cur .pp").forEach(b => b.textContent = S.playing ? "❚❚" : "▶"); }
  if (G) $("#pcr").setAttribute("height", G.y(T));
  const on = (notes[P.key] || []).filter(isOn), ids = new Set(on.map(n => n.i + "-" + n.t));
  document.querySelectorAll("[data-n]").forEach(e => e.classList.toggle("on", ids.has(e.dataset.n)));
  const capEl = document.querySelector(".row.cur .caption");
  if (capEl) { const n = on.find(n => n.i === x.i), key = n ? n.i + "-" + n.t : "";
    if (capEl.dataset.k !== key) { capEl.dataset.k = key; capEl.classList.add("off"); clearTimeout(capEl._t);
      if (n) capEl._t = setTimeout(() => { capEl.innerHTML = `${esc(n.x)}<small>${when(n)}</small>`; capEl.classList.remove("off"); }, 600); } }
}
let t0 = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - t0) / 1000) * S.speed; t0 = now;
  if (S.playing) { T += dt; if (T >= P.total) { T = 0; S.playing = false; } }
  if (now - slow > 250) { slow = now; tick(); arrow(); if (document.body.classList.contains("player") && Date.now() - lastTouch > IDLE) placeNow(true); }
  requestAnimationFrame(frame);
}

// ---------- open, close, switches ----------
$("#mini").onclick = e => { if (e.target.closest("[data-a]")) return; document.body.classList.add("player"); touched(); requestAnimationFrame(() => placeNow(false)); };
$("#close").onclick = () => document.body.classList.remove("player");
function setQ() { history.replaceState(null, "", "?" + new URLSearchParams({ variant: S.variant, play: S.play, side: S.side })); }
function setVariantClass() { document.body.classList.remove("v-space", "v-labels", "v-groups"); document.body.classList.add("v-" + S.variant); }
function stepVariant(d) { const i = VARIANTS.findIndex(v => v[0] === S.variant); S.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]; setQ(); setVariantClass(); renderRows(firstVisibleRow() ? +firstVisibleRow().dataset.i : null); label(); toast(VARIANTS.find(v => v[0] === S.variant)[1]); }
$("#vp").onclick = () => stepVariant(-1); $("#vn").onclick = () => stepVariant(1); $("#vl").onclick = () => stepVariant(1);
$("#src").onclick = () => { const i = SOURCES.findIndex(v => v[0] === S.play); S.play = SOURCES[(i + 1) % 3][0]; setQ(); all(); };
$("#side").onclick = () => { S.side = S.side === "right" ? "left" : "right"; setQ(); document.body.classList.toggle("left", S.side === "left"); requestAnimationFrame(() => { drawBar(); tick(true); }); label(); };
function label() { $("#side").textContent = S.side === "right" ? "Bar ▸" : "◂ Bar"; $("#vl").textContent = VARIANTS.find(v => v[0] === S.variant)[1]; $("#src").textContent = SOURCES.find(v => v[0] === S.play)[1] + " ▾"; }
let tt = 0;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1500); }
function all() { load(S.play); S.marking = null; S.editing = null; miniKey = ""; renderMini(); drawBar(); renderPlace(); renderPlayer(); label(); }
addEventListener("resize", () => { drawBar(); tick(true); marquee(); });
if (Q.get("screen") === "player") document.body.classList.add("player");
document.body.classList.toggle("left", S.side === "left");
loadNotes(); setVariantClass();
all(); requestAnimationFrame(frame);
</script>
</body>
</html>
