<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page menu</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=50" />
    <link rel="stylesheet" href="specimen.css?v=50" />
    <link rel="stylesheet" href="variants/page-menu.css?v=50" />
    <script src="specimen.js?v=50"></script>
    <script src="variants/page-menu.js?v=50"></script>
  </head>
  <body>
    <script>
      // The page menu, one page for each variant, drawn open. This page is the record of the menu.
      // ?for= recording, album, work or player. ?state= none, downloading, downloaded or offline.
      // Without ?for= the page lists the variants and the rules. ?variant=page-menu shows the menu live on work.html and player.html.
      K.start(() => {
        const { el, href, ICON, M } = K;
        const kind = K.params.get("for");
        const row = (title, sub, path, extra) =>
          el(
            path ? "a" : "div",
            { class: "row", href: path ? href(path, extra) : null },
            el(
              "div",
              { class: "main" },
              el("div", { class: "t-body" }, title),
              sub && el("div", { class: "t-subheadline secondary" }, sub),
            ),
            path ? el("span", { html: ICON.chevron }) : null,
          );
        const section = (head, foot, ...rows) =>
          el(
            "section",
            { class: "section" },
            el("div", { class: "section-head t-footnote" }, head),
            el("div", { class: "list" }, ...rows),
            foot ? el("p", { class: "section-foot t-footnote" }, foot) : null,
          );

        if (!kind) {
          const { scroll } = K.page({
            tab: "library",
            title: "Page menu",
            back: { label: "Library", href: "index.html" },
          });
          const menu = (title, sub, extra) => row(title, sub, "menu.html", { back: "Page menu", ...extra });
          scroll.append(
            el(
              "div",
              { class: "page-head" },
              el("h1", { class: "t-largeTitle" }, "Page menu"),
              el(
                "p",
                { class: "t-subheadline secondary meta" },
                "One ⋯ button at the top right of a page holds the actions of the one thing the page shows. It replaces the download button of the page.",
              ),
            ),
            section(
              "Recording page",
              null,
              menu("Not downloaded", "Play Next, Add to Queue, Download, Tags and Grouping", { for: "recording" }),
              menu("Downloading", "Cancel Download, the state below it", {
                for: "recording",
                state: "downloading",
              }),
              menu("Downloaded", "Remove Download, the size below it", {
                for: "recording",
                state: "downloaded",
              }),
              menu("Offline", "Download is dimmed and says why below it", { for: "recording", state: "offline" }),
            ),
            section(
              "Other pages",
              null,
              menu("Album page", "Play Next, Add to Queue, Download, Tags and Grouping", { for: "album" }),
              menu("Work page", "Play Next, Add to Queue of the top recording; no Download", { for: "work" }),
              menu("Player", "Download and Tags and Grouping of what plays", { for: "player" }),
            ),
            section(
              "Live on the pages",
              "The variant adds the button to the pages above. Download runs for nine seconds.",
              row("Work page", "Symphony No. 5, Beethoven", "work.html", { variant: "page-menu", back: "Page menu" }),
              row("Recording page", "Carlos Kleiber", "player.html", {
                variant: "page-menu",
                recording: [...M.recordings.keys()][0],
                back: "Page menu",
              }),
              row("Album page", "Chopin sonatas", "player.html", {
                variant: "page-menu",
                album: "3Is4qK0IBSlUYtEHMhh8YH",
                back: "Page menu",
              }),
            ),
            section(
              "Order",
              "Every menu keeps this order and leaves out what its page cannot do. A state changes the words of an item, never its place.",
              row("1. Play Next, Add to Queue", "Not in the player: the item plays"),
              row("2. Add to Playlist", "When playlists come"),
              row("3. Download", "Not on the work page: a work has several recordings"),
              row("4. Tags and Grouping", "Not on the work page"),
            ),
            section(
              "Download states",
              "Every state shows below the item, as the size does. The menu reads the state when it opens.",
              row("Not downloaded", "Download, with the size below"),
              row("Downloading", "Cancel Download, with “Downloading, 15 %” below"),
              row("Downloaded", "Remove Download in red, with “Downloaded, 250 MB” below"),
              row("Server out of reach", "Download dimmed, with “Needs the server” below"),
              row("Album, partly downloaded", "Download, with “2 of 5 recordings downloaded” below"),
            ),
            section(
              "Rules",
              null,
              row("Remove Download asks no question", "The server can supply the files again"),
              row("A failed download keeps no files", "The menu shows Download again; the one quiet status reports it"),
              row("Swipes stay row shortcuts", "Swipe Actions chooses them; they do not change the page menu"),
              row("The row long-press menu", "Play first, then the same items in the same order, words and symbols"),
              row("Favourite", "Only the fermata beside the title; not in the menu"),
              row("Share", "Left out: a link points at a private server"),
              row("No mark on the button", "No download mark or progress ring; Local Storage lists the downloads"),
              row("VoiceOver", "“More, button”; each item with the line below it: “Download, 250 megabytes”"),
              row("UI tests", "The button has the identifier page-menu; each item is found by its label"),
            ),
            section(
              "No menu yet",
              "These pages show no one thing to download or queue. Their bars keep what they hold today. Playlist pages get a menu when playlists come.",
              row("Library", "Keeps Edit and the cog for now; it changes later"),
              row("Chronology and Search", "The roots of the tabs"),
              row("Composer and performer pages", "A person has no download; the fermata favourites them"),
              row("Composers, Performers, Albums, Favourites", "Each row has its swipes and its long-press menu"),
              row("Settings and its pages", "Tags, Local Storage, MusicBrainz, Swipe Actions"),
            ),
          );
          return;
        }

        const albumId = "3Is4qK0IBSlUYtEHMhh8YH";
        const item =
          kind === "album"
            ? K.resolveItem(["album", albumId])
            : K.resolveItem(["recording", "640qawSbxRzx7BX6z3M2wM", "Symphony No. 5 in C minor, Op. 67"]);
        const titles = { recording: "Recording page", album: "Album page", work: "Work page", player: "Player" };
        const { nav, scroll } = K.page({
          tab: "library",
          title: titles[kind],
          back: { label: "Page menu", href: href("menu.html") },
        });
        const name = kind === "work" ? item.recording.work : item.title;
        scroll.append(
          el(
            "div",
            { class: "page-head" },
            el("h1", { class: "t-title1" }, name),
            el("p", { class: "t-subheadline secondary meta" }, `On ${M.albums.get(item.album.id).name}.`),
          ),
        );
        const menu = K.pageMenu.attach(nav, kind, item);
        requestAnimationFrame(() => requestAnimationFrame(menu.open));
      });
    </script>
  </body>
</html>
