<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Server Connection</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=52" />
    <link rel="stylesheet" href="specimen.css?v=52" />
    <script src="specimen.js?v=52"></script>
  </head>
  <body>
    <script>
      // The Server Connection page of Settings, under Advanced settings.
      // ?state=signedout shows the signed-out page. ?state=offline shows a server that does not answer.
      // ?confirm=signout draws the sign-out confirmation open.
      // The signed-out page stands in for the sign-in screen of the app: its rows draw the fields, not the typing.
      K.start(() => {
        const { el, href, form } = K;
        const state = K.params.get("state") || "signedin";
        const { scroll } = K.page({
          tab: "library",
          title: "Server Connection",
          back: { label: "Settings", href: href("settings.html", { tab: "library", back: "Library" }) },
          grouped: true,
        });
        const { group, value, button } = form;
        const signedOut = state === "signedout";
        const offline = state === "offline";
        const status = { signedin: "Connected", offline: "Not reachable", signedout: "Signed out" }[state];
        // The stats come from the library cache and need no network. Server name and version are the last
        // answer of the server, so an offline page still shows them.
        const stats = group(
          "Library",
          [
            value("Server", "Navidrome 0.64.2"),
            value("Classical Tracks", "18,204"),
            value("Classical Albums", "1,412"),
            value("Tracks Outside Filter", "6,931"),
            value("Last Sync", offline ? "Yesterday, 21:40" : "Just now"),
          ],
          "Classical counts follow the classical rules. Tracks Outside Filter are on the server but fail the rules.",
        );
        const confirmSignOut = () => {
          const confirm = button("Sign Out of music.example.org", { destructive: true });
          const cancel = button("Cancel");
          let close;
          cancel.addEventListener("click", () => close());
          confirm.addEventListener("click", () => {
            location.href = href("server.html", { state: "signedout" });
          });
          close = K.sheet(
            "Sign Out",
            el(
              "div",
              {},
              group(
                null,
                [confirm, cancel],
                "Downloads and the music cache leave this iPhone. Favourite works, listening notes and the changes that wait stay for this server and user.",
              ),
            ),
          );
        };
        scroll.append(
          el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "Server Connection")),
          group(
            "Account",
            signedOut
              ? [value("Server Address", "https://"), value("Username", "Required"), value("Password", "Required")]
              : [value("Server Address", "music.example.org"), value("Username", "flo")],
            signedOut ? "Enter the address of your OpenSubsonic server and your account." : null,
          ),
          group(
            null,
            [value("Connection", status)],
            offline
              ? "Klassik keeps playing from the library on this iPhone. Changes wait until the server answers."
              : null,
          ),
          ...(signedOut ? [] : [stats]),
          group(
            null,
            [signedOut ? button("Sign In") : button("Sign Out", { destructive: true })],
            signedOut ? "Signing in starts a full sync." : null,
          ),
        );
        const buttons = scroll.querySelectorAll(".form-button");
        if (!signedOut) buttons[buttons.length - 1].addEventListener("click", confirmSignOut);
        if (!signedOut && K.params.get("confirm") === "signout") confirmSignOut();
      });
    </script>
  </body>
</html>
