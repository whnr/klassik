<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.1); --fill: rgba(118,118,128,.14); --track: rgba(118,118,128,.32);
  --glass: rgba(250,250,252,.82); --glassLine: rgba(0,0,0,.08); --onTint: #fff; --sheet: #f2f2f7;
  --tlw: 36px; --top: calc(env(safe-area-inset-top) + 48px); --pinH: 52px; --bot: calc(env(safe-area-inset-bottom) + 12px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.14); --fill: rgba(118,118,128,.24); --track: rgba(118,118,128,.5);
  --glass: rgba(40,40,44,.82); --glassLine: rgba(255,255,255,.1); --onTint: #000; --sheet: #000;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }

/* place behind the player */
#place { position: fixed; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 56px) 16px 200px; }
body.v-edge #place { padding-right: 26px; }
#place h1 { font-size: 34px; margin: 0 0 12px; }
#place .sh { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 16px 6px; }
#place .pl { background: var(--card); border-radius: 12px; overflow: hidden; }
#place .pr { padding: 11px 16px; position: relative; display: flex; gap: 8px; } #place .pr + .pr::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
#place .pr .m { flex: 1; min-width: 0; } #place .pr .s { font-size: 13px; color: var(--label2); } #place .pr .eq { color: var(--tint); font-size: 13px; }
/* iOS 26: tab bar with the accessory above it; scrolling down collapses both into one row */
#tabs { position: fixed; left: 16px; right: 16px; bottom: var(--bot); height: 56px; display: flex; gap: 8px; z-index: 5; }
#tabs .cap { flex: 1; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); transition: flex .3s; overflow: hidden; }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 1px; } #tabs .cap b { font-size: 20px; font-weight: 400; } #tabs .cap em { font-style: normal; }
#tabs .cap .on { color: var(--tint); }
#tabs .circ { width: 56px; border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); flex: none; }
body.min #tabs .cap { flex: 0 0 56px; } body.min #tabs .cap .x, body.min #tabs .cap em { display: none; }
#acc { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bot) + 64px); height: 56px; border-radius: 28px; z-index: 6; overflow: hidden; transition: left .3s, right .3s, bottom .3s, height .3s; }
body.min #acc { left: 80px; right: 80px; bottom: var(--bot); }
body.v-edge #acc { right: 30px; } body.v-edge.min #acc { right: 80px; }
.mini { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 6px 0 8px; position: relative; }
.mini .art { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex: none; transition: width .3s, height .3s; }
body.min .mini .art { width: 34px; height: 34px; }
.mini .txt { flex: 1; min-width: 0; line-height: 1.2; } .mini .l1 { font-size: 15px; font-weight: 500; } .mini .l2 { font-size: 13px; color: var(--label2); }
body.min .mini .l2 { display: none; } body.min .mini .l1 { font-size: 14px; }
.mini .pp { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; font-size: 17px; flex: none; }
.mini .prog { position: absolute; left: 24px; right: 24px; bottom: 3px; height: 2px; background: var(--track); } .mini .prog i { display: block; height: 100%; background: var(--tint); }
.mini .ticks { flex: 1; min-width: 0; height: 20px; } .mini .ticks svg { width: 100%; height: 100%; display: block; }
.mini .cnt { font-size: 13px; color: var(--label2); flex: none; }
body.min .mini .cnt { display: none; }
#edge { position: fixed; right: 0; width: 24px; top: calc(env(safe-area-inset-top) + 56px); bottom: calc(var(--bot) + 64px + 28px); z-index: 6; display: none; transition: bottom .3s; }
body.v-edge #edge { display: block; } body.v-edge.min #edge { bottom: calc(var(--bot) + 28px); }
#edge svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* player sheet */
#sheet { position: fixed; left: 0; right: 0; top: var(--top); bottom: 0; background: var(--sheet); border-radius: 14px 14px 0 0; z-index: 10; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); overflow: hidden; box-shadow: 0 -4px 30px rgba(0,0,0,.2); }
body.player #sheet { transform: none; }
#content { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--pinH) calc(var(--tlw) + 6px) calc(var(--bot) + 80px) 16px; }
#pin { position: absolute; left: 0; right: 0; top: 0; height: var(--pinH); z-index: 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
#pin .bg { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; border-width: 0 0 .5px; }
#pin.solid .bg { opacity: 1; }
#pin .grab { position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); }
#pin .close { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); display: grid; place-items: center; position: relative; flex: none; }
#pin .ttl { flex: 1; min-width: 0; opacity: 0; transition: opacity .2s; position: relative; display: flex; gap: 8px; align-items: center; }
#pin .ttl .pa { width: 34px; height: 34px; border-radius: 6px; overflow: hidden; flex: none; }
#pin.solid .ttl { opacity: 1; }
#pin .ttl .a { font-size: 15px; font-weight: 600; } #pin .ttl .b { font-size: 12px; color: var(--label2); }

.hero { padding: 6px 0 16px; }
.hero .art { width: min(260px, 100%); aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hero h2 { font-size: 22px !important; }
.hero h2 { font-size: 20px; margin: 0 0 3px; line-height: 1.15; }
.hero .c { color: var(--tint); font-size: 15px; margin-bottom: 6px; }
.hero .p { font-size: 13px; color: var(--label2); line-height: 1.4; }
.hero .p b { color: var(--label); font-weight: 500; }

/* rows: one inset list, grouped like iOS */
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 1; }
.rh { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 12px 11px 14px; min-height: 48px; }
.rh:active { background: var(--fill); }
.rh .main { flex: 1; min-width: 0; }
.rh .t { font-size: 16px; } .rh .s { font-size: 13px; color: var(--label2); }
.rh .d { font-size: 14px; color: var(--label2); flex: none; }
.rh .t .d { font-size: 14px; color: var(--label2); font-weight: 400; white-space: nowrap; margin-left: 6px; }
.rh .slot { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--label3); font-size: 15px; }

.playrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0 2px; color: var(--tint); font-weight: 600; font-size: 16px; border-top: .5px solid var(--sep); margin-top: 4px; }

.ctl.wait button { color: var(--label3); } .ctl.wait button.pp { color: var(--tint); }
.row.cur .rh .t { color: var(--tint); font-weight: 600; }
.rp { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; flex: none; color: var(--tint); font-size: 14px; }
.row.cur .rp { background: var(--tint); color: var(--onTint); }
.rb { display: none; padding: 0 14px 12px; }
.row.open .rb { display: block; }
.who { font-size: 14px; color: var(--label2); margin-bottom: 8px; } .who b { color: var(--label); font-weight: 400; }
.seek { position: relative; height: 22px; touch-action: none; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--track); }
.seek .tr i { display: block; height: 100%; background: var(--tint); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--label2); margin-top: -2px; }
.ctl { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 0; }
.ctl button { width: 48px; height: 44px; display: grid; place-items: center; font-size: 18px; color: var(--label); }
.ctl button.pp { width: 56px; height: 56px; font-size: 24px; }
#stuck .t { color: var(--tint); font-weight: 600; }

/* the timeline: one plain bar, gaps between movements */
#tl { position: absolute; right: 0; top: calc(var(--pinH) + 4px); bottom: calc(var(--bot) + 8px); width: var(--tlw); z-index: 3; touch-action: none; }
#tl svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#bubble { position: absolute; right: calc(var(--tlw) + 4px); z-index: 8; pointer-events: none; display: none; max-width: 250px; padding: 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.25; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#bubble b { color: var(--tint); font-weight: 600; }

/* back to what plays */
#arrow { position: absolute; right: calc(var(--tlw) + 10px); width: 44px; height: 44px; border-radius: 22px; z-index: 5; display: none; place-items: center; font-size: 20px; color: var(--tint); box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#arrow.up { top: calc(var(--pinH) + 10px); display: grid; } #arrow.down { bottom: calc(var(--bot) + 10px); display: grid; }
#stuck { position: absolute; left: 12px; right: calc(var(--tlw) + 6px); z-index: 5; display: none; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); overflow: hidden; }
#stuck.up { top: calc(var(--pinH) + 4px); display: block; } #stuck.down { bottom: calc(var(--bot) + 4px); display: block; }
#stuck .rh { padding: 8px 8px 10px 14px; min-height: 0; }
#stuck .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--track); } #stuck .bar i { display: block; height: 100%; background: var(--tint); }

/* prototype switches */
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 8px; right: 8px; z-index: 30; display: flex; gap: 6px; justify-content: center; }
#sw .p { display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; height: 36px; box-shadow: 0 2px 10px rgba(0,0,0,.35); font-size: 13px; }
#sw .p button { color: #fff; height: 36px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
#sw .p button.arr { font-size: 19px; padding: 0 10px; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 48px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }
</style>

const VARIANTS = [["who", "A · Who"], ["twoline", "B · Two lines"], ["ticks", "C · Ticks"], ["edge", "D · Edge bar"]];

const Q = new URLSearchParams(location.search);
const S = {
  variant: VARIANTS.some(v => v[0] === Q.get("variant")) ? Q.get("variant") : "who",
  play: SOURCES.some(v => v[0] === Q.get("play")) ? Q.get("play") : "creation",
  playing: true, speed: +(Q.get("speed") || 1), open: new Set(),
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };

// ---------- what plays: a work (one recording) or an album ----------
let P, T = 0;
function load(key) {
  const tr = DATA[key]; let s = 0;
  const items = tr.map((x, i) => { const o = { ...x, i, start: s }; s += x.d; return o; });
  const works = new Set(items.map(x => x.work)), album = works.size > 1;
  // Performers in every track belong to the whole recording; a row names only the others.
  const k = r => r.join("|");
  const common = items[0].r.filter(r => items.every(x => x.r.some(y => k(y) === k(r))));
  const conds = new Set(items.map(x => x.cond).filter(Boolean)), cond = conds.size === 1 ? [...conds][0] : null;
  P = { key, items, total: s, album, common, cond,
    title: album ? items[0].album : items[0].work, composer: album ? null : items[0].composer,
    label: items[0].label, year: album ? null : items[0].year };
  T = key === "creation" ? items[13].start + 20 : key === "b5" ? items[1].start + 100 : items[4].start + 30;
  S.open = new Set();
}
const cur = () => { for (let i = P.items.length - 1; i >= 0; i--) if (T >= P.items[i].start) return P.items[i]; return P.items[0]; };
function differs(x) {
  const k = r => r.join("|"), c = new Set(P.common.map(k)), out = x.r.filter(r => !c.has(k(r))).map(r => `${r[0]} <b>${esc(r[1])}</b>`);
  if (x.cond && x.cond !== P.cond) out.unshift(`conductor <b>${esc(x.cond)}</b>`);
  return out;
}
let coverN = 0;
function cover(seed, label) {
  let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = h % 360, b = (a + 40 + (h >> 8) % 80) % 360, id = "g" + (++coverN);
  return `<svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a},45%,38%)"/><stop offset="1" stop-color="hsl(${b},55%,62%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id})"/><text x="8" y="90" font-family="Georgia,serif" font-size="12" fill="rgba(255,255,255,.85)">${esc(label)}</text></svg>`;

const art = () => cover(P.title + P.label, P.album ? "Tea Time" : last(P.composer));

// ---------- rows ----------
function rowText(x) {
  // A work lists its movements. An album lists works: the work first, then composer and movement.
  if (!P.album) return { t: x.t, s: "" };
  const whole = x.t === x.work;
  return { t: x.work, s: last(x.composer) + (whole ? "" : " · " + x.t) };
}
function rowHead(x) {
  const { t, s } = rowText(x), isCur = x === cur(), open = isCur || S.open.has(x.i);
  // The play button takes the chevron's slot, so opening a row never reflows its title.
  const slot = isCur ? `<span class="slot"></span>` : open ? `<span class="slot go" data-a="play" data-i="${x.i}">▶</span>` : `<span class="slot">›</span>`;
  return `<button class="rh" data-row="${x.i}"><span class="main"><div class="t">${esc(t)}<span class="d tnum">${fmt(x.d)}</span></div>${s ? `<div class="s">${esc(s)}</div>` : ""}</span>${slot}</button>`;
}
function rowBody(x) {
  const who = differs(x);
  let h = who.length ? `<div class="who">${who.join(" · ")}</div>` : "";
  if (x === cur()) h += `<div class="seek" data-seek="${x.i}"><div class="tr"><i></i></div></div><div class="times tnum"><span class="el"></span><span class="rm"></span></div>
    <div class="ctl"><button data-a="prev" aria-label="Previous">⏮</button><button data-a="back" aria-label="Back 15 seconds">↺</button><button class="pp" data-a="pp" aria-label="Play or pause"></button><button data-a="fwd" aria-label="Forward 15 seconds">↻</button><button data-a="next" aria-label="Next">⏭</button></div>`;

}
function render() {
  const per = [P.cond && `<b>${esc(P.cond)}</b>`, ...P.common.map(r => esc(r[1]))].filter(Boolean).join(" · ");
  $("#content").innerHTML = `<div class="hero"><div class="art">${art()}</div><div><h2>${esc(P.title)}</h2>${P.composer ? `<div class="c">${esc(P.composer)}</div>` : ""}
    <div class="p">${per}<br>${esc(P.label)}${P.year ? " · " + P.year : ""} · ${P.items.length} ${P.album ? "tracks" : "movements"} · ${fmt(P.total)}</div></div></div>

// ---------- timeline ----------
let G = null;
function drawTimeline() {
  const el = $("#tl"), H = el.clientHeight, n = P.items.length, gap = n > 12 ? 2 : 4, min = 3;
  let fixed = new Set(), k = 0; const avail = H - gap * (n - 1);
  for (let it = 0; it < 6; it++) { const free = P.items.filter(x => !fixed.has(x.i)).reduce((a, x) => a + x.d, 0); k = (avail - min * fixed.size) / free; let ch = false; for (const x of P.items) if (!fixed.has(x.i) && x.d * k < min) { fixed.add(x.i); ch = true; } if (!ch) break; }
  let y = 0; const segs = P.items.map(x => { const h = fixed.has(x.i) ? min : x.d * k; const s = { y, h }; y += h + gap; return s; });
  G = { segs, y(t) { const x = P.items.findLast(x => t >= x.start) || P.items[0], s = segs[x.i]; return s.y + Math.min(1, (t - x.start) / x.d) * s.h; },
    t(py) { for (const x of P.items) { const s = segs[x.i]; if (py < s.y + s.h + gap / 2 || x.i === n - 1) return x.start + Math.min(1, Math.max(0, (py - s.y) / s.h)) * x.d; } return 0; } };
  const cx = 26;
  el.innerHTML = `<svg viewBox="0 0 ${el.clientWidth} ${H}" preserveAspectRatio="none"><defs><clipPath id="pc"><rect id="pcr" x="0" y="0" width="100" height="0"/></clipPath></defs>`
    + `<g fill="var(--track)">${segs.map((s, i) => `<rect class="sg" data-i="${i}" x="${cx - 2}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g>`
    + `<g fill="var(--tint)" clip-path="url(#pc)">${segs.map(s => `<rect x="${cx - 2}" y="${s.y}" width="4" height="${s.h}"/>`).join("")}</g></svg>`;
}

    const b = $("#bubble"), sr = $("#sheet").getBoundingClientRect(); b.style.display = "block"; b.style.top = Math.max(56, Math.min(sr.height - 120, e.clientY - sr.top - 30)) + "px";
    b.innerHTML = `<b class="tnum">${fmt(t - x.start)}</b> of ${fmt(x.d)}<br>${esc(tx.t)}${tx.s ? `<br><span style="color:var(--label2)">${esc(tx.s)}</span>` : ""}`;
    $("#pcr").setAttribute("height", G.y(t)); };
  el.onpointerdown = e => { on = true; mode = null; x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); };
  el.onpointermove = e => {
    if (!on) return; const dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0);
    if (!mode && (dx > 8 || dy > 8)) mode = dy > dx * 1.5 ? "scrub" : "ignore";
    if (mode === "scrub") at(e);
  };
  el.onpointerup = el.onpointercancel = e => {
    if (!on) return; on = false; $("#bubble").style.display = "none";
    if (e.type === "pointerup" && mode === "scrub") { T = t; follow(true); toast("Seek"); }
    else if (e.type === "pointerup" && !mode) { const r = el.getBoundingClientRect(), y = e.clientY - r.top, tt = G.t(y), x = P.items.findLast(x => tt >= x.start) || P.items[0]; T = x.start; S.playing = true; follow(true); toast("Plays " + rowText(x).t); }
    if (mode === "ignore" || mode === "scrub") $("#pcr").setAttribute("height", G.y(T));
    mode = null;
  };
})();

// ---------- follow and the way back ----------
const content = $("#content");
let hold = 0, progUntil = 0;
function curRow() { return document.querySelector(`.row[data-i="${cur().i}"]`); }
function where() { // -1 above the view, 1 below, 0 visible
  const r = curRow(); if (!r) return 0; const c = content.getBoundingClientRect(), a = r.getBoundingClientRect();
  const top = c.top + 52, bot = c.bottom - 20, vis = Math.min(a.bottom, bot) - Math.max(a.top, top);
  return vis > Math.min(60, a.height * .5) ? 0 : a.bottom < top + 30 ? -1 : 1;
}
function scrollToNow(smooth) {
  const r = curRow(); if (!r) return; const c = content.getBoundingClientRect(), a = r.getBoundingClientRect();
  progUntil = Date.now() + (smooth ? 800 : 100);
  content.scrollTo({ top: Math.max(0, content.scrollTop + a.top - c.top - 52 - Math.max(12, (c.height - 52 - a.height) * .3)), behavior: smooth ? "smooth" : "auto" });
}
function follow(seeked) { const wasVisible = where() === 0; renderRows(); if (seeked || wasVisible) scrollToNow(true); }
content.addEventListener("scroll", () => {
  if (Date.now() > progUntil) hold = Date.now() + 1200;
  const h2 = content.querySelector(".hero h2"); $("#pin").classList.toggle("solid", !!h2 && h2.getBoundingClientRect().bottom < content.getBoundingClientRect().top + 52);
  edges();
}, { passive: true });
// Rebuild only when the edge state changes: a rebuild under the finger swallows the tap.
let edgeKey = "";
function edges() {
  const w = where(), ar = $("#arrow"), st = $("#stuck"), key = S.variant + w + cur().i;
  if (key === edgeKey) return; edgeKey = key;
  ar.className = "glass"; st.className = "glass";
  if (!w) return;
  ar.classList.add(w < 0 ? "up" : "down"); ar.textContent = w < 0 ? "↑" : "↓";
}
$("#arrow").onclick = () => { scrollToNow(true); toast("Back to what plays"); };
$("#stuck").onclick = e => { if (e.target.closest("[data-a]")) return; scrollToNow(true); toast("Back to what plays"); };

// ---------- taps ----------
document.addEventListener("click", e => {
  const a = e.target.closest("[data-a]");
  if (a) { e.stopPropagation(); act(a.dataset.a, +a.dataset.i); return; }
  const rh = e.target.closest(".rh[data-row]");
  if (rh && rh.closest("#rows")) {
    const i = +rh.dataset.row, x = P.items[i];
    if (x === cur()) return;
    S.open.has(i) ? S.open.delete(i) : S.open.add(i); renderRows(); toast(S.open.has(i) ? "Opened" : "Closed");
  }
}, true);
function act(a, i) {
  const c = cur();
  if (a === "pp") { S.playing = !S.playing; edgeKey = ""; toast(S.playing ? "Play" : "Pause"); tick(true); edges(); return; }
  if (a === "play") { T = P.items[i].start; S.playing = true; S.open.delete(i); toast("Plays " + rowText(P.items[i]).t); }
  if (a === "back") T = Math.max(0, T - 15);
  if (a === "fwd") T = Math.min(P.total - 1, T + 15);
  if (a === "prev") T = T - c.start > 3 || !c.i ? c.start : P.items[c.i - 1].start;
  if (a === "next" && c.i < P.items.length - 1) T = P.items[c.i + 1].start;
  if (cur() !== lastCur) follow(true); else tick(true);
}
// the seek line inside the open row
document.addEventListener("pointerdown", e => {
  const sk = e.target.closest(".seek"); if (!sk) return;
  const x = cur(); sk.setPointerCapture(e.pointerId);
  const set = ev => { const r = sk.getBoundingClientRect(); T = x.start + Math.min(.999, Math.max(0, (ev.clientX - r.left) / r.width)) * x.d; tick(true); };
  set(e); sk.onpointermove = set; sk.onpointerup = () => sk.onpointermove = null;
});

// ---------- per frame ----------
let lastPP = null, accKey = "";
function tick(force) {
  const x = cur(), f = (T - x.start) / x.d;
  if (x !== lastCur && !force) { follow(false); return; }
  document.querySelectorAll(".row.cur .tr i, #stuck .bar i").forEach(i => i.style.width = f * 100 + "%");
  const el = document.querySelector(".row.cur .el"), rm = document.querySelector(".row.cur .rm");
  if (el) { el.textContent = fmt(T - x.start); rm.textContent = "−" + fmt(x.d - (T - x.start)); }
  if (force || lastPP !== S.playing) { lastPP = S.playing; document.querySelectorAll('.row.cur .pp, .row.cur .rp, #stuck .rp').forEach(b => b.textContent = S.playing ? "❚❚" : "▶"); }
  if (G) $("#pcr").setAttribute("height", G.y(T));
  // Rebuild only on change, so a tap on play never lands on a replaced button. Ticks redraw each second.
  const ak = P.key + x.i + S.playing + S.variant + (S.variant === "ticks" ? Math.floor(T) : "");
  if (ak !== accKey) { accKey = ak; $("#acc").innerHTML = `<div class="mini">${miniHtml()}</div>`; }
  else { const pi = document.querySelector("#acc .prog i"); if (pi) pi.style.width = f * 100 + "%"; }
  drawEdge();
}
let t0 = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - t0) / 1000) * S.speed; t0 = now;
  if (S.playing) { T += dt; if (T >= P.total) { T = 0; S.playing = false; } }
  if (now - slow > 250) { slow = now; tick(); edges(); }
  requestAnimationFrame(frame);
}

// ---------- open and close; switches ----------
$("#close").onclick = () => { document.body.classList.remove("player"); };
function openPlayer() { document.body.classList.add("player"); requestAnimationFrame(() => { drawTimeline(); renderRows(); scrollToNow(false); }); }
$("#acc").onclick = e => { if (e.target.closest("[data-a]")) return; openPlayer(); };
$("#edge").onclick = () => { openPlayer(); toast("Edge bar opens the player"); };
let lastY = 0;
$("#place").addEventListener("scroll", e => { const y = e.target.scrollTop; if (y > lastY + 6 && y > 40) document.body.classList.add("min"); else if (y < lastY - 6) document.body.classList.remove("min"); lastY = y; }, { passive: true });
function renderPlace() {
  const all = Object.values(DATA).flat(), comps = [...new Set(all.map(x => x.composer))].sort((a, b) => last(a).localeCompare(last(b)));
  $("#place").innerHTML = `<h1>Library</h1><div class="sh">Composers</div><div class="pl">${comps.map(c => `<div class="pr"><div class="m">${esc(c)}<div class="s">${(n => n + (n === 1 ? " work" : " works"))(new Set(all.filter(x => x.composer === c).map(x => x.work)).size)}</div></div>${P.items.some(x => x.composer === c) ? `<span class="eq">♫</span>` : ""}</div>`).join("")}</div>
    <p style="color:var(--label2);font-size:14px;margin:20px 16px">Scroll down: the tab bar collapses and the mini player moves inline. Scroll up: it returns. A tap on the mini player opens the player.</p>`;
}
function miniHtml() {
  const x = cur(), tx = rowText(x), pp = `<span class="pp" data-a="pp">${S.playing ? "❚❚" : "▶"}</span>`, f = (T - x.start) / x.d;
  // What plays comes first; composer and conductor say whose it is. No rule shortens a title.
  const by = P.album ? [last(x.composer), x.cond ? last(x.cond) : P.common[0] && P.common[0][1]] : [last(P.composer), P.cond ? last(P.cond) : P.common[0] && P.common[0][1]];
  const who = by.filter(Boolean).join(" · ");
  const art = `<div class="art">${cover(P.title + P.label, P.album ? "Tea Time" : last(P.composer))}</div>`;
  if (S.variant === "ticks") {
    let svg = `<svg viewBox="0 0 1000 20" preserveAspectRatio="none">`, xx = 0;
    for (const it of P.items) { const w = it.d / P.total * 1000, c = it === x, pl = Math.min(w, Math.max(0, (T - it.start) / P.total * 1000));
      svg += `<rect x="${xx + 3}" y="${c ? 4 : 8}" width="${Math.max(2, w - 6)}" height="${c ? 12 : 4}" fill="var(--track)"/>`;
      if (pl > 0) svg += `<rect x="${xx + 3}" y="${c ? 4 : 8}" width="${Math.max(0, Math.min(w - 6, pl))}" height="${c ? 12 : 4}" fill="var(--tint)"/>`; xx += w; }
    return `${art}<div class="ticks">${svg}</svg></div><span class="cnt tnum">${x.i + 1}/${P.items.length}</span>${pp}`;
  }
  const l2 = S.variant === "twoline" ? (P.album ? last(x.composer) + (x.t === x.work ? "" : " · " + x.work) : P.title) : who;
  return `${art}<div class="txt"><div class="l1 ell">${esc(x.t)}</div><div class="l2 ell">${esc(l2)}</div></div>${pp}<div class="prog"><i style="width:${f * 100}%"></i></div>`;
}
let edgeSvgKey = "";
function drawEdge() {
  if (S.variant !== "edge") return; const el = $("#edge"), H = el.clientHeight, k = P.key + H;
  if (k !== edgeSvgKey) { edgeSvgKey = k; const n = P.items.length, gap = n > 12 ? 2 : 4; let y = 0; const sc = (H - gap * (n - 1)) / P.total;
    el._segs = P.items.map(x => { const s = { y, h: Math.max(2, x.d * sc) }; y += s.h + gap; return s; });
    const rects = el._segs.map(s => `<rect x="15" y="${s.y}" width="4" height="${s.h}"/>`).join("");
    el.innerHTML = `<svg viewBox="0 0 24 ${H}" preserveAspectRatio="none"><defs><clipPath id="ec"><rect id="ecr" x="0" y="0" width="24" height="0"/></clipPath></defs><g fill="var(--track)">${rects}</g><g fill="var(--tint)" clip-path="url(#ec)">${rects}</g></svg>`; }
  const x = cur(), s = el._segs[x.i]; $("#ecr").setAttribute("height", s.y + Math.min(1, (T - x.start) / x.d) * s.h);
}
function setQ() { const q = new URLSearchParams({ variant: S.variant, play: S.play }); history.replaceState(null, "", "?" + q); }
function stepVariant(d) { const i = VARIANTS.findIndex(v => v[0] === S.variant); S.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]; setQ(); document.body.classList.toggle("v-edge", S.variant === "edge"); edgeSvgKey = ""; accKey = ""; render(); toast(VARIANTS.find(v => v[0] === S.variant)[1]); }
$("#vp").onclick = () => stepVariant(-1); $("#vn").onclick = () => stepVariant(1); $("#vl").onclick = () => stepVariant(1);
$("#src").onclick = () => { const i = SOURCES.findIndex(v => v[0] === S.play); S.play = SOURCES[(i + 1) % 3][0]; setQ(); load(S.play); edgeSvgKey = ""; accKey = ""; render(); renderPlace(); };
let tt = 0;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1600); }
addEventListener("resize", () => drawTimeline());
document.body.classList.toggle("v-edge", S.variant === "edge");
if (Q.get("screen") === "player") document.body.classList.add("player");
load(S.play); render(); renderPlace(); requestAnimationFrame(frame);
</script>
</body>
</html>
