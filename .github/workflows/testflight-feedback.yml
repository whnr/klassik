name: TestFlight feedback

# Prints TestFlight screenshot and crash feedback to the log; screenshots as an artifact.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'pyjwt[crypto]'
      - run: python3 scripts/testflight_feedback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-feedback
          path: feedback/
          if-no-files-found: ignore
