<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.6, round 4. A function sample, not the future UI.
  Decided in the grilling of 2026-11-03: two levels (all composers, then one composer); it opens on the composer of what plays,
  with that work marked; a sideways scrub moves between composers; contemporaries are composers with held works inside the
  focus composer's active years, 10 years either side; active years start at Wikidata P2031 and are bright, childhood dim;
  a composer whose works do not fit shows one row a year; undated works are one row; the card plays or opens a work.
  Question: chart or list, or both. ?variant=A|B|C.
  A Chart: the composer level as a chart with a label column.
  B Year list: a list of years with the composer's works, and one row of contemporaries' works for each year (the control).
  C Chart and list: a narrow chart that navigates a list of works.
  Data: real composers, life dates, well-known works and P2031 values from Wikidata. Chopin's large catalogue is generated:
  its titles and years are sample data, and about a third has no date on purpose. No audio, no cover art.
-->

<style>

      font(g, 11); g.fillStyle = now ? K.tint : K.label2; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(it.yr, lx, it.ly);
      const yw = Math.max(g.measureText("0000").width, g.measureText(it.yr).width) + 6;
      font(g, 14, now ? 600 : 400); text(g, fit(g, it.label + (it.bin && now ? " · ▶︎ plays" : ""), W - lx - yw - 4), lx + yw, it.ly, now ? K.tint : it.bin ? K.label : K.label, 14, now ? 600 : 400);
      if (v.f > .5) hits.push({ p: 1, x0: lx - 6, x1: W, y0: it.ly - 9.5, y1: it.ly + 9.5, kind: it.bin ? "bin" : "work", obj: it.bin ? it : it.ws[0], dy: it.y });
      if (sel) ring(g, v.x, it.y, 8, K.tint);
    }
    if (o.undated.length && o.end <= S.hi) {
      const uy = y2 + 22; ring(g, v.x, uy, 4, K.tint); font(g, 14);
      text(g, `${o.undated.length} without a date ›`, lx, uy, K.tint, 14);
      if (v.f > .5) hits.push({ p: 1, x0: lx - 6, x1: W, y0: uy - 10, y1: uy + 10, kind: "undated", obj: o, dy: uy });

}
// A tap in the chart finds the focus composer's row nearest in height: on the row, on its dot, or beside the focus line.
function chartTap(x, y) {
  const rows = hits.filter(h => h.p);
  const row = rows.find(h => x >= h.x0 && y >= h.y0 && y <= h.y1);
  if (row) return select(row.kind, row.obj);
  if (Math.abs(x - L2.fx) < 28) {
    let best = null; for (const h of rows) if (Math.abs(h.dy - y) < 16 && (!best || Math.abs(h.dy - y) < Math.abs(best.dy - y))) best = h;
    if (best) return select(best.kind, best.obj);
  }
  select(null);
}

// ---------- the year list (B, and the right side of C) ----------
const list = $("#list");
function listYears(c) {
  const by = new Map(), add = (y, k, w) => { if (!by.has(y)) by.set(y, { own: [], also: [] }); by.get(y)[k].push(w); };
  for (const w of c.dated) add(w.y, "own", w);
  if (V === "B") for (const o of contemporaries(c)) for (const w of o.dated) if (w.y >= c.b && w.y <= c.end) add(w.y, "also", w);
  return [...by].sort((a, b) => a[0] - b[0]);
}
function buildList(keep) {
  const c = Cz.c, prevYear = keep ? topYear() : null;
  let h = `<div class="lhead"><b>${esc(c.full)}</b><span>${lifeOf(c)}${activeStart(c) != null ? ` · active from ${activeStart(c)}` : ""} · ${c.works.length} works</span></div>`;
  for (const [yr, { own, also }] of listYears(c)) {
    h += `<section data-y="${yr}"><div class="yh">${yr}</div>`;
    for (const w of own) h += `<button class="wr${PLAY.w === w ? " now" : ""}" data-work="${w.id}"><span class="t">${esc(w.t)}${w.set ? `<span class="s"> · ${w.set}</span>` : ""}</span>${PLAY.w === w ? `<span class="pl">▶︎</span>` : ""}</button>`;
    if (also.length) h += `<button class="also" data-also="${yr}"><span class="ell">Also: ${also.map(w => `${esc(w.c.n)} · ${esc(w.t)}`).join(", ")}</span><span class="n">${also.length}</span></button>`;
    h += `</section>`;
  }
  if (c.undated.length) h += `<section data-y="9999"><div class="yh">Without a date</div><button class="wr more" data-undated><span class="t">${c.undated.length} works without a date</span><span class="chev">›</span></button></section>`;
  list.innerHTML = h;
  if (keep && prevYear != null) scrollToYear(prevYear, false);
  else scrollToYear(PLAY.w.c === c && PLAY.w.y ? PLAY.w.y : c.dated[0]?.y ?? 0, false);
  listBand();
}
function scrollToYear(yr, smooth) {
  const secs = [...list.querySelectorAll("section")], s = secs.find(e => +e.dataset.y >= yr) || secs.at(-1);
  if (s) list.scrollTo({ top: s.offsetTop - list.querySelector(".lhead").offsetHeight * 0 - 2, behavior: smooth ? "smooth" : "instant" });
}
function topYear() { for (const s of list.querySelectorAll("section")) if (s.offsetTop + s.offsetHeight > list.scrollTop + 4) return +s.dataset.y; return null; }
function listBand() {
  if (V !== "C") return;
  const secs = [...list.querySelectorAll("section")].filter(s => +s.dataset.y < 9999), t = list.scrollTop, b = t + list.clientHeight;
  const vis = secs.filter(s => s.offsetTop + s.offsetHeight > t && s.offsetTop < b).map(s => +s.dataset.y);
  L2.band = vis.length ? [vis[0], vis.at(-1)] : null; redraw();
}
list.addEventListener("scroll", listBand, { passive: true });
list.addEventListener("click", e => {
  if (scrub.used) { scrub.used = false; return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.work) return select("work", workById(b.dataset.work));
  if (b.dataset.also) { const yr = +b.dataset.also; return select("also", { yr, ws: listYears(Cz.c).find(([y]) => y === yr)[1].also }); }
  if (b.dataset.undated != null) return select("undated", Cz.c);
});

// ---------- moving between composers: a scrub across the width ----------
// The whole width maps onto the composers in birth order, so each gets a finger's width although the lines stand close.
const scrub = { on: false, used: false };
const tip = $("#tip");
function scrubAt(clientX) {
  const all = staircase(Cz.c), r = area.getBoundingClientRect(), k = Math.floor((clientX - r.left - 20) / (r.width - 40) * all.length);
  const o = all[Math.max(0, Math.min(all.length - 1, k))];
  if (o !== L2.hl) { L2.hl = o; redraw(); }
  tip.textContent = `${o.n} · ${lifeOf(o)}`; tip.classList.add("on");
  tip.style.left = Math.max(8, Math.min(r.right - tip.offsetWidth - 8, clientX - tip.offsetWidth / 2)) + "px";
}
function scrubEnd() {
  tip.classList.remove("on"); const o = L2.hl; L2.hl = null; scrub.on = false;
  if (o && o !== Cz.c) glideTo(o); else redraw();
}
function glideTo(c) {
  select(null);
  Cz.c = c; crumbs();
  if (V !== "B") { const from = L2.scene, to = sceneFor(c), t0 = performance.now(); L2.anim = t => { const k = Math.min(1, (t - t0) / 420), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; L2.scene = mixScene(from, to, e); draw(); if (k < 1) requestAnimationFrame(L2.anim); else L2.anim = null; }; requestAnimationFrame(L2.anim); }
  if (V !== "A") { list.classList.add("fade"); buildList(true); requestAnimationFrame(() => list.classList.remove("fade")); }
}

// ---------- levels ----------
function crumbs() {
  const hint = Cz.lvl === 0 ? "tap a composer" : V === "A" ? "tap a work · drag sideways for another composer" : V === "B" ? "drag sideways for another composer" : "tap the chart to move the list · drag sideways for another composer";
  state.innerHTML = `<span class="cr${Cz.lvl === 0 ? " here" : ""}" data-l="0">All composers</span>` + (Cz.lvl ? `<span class="sepc">›</span><span class="cr here">${esc(Cz.c.n)}</span>` : "") + `<span class="sepc">·</span>${hint}`;
}
state.addEventListener("click", e => { const s = e.target.closest(".cr"); if (s && s.dataset.l === "0" && Cz.lvl) goLevel(0, null, W / 2, H / 3, -1); });
// A level change zooms the old picture away and the new one in, around the tapped point.
const off = document.createElement("canvas"), offB = document.createElement("canvas");
function goLevel(lvl, c, ax, ay, dir) {
  select(null);
  off.width = cv.width; off.height = cv.height; off.getContext("2d").drawImage(cv, 0, 0);
  Cz.lvl = lvl; if (c) Cz.c = c; crumbs(); enterLevel();
  offB.width = cv.width; offB.height = cv.height; const gb = offB.getContext("2d"); gb.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawLevel(gb);
  const t0 = performance.now();
  Cz.anim = t => {
    const k = Math.min(1, (t - t0) / 340), e = 1 - Math.pow(1 - k, 3);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    const so = dir > 0 ? 1 + .6 * e : 1 - .3 * e, sn = dir > 0 ? .7 + .3 * e : 1.5 - .5 * e, X = ax * dpr, Y = ay * dpr;
    ctx.globalAlpha = 1 - e; ctx.setTransform(so, 0, 0, so, X - X * so, Y - Y * so); ctx.drawImage(off, 0, 0);
    ctx.globalAlpha = e; ctx.setTransform(sn, 0, 0, sn, X - X * sn, Y - Y * sn); ctx.drawImage(offB, 0, 0);
    ctx.restore();
    if (k < 1) requestAnimationFrame(Cz.anim); else { Cz.anim = null; draw(); }
  };
  requestAnimationFrame(Cz.anim);
}
function enterLevel() {
  document.body.classList.toggle("l2", Cz.lvl === 2);
  if (Cz.lvl === 2) { L2.scene = sceneFor(Cz.c); if (V !== "A") buildList(false); }
}
function drawLevel(g) {
  g.clearRect(0, 0, W, H); hits = [];
  if (Cz.lvl === 0) drawOverview(g); else if (V !== "B") drawChart(g);
}
function draw() { if (!W || Cz.anim) return; drawLevel(ctx); }
function areaTap(x, y) {
  if (Cz.lvl === 0) { const h = hitAt(x, y); if (h) goLevel(2, h.obj, x, y, 1); return; }
  if (V === "A") return chartTap(x, y);
  // C: a tap on the chart moves the list to that year
  if (V === "C") scrollToYear(Math.round(L2.inv(y)), true);
}

// ---------- gestures: a tap, a sideways scrub, and in C a vertical drag on the chart ----------
let down = null, tap = null;
function onDown(e, where) {
  down = { x: e.clientX, y: e.clientY, t: performance.now(), where, mode: null, id: e.pointerId };
}
function onMove(e) {
  if (!down || e.pointerId !== down.id) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!down.mode && Math.hypot(dx, dy) > 8) {
    down.mode = Cz.lvl === 2 && Math.abs(dx) > Math.abs(dy) ? "scrub" : down.where === "area" && V === "C" && Cz.lvl === 2 ? "nav" : "move";
    if (down.mode === "scrub") { scrub.on = true; scrub.used = down.where === "list"; try { e.target.setPointerCapture(e.pointerId); } catch {} }
  }
  if (down.mode === "scrub") scrubAt(e.clientX);
  if (down.mode === "nav") { const r = area.getBoundingClientRect(); scrollToYear(Math.round(L2.inv(e.clientY - r.top)), false); }
}
function onUp(e) {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (d.mode === "scrub") return scrubEnd();
  tap = !d.mode && performance.now() - d.t < 600 ? d : null;
}
area.addEventListener("pointerdown", e => onDown(e, "area"));
list.addEventListener("pointerdown", e => onDown(e, "list"));
for (const el of [area, list]) { el.addEventListener("pointermove", onMove); el.addEventListener("pointerup", onUp); el.addEventListener("pointercancel", () => { down = null; if (scrub.on) scrubEnd(); }); }
// A tap acts on click, after the browser has placed it. A card that opens under the finger cannot catch the same tap.
area.addEventListener("click", () => { const d = tap; tap = null; if (!d) return; const r = area.getBoundingClientRect(); areaTap(d.x - r.left, d.y - r.top); });
document.addEventListener("gesturestart", e => e.preventDefault());

// Two colours mixed on the canvas: both are CSS colours, so draw through a 1-pixel canvas once per pair.
const mixCache = new Map(), mixCv = document.createElement("canvas"); mixCv.width = mixCv.height = 1;
const mixG = mixCv.getContext("2d", { willReadFrequently: true });
function rgba(c) { mixG.clearRect(0, 0, 1, 1); mixG.fillStyle = c; mixG.fillRect(0, 0, 1, 1); return mixG.getImageData(0, 0, 1, 1).data; }
function mixCol(a, b, t) {
  const k = a + b; if (!mixCache.has(k)) mixCache.set(k, [rgba(a), rgba(b)]);
  const [p, q] = mixCache.get(k), m = i => p[i] + (q[i] - p[i]) * t;
  return `rgba(${m(0) | 0},${m(1) | 0},${m(2) | 0},${(m(3) / 255).toFixed(3)})`;
}

const keys = Object.keys(VARIANTS);
function goVariant(d) { const i = (keys.indexOf(V) + d + keys.length) % keys.length; location.search = "?variant=" + keys[i]; }
$("#vname").textContent = `${V} · ${VARIANTS[V]}`;
$("#prev").onclick = () => goVariant(-1); $("#next").onclick = () => goVariant(1);
$("#reset").href = "?variant=" + V;
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") goVariant(-1); if (e.key === "ArrowRight") goVariant(1); });

function boot() { readColors(); sizeCanvas(); spacer.style.height = "0"; renderMini(); crumbs(); enterLevel(); draw(); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); mixCache.clear(); draw(); });
addEventListener("resize", () => { sizeCanvas(); if (Cz.lvl === 2) L2.scene = sceneFor(Cz.c); draw(); });
boot();
</script>
