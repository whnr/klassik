name: Specimen Pages

on:
  workflow_run:
    workflows: [Design]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Repository branch or commit to preview
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: specimen-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        if: github.event_name == 'workflow_run'
        with:
          name: specimen
          path: validated
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.3
        if: github.event_name == 'workflow_dispatch'
        with:
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: 22
      - if: github.event_name == 'workflow_dispatch'
        run: uv run --no-project --with playwright==1.64.1 playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch'
        run: design/scripts/lint.sh
      - if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p validated
          cp -R design/specimen design/fonts design/tokens.css validated/
          git rev-parse HEAD > validated/revision.txt
      # Automatic publication must not execute code from the source branch.
      - name: Prepare the public specimen
        run: |
          mkdir -p _site
          cp -R validated/specimen validated/fonts _site/
          cp validated/tokens.css _site/
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=specimen/">' > _site/index.html
          cp validated/revision.txt _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
