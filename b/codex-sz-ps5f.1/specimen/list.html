  <body>
    <!--
      The list page frame uses Composers as sample content, not as a complete people-page design.
      The find field and Filters stay under the navigation bar. Only results scroll.
      Conditions use the Library row subtitle style. Show all clears conditions for this visit, keeping find text and sort.
      Find matches names or titles at once. No page waits for the network or saves settings to a Library row.
      Section headings scroll with results. Each heading folds its whole section, as in Search; its count stays visible.
      A rich line is one VoiceOver element: name, favourite state, years and count. Pictures add no separate element.
      Proposed for sign-off: rich list is the sole Form choice. Best known has one section; Last heard uses months.
      A to Z uses sort-name letters, with full names as the fallback. Empty sections hide. Sections start expanded and retain folds during this visit.
      At accessibility sizes, sheet setting values sit below labels.
      Counts name the results left by both find text and conditions. A collapsed section still counts all its results.
      Names and tags keep their spelling. Titles, counts, controls and dates follow the page language.
      ?lang=de draws German. ?state=filtered,empty,no-match,keyboard,long or accessibility opens a review state.
      The keyboard state focuses the find field. A phone supplies its native keyboard; the viewport keeps results above it.
      Specimen controls switch states without saving app settings. The frame has no Count setting.
    -->
  </body>
</html>
