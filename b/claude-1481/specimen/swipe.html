<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Swipe Actions</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=52" />
    <link rel="stylesheet" href="specimen.css?v=52" />
    <script src="specimen.js?v=52"></script>
  </head>
  <body>
    <script>
      // The Swipe Actions page of Settings. Each edge lists its buttons as a row shows them, from left to right:
      // Swipe Right opens Download and Favourite, Swipe Left opens Play Next and Add to Queue.
      K.start(() => {
        const { el, href, form } = K;
        const { scroll } = K.page({
          tab: "library",
          title: "Swipe Actions",
          back: { label: "Settings", href: href("settings.html", { tab: "library", back: "Library" }) },
          grouped: true,
        });
        const actions = {
          none: "None",
          playNext: "Play Next",
          addToQueue: "Add to Queue",
          download: "Download",
          favourite: "Favourite",
        };
        const edge = (left, right) => [form.menu("Left", actions, left), form.menu("Right", actions, right)];
        scroll.append(
          el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "Swipe Actions")),
          form.group(
            "Swipe Right",
            edge("download", "favourite"),
            "Rows of recordings and albums. A row that cannot do an action leaves it out.",
          ),
          form.group("Swipe Left", edge("playNext", "addToQueue")),
          form.group(null, [form.button("Restore Defaults")]),
        );
      });
    </script>
  </body>
</html>
