name: Lab

# The Playback Lab app: one build of its scheme and its logic tests, with no walk and no fixture server.
# It is apart from Test, so a Lab change never changes the green-test gate of a Klassik release.
# KlassikEngine is in the paths, because the Lab links the engine.
# project.yml is in the paths too, but a change of its version lines only builds nothing: the plan job skips the build
# (scripts/lab_plan.py). The skipped run is not green for TestFlight Lab, which reads scripts/lab_plan.py gate.
on:
  push:
    branches: [main]
    paths: ["KlassikLab/**", "KlassikLabTests/**", "KlassikEngine/**", "project.yml", ".github/workflows/lab.yml"]
  pull_request:
    paths: ["KlassikLab/**", "KlassikLabTests/**", "KlassikEngine/**", "project.yml", ".github/workflows/lab.yml"]
  workflow_dispatch:

concurrency:
  group: lab-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides on a cheap runner if the macOS build runs. Any doubt, a manual run and a scheduled run build.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the merge of the PR head into its base, so its first parent is the base.
            python3 scripts/lab_plan.py plan HEAD^1 HEAD
          elif [ "$EVENT" = push ]; then
            python3 scripts/lab_plan.py plan "$BEFORE" "$GITHUB_SHA"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # The Lab code is not in the app target, so Test (which skips Lab-only changes) no longer checks its layout.
  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/lint.sh

  lab:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Remove unavailable runner simulators
        run: xcrun simctl delete unavailable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and run the Lab tests
        run: |
          set -o pipefail
          udid=$(scripts/simulator.sh)
          mkdir -p "$RUNNER_TEMP/lab"
          xcodebuild test \
            -project Klassik.xcodeproj -scheme KlassikLab \
            -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- COMPILER_INDEX_STORE_ENABLE=NO ENABLE_PREVIEWS=NO ENABLE_DEBUG_DYLIB=NO \
            2>&1 | tee "$RUNNER_TEMP/lab/build.log"
      - name: Repeat the write-error test 50 times
        run: |
          set -o pipefail
          udid=$(scripts/simulator.sh)
          xcodebuild test-without-building \
            -project Klassik.xcodeproj -scheme KlassikLab \
            -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
            -derivedDataPath build/DerivedData \
            "-only-testing:KlassikLabTests/LabCaptureTests/aFileThatCannotBeWrittenStopsTheTapAndSaysWhy()" \
            -test-iterations 50 2>&1 | tee "$RUNNER_TEMP/lab/repeat.log"
          grep -c "Test aFileThatCannotBeWrittenStopsTheTapAndSaysWhy() passed" "$RUNNER_TEMP/lab/repeat.log"
      # Warning-only, as in Test: the count shows in the summary and never fails the job.
      - name: Count build warnings
        if: always()
        run: python3 scripts/screen_report.py warnings "$RUNNER_TEMP/lab/build.log" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-build-log
          path: ${{ runner.temp }}/lab/build.log
