<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.6, round 1.
  Question: how the Chronology is shaped and how the listener zooms from composers to works. ?variant=A|B|C.
  A Lanes: one tall scroll, composers in packed lanes, pinch or − + to zoom.
  B Lens: one screen, no scroll. A focus band magnifies some years and the composers alive in them.
  C Levels: periods, then the composers of one period, then one composer with every work named.
  Fixed for this round: years run down; plain dots of one size; a set is one dot with a count;
  undated works collect at the end of the composer line; no filters; a tap on a work opens its work page.
  Data: real composers, life dates and well-known works (public facts). What "your library" holds is generated.
  Some dates are removed on purpose to show undated works. No audio, no cover art.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Chronology, round 1</title>
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.1); --fill: rgba(118,118,128,.14); --track: rgba(118,118,128,.32);
  --glass: rgba(250,250,252,.82); --glassLine: rgba(0,0,0,.08); --band: rgba(118,118,128,.07);
  --barW: 26px; --lineX: 12px; --edgeTop: calc(env(safe-area-inset-top) + 52px);
  --bot: calc(env(safe-area-inset-bottom) + 12px); --tabH: 56px; --miniH: 76px; --navH: 40px; --stH: 22px;
  --top: calc(env(safe-area-inset-top) + 48px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.14); --fill: rgba(118,118,128,.24); --track: rgba(118,118,128,.5);
  --glass: rgba(40,40,44,.82); --glassLine: rgba(255,255,255,.1); --band: rgba(118,118,128,.12);
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: left; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- the place: title, state line, drawing area ---------- */
#navbg { position: fixed; top: 0; left: 0; right: var(--barW); height: calc(var(--top) + var(--navH) + var(--stH)); z-index: 4; border-width: 0 0 .5px; }
#navbar { position: fixed; top: var(--top); left: 0; right: var(--barW); height: var(--navH); z-index: 4; display: flex; align-items: center; padding: 0 10px 0 16px; gap: 8px; }
#nt { flex: 1; font-weight: 700; font-size: 22px; }
#zoom { display: none; gap: 6px; }
body.vA #zoom { display: flex; }
#zoom button { width: 36px; height: 32px; border-radius: 16px; background: var(--fill); color: var(--tint); font-size: 20px; display: grid; place-items: center; }
#state { position: fixed; top: calc(var(--top) + var(--navH)); left: 16px; right: calc(var(--barW) + 8px); height: var(--stH); z-index: 4; font-size: 13px; color: var(--label2); }
#state .cr { color: var(--tint); }
#state .cr.here { color: var(--label); font-weight: 600; }
#state .sepc { color: var(--label3); margin: 0 4px; }
.area { position: fixed; top: calc(var(--top) + var(--navH) + var(--stH)); left: 0; right: var(--barW); bottom: calc(var(--bot) + var(--tabH) + var(--miniH) + 16px); }
#cv { pointer-events: none; z-index: 1; }
#area { z-index: 2; overflow: hidden; touch-action: none; }
body.vA #area { overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
#spacer { width: 1px; }

/* ---------- the selection card ---------- */
#card { position: fixed; left: 12px; right: calc(var(--barW) + 8px); bottom: calc(var(--bot) + var(--tabH) + var(--miniH) + 22px); z-index: 3; border-radius: 18px; padding: 12px 14px 12px; max-height: 36vh; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,.16); display: none; }
#card.on { display: block; }
#card .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 15px; background: var(--fill); color: var(--label2); display: grid; place-items: center; font-size: 14px; }
#card .ct { font-size: 17px; font-weight: 600; padding-right: 34px; }
#card .cs { font-size: 14px; color: var(--label2); margin-top: 2px; }
#card .cs b { color: var(--tint); font-weight: 400; }
#card .acts { display: flex; gap: 8px; margin-top: 10px; }
.btn { height: 38px; padding: 0 16px; border-radius: 19px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--tint); color: #fff; }
#card .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; margin-top: 10px; }
#card .nums button { height: 36px; border-radius: 10px; background: var(--card); color: var(--tint); text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
#card .nums button:active { background: var(--fill); }
#card .rows { margin-top: 8px; background: var(--card); border-radius: 12px; overflow: hidden; }
.pr { display: flex; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; position: relative; font-size: 15px; }
.pr + .pr::before { content: ""; position: absolute; top: 0; left: 12px; right: 0; border-top: .5px solid var(--sep); }
.pr .m { flex: 1; min-width: 0; } .pr .s { font-size: 13px; color: var(--label2); } .pr .chev { color: var(--label3); }
.pr:active { background: var(--fill); }

/* ---------- the work page (stub: ADR 0015 decides it) ---------- */
#page { position: fixed; top: 0; left: 0; bottom: 0; right: var(--barW); z-index: 5; background: var(--bg); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); box-shadow: -6px 0 24px rgba(0,0,0,.1); }
#page.on { transform: none; }
#page .hd { position: absolute; top: var(--top); left: 0; right: 0; height: 44px; display: flex; align-items: center; padding: 0 8px; z-index: 2; }
#page .back { color: var(--tint); display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 6px; }
#page .back b { font-size: 26px; font-weight: 400; line-height: 1; margin-top: -3px; }
#page .scroll { position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--top) + 50px) 16px calc(var(--bot) + var(--tabH) + var(--miniH) + 40px); }
#page h1 { font-size: 28px; line-height: 1.15; margin: 0 0 4px; }
#page .c { color: var(--tint); font-size: 17px; }
#page .meta { font-size: 14px; color: var(--label2); margin-top: 4px; }
#page .sh { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 0 6px 12px; }

#page .stub { font-size: 13px; color: var(--label2); background: var(--fill); border-radius: 10px; padding: 8px 12px; margin-top: 16px; }

/* ---------- tabs, mini player, timeline (locked, ADR 0014 and 0015; static here) ---------- */
#tabs { position: fixed; left: 16px; right: calc(var(--barW) + 6px); bottom: var(--bot); height: var(--tabH); display: flex; gap: 8px; z-index: 6; }
#tabs .cap { flex: 1; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 1px; } #tabs .cap b { font-size: 20px; font-weight: 400; }
#tabs .cap .on { color: var(--tint); }
#tabs .circ { width: var(--tabH); border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); flex: none; }
#mini { position: fixed; left: 16px; right: var(--lineX); bottom: calc(var(--bot) + var(--tabH) + 8px); height: var(--miniH); z-index: 7;
  background: var(--card); border-radius: 18px 0 0 18px; box-shadow: 0 4px 18px rgba(0,0,0,.14); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; }
#mini .art { width: 58px; height: 58px; border-radius: 8px; flex: none; background: linear-gradient(135deg, #8a5a44, #d9a066); }
#mini .txt { flex: 1; min-width: 0; line-height: 1.22; }
#mini .mv { font-size: 15px; font-weight: 600; } #mini .by, #mini .wk { font-size: 13px; color: var(--label2); }
#mini .pp { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; font-size: 18px; flex: none; }
#bar { position: fixed; right: 0; width: var(--barW); top: var(--edgeTop); bottom: calc(var(--bot) + var(--tabH) + 8px); z-index: 7; display: flex; flex-direction: column; gap: 3px; padding: 0 9px 0 11px; }
#bar i { display: block; background: var(--track); border-radius: 2px; }
#bar i.p { background: var(--tint); }

/* prototype switches */
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 6px; right: 6px; z-index: 30; display: flex; gap: 5px; justify-content: center; }
#sw .p { display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; height: 34px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
#sw .p button, #sw .p a { color: #fff; height: 34px; padding: 0 9px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; text-decoration: none; }
#sw .p button.arr { font-size: 18px; padding: 0 10px; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 46px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }
</style>
</head>

<div id="navbg" class="glass"></div>
<div id="navbar"><div id="nt">Chronology</div><div id="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button></div></div>
<div id="state" class="ell"></div>
<canvas id="cv" class="area"></canvas>

<div id="tabs"><div class="cap glass"><span><b>♪</b>Library</span><span class="on"><b>◷</b>Chronology</span><span><b>⚙︎</b>Settings</span></div><div class="circ glass">⌕</div></div>
<div id="mini"><div class="art"></div><div class="txt"><div class="mv ell">II. Andante</div><div class="wk ell">Symphony No. 94 “Surprise”</div><div class="by ell">Haydn · Adam Fischer</div></div><div class="pp">❚❚</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Q = new URLSearchParams(location.search);
const VARIANTS = { A: "Lanes", B: "Lens", C: "Levels" };
const V = VARIANTS[Q.get("variant")] ? Q.get("variant") : "A";
document.body.classList.add("v" + V);

// ---------- sample library: real composers and dates, generated holdings ----------
// [surname, full name, born, died or null, works]. A work is [title, year or null, set size, last year].
// A null year is an undated work: some are removed on purpose.
const RAW = [
  ["Hildegard", "Hildegard von Bingen", 1098, 1179, [["Ordo Virtutum", 1151], ["Symphonia armonie celestium revelationum", null]]],
  ["Monteverdi", "Claudio Monteverdi", 1567, 1643, [["L'Orfeo", 1607], ["Vespro della Beata Vergine", 1610], ["Il ritorno d'Ulisse in patria", 1640], ["L'incoronazione di Poppea", 1643]]],
  ["Purcell", "Henry Purcell", 1659, 1695, [["Dido and Aeneas", 1689], ["King Arthur", 1691], ["The Fairy-Queen", 1692], ["Music for the Funeral of Queen Mary", 1695]]],
  ["Vivaldi", "Antonio Vivaldi", 1678, 1741, [["L'estro armonico, Op. 3", 1711, 12], ["Stabat Mater, RV 621", 1712], ["Gloria, RV 589", 1715], ["Juditha triumphans", 1716], ["The Four Seasons, Op. 8 Nos. 1–4", 1720, 4], ["Lute Concerto in D major, RV 93", null]]],
  ["Bach", "Johann Sebastian Bach", 1685, 1750, [["Toccata and Fugue in D minor, BWV 565", null], ["Cello Suites, BWV 1007–1012", 1720, 6], ["Brandenburg Concertos", 1721, 6], ["The Well-Tempered Clavier, Book I", 1722, 24], ["St John Passion", 1724], ["St Matthew Passion", 1727], ["Goldberg Variations", 1741], ["Mass in B minor", 1749]]],
  ["Handel", "George Frideric Handel", 1685, 1759, [["Water Music", 1717], ["Giulio Cesare", 1724], ["Zadok the Priest", 1727], ["Messiah", 1741], ["Music for the Royal Fireworks", 1749]]],
  ["Haydn", "Joseph Haydn", 1732, 1809, [["Symphony No. 45 “Farewell”", 1772], ["Symphony No. 94 “Surprise”", 1791], ["Symphony No. 104 “London”", 1795], ["Trumpet Concerto", 1796], ["String Quartets, Op. 76", 1797, 6], ["Die Schöpfung", 1798]]],
  ["Mozart", "Wolfgang Amadeus Mozart", 1756, 1791, [["Sinfonia concertante, K. 364", 1779], ["Piano Concerto No. 21, K. 467", 1785], ["Le nozze di Figaro", 1786], ["Don Giovanni", 1787], ["Eine kleine Nachtmusik", 1787], ["Symphony No. 40, K. 550", 1788], ["Symphony No. 41 “Jupiter”", 1788], ["Clarinet Concerto, K. 622", 1791], ["Die Zauberflöte", 1791], ["Requiem, K. 626", 1791]]],
  ["Beethoven", "Ludwig van Beethoven", 1770, 1827, [["Piano Sonatas, Op. 2", 1795, 3], ["Piano Sonata No. 14 “Moonlight”", 1801], ["Symphony No. 3 “Eroica”", 1804], ["Violin Concerto, Op. 61", 1806], ["Symphony No. 5, Op. 67", 1808], ["Symphony No. 6 “Pastoral”", 1808], ["Piano Concerto No. 5 “Emperor”", 1809], ["Missa solemnis", 1823], ["Symphony No. 9, Op. 125", 1824], ["String Quartet No. 14, Op. 131", 1826]]],
  ["Schubert", "Franz Schubert", 1797, 1828, [["Erlkönig", 1815], ["Piano Quintet “Trout”", 1819], ["Symphony No. 8 “Unfinished”", 1822], ["Die schöne Müllerin", 1823], ["Symphony No. 9 “Great”", 1826], ["Winterreise", 1827], ["Impromptus, D. 899", 1827, 4], ["String Quintet, D. 956", 1828]]],
  ["Mendelssohn", "Felix Mendelssohn", 1809, 1847, [["Octet, Op. 20", 1825], ["A Midsummer Night's Dream, Overture", 1826], ["The Hebrides", 1830], ["Symphony No. 4 “Italian”", 1833], ["Violin Concerto in E minor", 1844], ["Elijah", 1846]]],
  ["Chopin", "Frédéric Chopin", 1810, 1849, [["Piano Concerto No. 2", 1830], ["Piano Concerto No. 1", 1830], ["Études, Op. 10", 1829, 12, 1832], ["Ballade No. 1", 1835], ["Études, Op. 25", 1835, 12, 1837], ["Préludes, Op. 28", 1839, 24], ["Piano Sonata No. 2", 1839], ["Polonaise, Op. 53", 1842], ["Barcarolle, Op. 60", 1846], ["Nocturne in C-sharp minor, B. 49", null], ["Waltz in A minor, B. 150", null], ["Mazurkas, Op. 17", null]]],
  ["Schumann", "Robert Schumann", 1810, 1856, [["Carnaval", 1835], ["Kinderszenen", 1838], ["Kreisleriana", 1838], ["Dichterliebe", 1840], ["Piano Concerto", 1845], ["Symphony No. 3 “Rhenish”", 1850]]],
  ["Liszt", "Franz Liszt", 1811, 1886, [["Hungarian Rhapsodies", 1846, 19, 1885], ["Piano Sonata in B minor", 1853], ["Les préludes", 1854], ["A Faust Symphony", 1857], ["Liebestraum No. 3", null]]],
  ["Wagner", "Richard Wagner", 1813, 1883, [["Der fliegende Holländer", 1843], ["Tannhäuser", 1845], ["Tristan und Isolde", 1859], ["Die Meistersinger von Nürnberg", 1867], ["Siegfried Idyll", 1870], ["Götterdämmerung", 1874], ["Parsifal", 1882]]],
  ["Verdi", "Giuseppe Verdi", 1813, 1901, [["Nabucco", 1842], ["Rigoletto", 1851], ["La traviata", 1853], ["Aida", 1871], ["Messa da Requiem", 1874], ["Otello", 1887], ["Falstaff", 1893]]],
  ["Brahms", "Johannes Brahms", 1833, 1897, [["Piano Concerto No. 1", 1858], ["Ein deutsches Requiem", 1868], ["Hungarian Dances", 1869, 21], ["Symphony No. 1", 1876], ["Violin Concerto", 1878], ["Symphony No. 4", 1885], ["Clarinet Quintet", 1891]]],
  ["Tchaikovsky", "Pyotr Ilyich Tchaikovsky", 1840, 1893, [["Romeo and Juliet", 1870], ["Piano Concerto No. 1", 1875], ["Swan Lake", 1876], ["Violin Concerto", 1878], ["Eugene Onegin", 1878], ["The Nutcracker", 1892], ["Symphony No. 6 “Pathétique”", 1893]]],
  ["Dvořák", "Antonín Dvořák", 1841, 1904, [["Slavonic Dances, Op. 46", 1878, 8], ["Symphony No. 9 “From the New World”", 1893], ["String Quartet No. 12 “American”", 1893], ["Cello Concerto", 1895], ["Rusalka", 1901]]],
  ["Mahler", "Gustav Mahler", 1860, 1911, [["Symphony No. 1", 1888], ["Symphony No. 2 “Resurrection”", 1894], ["Symphony No. 5", 1902], ["Kindertotenlieder", 1904], ["Das Lied von der Erde", 1909], ["Symphony No. 9", 1909]]],
  ["Debussy", "Claude Debussy", 1862, 1918, [["Suite bergamasque", 1890], ["String Quartet", 1893], ["Prélude à l'après-midi d'un faune", 1894], ["La mer", 1905], ["Préludes, Book I", 1910, 12], ["Jeux", 1913]]],
  ["Strauss", "Richard Strauss", 1864, 1949, [["Don Juan", 1888], ["Also sprach Zarathustra", 1896], ["Salome", 1905], ["Der Rosenkavalier", 1910], ["Metamorphosen", 1945], ["Vier letzte Lieder", 1948]]],
  ["Rachmaninoff", "Sergei Rachmaninoff", 1873, 1943, [["Piano Concerto No. 2", 1901], ["Piano Concerto No. 3", 1909], ["All-Night Vigil", 1915], ["Rhapsody on a Theme of Paganini", 1934], ["Symphonic Dances", 1940]]],
  ["Ravel", "Maurice Ravel", 1875, 1937, [["String Quartet", 1903], ["Daphnis et Chloé", 1912], ["Le tombeau de Couperin", 1917], ["Boléro", 1928], ["Piano Concerto in G", 1931]]],
  ["Bartók", "Béla Bartók", 1881, 1945, [["Bluebeard's Castle", 1911], ["Music for Strings, Percussion and Celesta", 1936], ["Concerto for Orchestra", 1943]]],
  ["Stravinsky", "Igor Stravinsky", 1882, 1971, [["The Firebird", 1910], ["Petrushka", 1911], ["The Rite of Spring", 1913], ["Symphony of Psalms", 1930], ["Agon", 1957]]],
  ["Shostakovich", "Dmitri Shostakovich", 1906, 1975, [["Symphony No. 5", 1937], ["Symphony No. 7 “Leningrad”", 1941], ["24 Preludes and Fugues, Op. 87", 1951, 24], ["Symphony No. 10", 1953], ["String Quartet No. 8", 1960]]],
  ["Messiaen", "Olivier Messiaen", 1908, 1992, [["Quatuor pour la fin du temps", 1941], ["Turangalîla-Symphonie", 1948], ["Des canyons aux étoiles…", 1974]]],
  ["Britten", "Benjamin Britten", 1913, 1976, [["Peter Grimes", 1945], ["The Young Person's Guide to the Orchestra", 1946], ["War Requiem", 1962]]],
  ["Pärt", "Arvo Pärt", 1935, null, [["Tabula rasa", 1977], ["Fratres", 1977], ["Spiegel im Spiegel", 1978], ["Te Deum", 1985]]],
  ["Reich", "Steve Reich", 1936, null, [["Drumming", 1971], ["Music for 18 Musicians", 1976], ["Different Trains", 1988]]],
  ["Glass", "Philip Glass", 1937, null, [["Einstein on the Beach", 1976], ["Glassworks", 1982], ["Violin Concerto No. 1", 1987]]],
];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NOW = 2026;
// The periods of ADR 0011. A composer belongs to the period of the year they turned 35, or of their death if it came first.
const PERIODS = [["Early Music", null, 1600], ["Baroque", 1600, 1750], ["Classical", 1750, 1820], ["Romantic", 1820, 1910], ["Modern", 1910, 1975], ["Contemporary", 1975, null]]
  .map(([name, start, end], i) => ({ i, name, start, end }));
const periodOfYear = y => PERIODS.findLast(p => (p.start ?? -1e9) <= y);
const COMPS = RAW.map(([n, full, b, d, ws], i) => {
  const c = { i, n, full, b, d, end: d ?? NOW };
  c.works = ws.map(([t, y, set, y2], j) => ({ id: `${i}-${j}`, t, y, set: set || 0, y2: y2 || y, c, rec: 1 + Math.floor(rnd() * 4) }));
  c.dated = c.works.filter(w => w.y != null).sort((a, b) => a.y - b.y);
  c.undated = c.works.filter(w => w.y == null);
  c.period = periodOfYear(Math.min(b + 35, c.end));
  return c;
});
const NWORKS = COMPS.reduce((s, c) => s + c.works.length, 0);

// ---------- the year axis: the empty centuries after Hildegard fold into a short gap ----------
const Y0 = 1090, F0 = 1185, F1 = 1560, FOLD = 14, YEND = 2030;
const U = y => y <= F0 ? y - Y0 : y < F1 ? (F0 - Y0) + (y - F0) * FOLD / (F1 - F0) : (F0 - Y0) + FOLD + (y - F1);
const Yr = u => { const a = F0 - Y0; return u <= a ? u + Y0 : u < a + FOLD ? F0 + (u - a) * (F1 - F0) / FOLD : F1 + (u - a - FOLD); };
const UT = U(YEND);

// Packed lanes: a composer reuses the lane of one who died before they were born.
const laneEnd = [];
for (const c of COMPS) {
  let l = laneEnd.findIndex(e => e + 3 < c.b);
  if (l < 0) { l = laneEnd.length; laneEnd.push(0); }
  laneEnd[l] = c.end + (c.undated.length ? 6 : 0); c.lane = l;
}
const NL = laneEnd.length;

// ---------- drawing basics ----------

// C · Levels: periods, then one period's composers, then one composer.
// =====================================================================
const RXC = 46;
const Cz = { lvl: 0, p: null, c: null, anim: null };
const compsOf = p => COMPS.filter(c => c.period === p);
function cGeom0() { const s = (H - 8) / UT; return { s, y: u => 4 + u * s }; }
function drawC0(g) {
  const G = cGeom0(), lx0 = W * .52, lw = (W - lx0 - 6) / NL;
  for (const p of PERIODS) {
    const cs = compsOf(p); if (!cs.length) continue;
    const ya = G.y(U(p.start ?? Y0)) + 1.5, yb = G.y(U(p.end ?? YEND)) - 1.5;
    rrect(g, 8, ya, W - 14, yb - ya, 10, K.card);
    const n = cs.reduce((s, c) => s + c.works.length, 0), big = yb - ya > 44;
    text(g, p.name, 20, ya + (big ? 16 : (yb - ya) / 2 - 7), K.label, 15, 600);
    text(g, `${p.start ?? "before"}${p.start ? "–" : " "}${p.end ?? "now"}`, 20, ya + (big ? 34 : (yb - ya) / 2 + 8), K.label2, 12);
    if (big) text(g, `${cs.length} composer${cs.length > 1 ? "s" : ""} · ${n} works`, 20, ya + 50, K.label2, 12);
    hits.push({ x0: 8, x1: W - 6, y0: ya, y1: yb, kind: "period", obj: p });
  }
  for (const c of COMPS) {
    const x = lx0 + (c.lane + .5) * lw;
    line(g, x, G.y(U(c.b)), x, G.y(U(c.end)), K.label3, 1.5);
    for (const w of c.dated) dot(g, x, G.y(U(w.y)), 1.6, K.label2);
  }
}
function cGeom1(p) {
  const cs = compsOf(p), lo = Math.min(...cs.map(c => c.b)) - 3, hi = Math.max(...cs.map(c => c.end + (c.undated.length ? 6 : 0))) + 3;
  const top = 8, s = (H - top - 8) / (hi - lo);
  return { cs, lo, hi, s, y: yr => top + (yr - lo) * s, x: i => RXC + (i + .5) * (W - RXC - 4) / cs.length, cw: (W - RXC - 4) / cs.length };
}
function drawC1(g, p) {
  const G = cGeom1(p);
  // the period's own years, as a band behind the composers who belong to it
  const pa = G.y(Math.max(G.lo, p.start ?? G.lo)), pb = G.y(Math.min(G.hi, p.end ?? G.hi));
  g.fillStyle = K.band; g.fillRect(0, pa, W, pb - pa);
  if (p.start && p.start > G.lo) text(g, `${p.name} begins`, W - 8, pa + 8, K.label3, 10, 400, "right");
  if (p.end && p.end < G.hi) text(g, `${p.name} ends`, W - 8, pb - 8, K.label3, 10, 400, "right");
  const st = stepFor(G.s);
  for (let y = Math.ceil(G.lo / st) * st; y <= G.hi; y += st) { const py = G.y(y); line(g, RXC - 5, py, RXC - 1, py, K.label3); text(g, String(y), RXC - 7, py, K.label2, 10, 400, "right"); }
  G.cs.forEach((c, i) => {
    const x = G.x(i), y1 = G.y(c.b), y2 = G.y(c.end);
    line(g, x, y1, x, y2, K.label3, 2);
    if (!c.d) for (let k = 0; k < 3; k++) dot(g, x, y2 + 5 + k * 5, 1, K.label3);
    font(g, 11, 600); const nw = g.measureText(c.n).width;
    vtext(g, nw < y2 - y1 - 6 ? c.n : fit(g, c.n, y2 - y1 - 6), x + 4, y1 + 2, K.label, 11, 600);
    for (const w of c.dated) workDot(g, x, G.y(w.y), w, K.label2, 4);
    if (c.undated.length) undatedRing(g, x, y2 + 10, c, K.label2, 4);
    hits.push({ x0: x - G.cw / 2, x1: x + G.cw / 2, y0: 0, y1: H, kind: "zoomc", obj: c });
  });
}
function cGeom2(c) {
  const und = c.undated.length ? 26 + 18 * Math.min(4, c.undated.length) : 0;
  const lo = c.b - 2, hi = c.end + 2, top = 10, s = (H - top - 8 - und) / (hi - lo);
  return { lo, hi, s, und, y: yr => top + (yr - lo) * s, mx: Math.round(W * .36) };
}
function drawC2(g, c) {
  const G = cGeom2(c);
  const st = stepFor(G.s, 30);
  for (let y = Math.ceil(G.lo / st) * st; y <= G.hi; y += st) { const py = G.y(y); line(g, RXC - 5, py, RXC - 1, py, K.label3); text(g, String(y), RXC - 7, py, K.label2, 10, 400, "right"); }
  // contemporaries: faint lines left of the main line; a tap moves to them
  const near = COMPS.filter(o => o !== c && o.b < c.end && o.end > c.b).sort((a, b) => Math.abs(a.b - c.b) - Math.abs(b.b - c.b)).slice(0, 4).sort((a, b) => a.b - b.b);
  near.forEach((o, k) => {
    const x = RXC + 10 + k * 17, y1 = G.y(Math.max(G.lo, o.b)), y2 = G.y(Math.min(G.hi, o.end));
    line(g, x, y1, x, y2, K.label3, 1.5);
    font(g, 10, 500); vtext(g, fit(g, o.n, y2 - y1 - 4), x + 3, y1 + 2, K.label2, 10, 500);
    hits.push({ x0: x - 8, x1: x + 8, y0: y1, y1: y2, kind: "lateral", obj: o });
  });
  const x = G.mx, y1 = G.y(c.b), y2 = G.y(c.end);
  line(g, x, y1, x, y2, K.tint, 3);
  text(g, c.d ? `${c.b}` : `${c.b}`, x - 8, y1, K.tint, 11, 600, "right");
  if (c.d) text(g, `${c.d}`, x - 8, y2, K.tint, 11, 600, "right");
  const items = c.dated.map(w => ({ w, y: G.y(w.y) }));
  for (const it of items) { dot(g, x, it.y, 4.5, K.tint); if (selected && selected.obj === it.w) ring(g, x, it.y, 8, K.tint); }
  stack(items, 19, 6, y2 + 4);
  for (const it of items) {
    const lx = x + 16;
    if (Math.abs(it.ly - it.y) > 1) line(g, x + 5, it.y, lx - 3, it.ly, K.label3, .8);
    font(g, 11, 400); g.fillStyle = K.label2; g.textAlign = "left"; g.textBaseline = "middle"; const ys = String(it.w.y); g.fillText(ys, lx, it.ly);
    const yw = g.measureText("0000").width + 6;
    font(g, 14, 400); const t = fit(g, it.w.t + (it.w.set ? ` · ${it.w.set}` : ""), W - lx - yw - 6);
    text(g, t, lx + yw, it.ly, K.label, 14);
    hits.push({ p: 1, x0: x - 8, x1: W, y0: it.ly - 9, y1: it.ly + 9, kind: "work", obj: it.w });
  }
  if (c.undated.length) {
    let y = y2 + 22; ring(g, x, y, 4, K.tint); text(g, "Without a date", x + 16, y, K.label2, 12, 600);
    for (const w of c.undated.slice(0, 4)) { y += 18; font(g, 14); text(g, fit(g, w.t, W - x - 22), x + 16, y, K.label, 14); hits.push({ p: 1, x0: x - 8, x1: W, y0: y - 9, y1: y + 9, kind: "work", obj: w }); }
  }
}
function drawCLevel(g) {
  g.clearRect(0, 0, W, H); hits = [];
  if (Cz.lvl === 0) drawC0(g); else if (Cz.lvl === 1) drawC1(g, Cz.p); else drawC2(g, Cz.c);
}
function cCrumbs() {
  const parts = [["All periods", 0]];
  if (Cz.lvl >= 1) parts.push([Cz.p.name, 1]);
  if (Cz.lvl === 2) parts.push([Cz.c.n, 2]);
  const hint = ["tap a period", "tap a composer", "tap a work, or a line on the left"][Cz.lvl];
  state.innerHTML = parts.map(([s, l], i) => `<span class="cr${i === parts.length - 1 ? " here" : ""}" data-l="${l}">${esc(s)}</span>`).join(`<span class="sepc">›</span>`) + `<span class="sepc">·</span>${hint}`;
}
state.addEventListener("click", e => { const s = e.target.closest(".cr"); if (!s || V !== "C") return; const l = +s.dataset.l; if (l < Cz.lvl) cGo(l, Cz.p, Cz.c, W / 2, H / 2, -1); });
// A level change zooms the old picture out of the way and the new one in, around the tapped point.
const off = document.createElement("canvas"), offB = document.createElement("canvas");
function cGo(lvl, p, c, ax, ay, dir) {
  select(null);
  off.width = cv.width; off.height = cv.height; off.getContext("2d").drawImage(cv, 0, 0);
  Cz.lvl = lvl; Cz.p = p; Cz.c = c; cCrumbs();
  offB.width = cv.width; offB.height = cv.height; const gb = offB.getContext("2d"); gb.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCLevel(gb);
  const t0 = performance.now();
  Cz.anim = t => {
    const k = Math.min(1, (t - t0) / 340), e = 1 - Math.pow(1 - k, 3);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    const so = dir > 0 ? 1 + .6 * e : 1 - .3 * e, sn = dir > 0 ? .7 + .3 * e : 1.5 - .5 * e;
    const X = ax * dpr, Y = ay * dpr;
    ctx.globalAlpha = 1 - e; ctx.setTransform(so, 0, 0, so, X - X * so, Y - Y * so); ctx.drawImage(off, 0, 0);
    ctx.globalAlpha = e; ctx.setTransform(sn, 0, 0, sn, X - X * sn, Y - Y * sn); ctx.drawImage(offB, 0, 0);
    ctx.restore();
    if (k < 1) requestAnimationFrame(Cz.anim); else { Cz.anim = null; draw(); }
  };
  requestAnimationFrame(Cz.anim);
}
function drawC(g) { if (Cz.anim) return; drawCLevel(g); }
function cTap(x, y) {
  const h = hitAt(x, y);
  if (!h) return select(null);
  if (h.kind === "period") return cGo(1, h.obj, null, x, y, 1);
  if (h.kind === "zoomc") return cGo(2, Cz.p, h.obj, x, y, 1);
  if (h.kind === "lateral") return cGo(2, h.obj.period, h.obj, x, y, 1);
  select(h.kind, h.obj);
}

// =====================================================================
// shared: drawing, taps, gestures, switcher
// =====================================================================
function draw() { if (!W) return; if (V === "A") drawA(ctx); else if (V === "B") drawB(ctx); else drawC(ctx); }
let down = null;
area.addEventListener("pointerdown", e => {
  const r = area.getBoundingClientRect();
  down = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX - r.left, ly: e.clientY - r.top, py: e.clientY, moved: false, id: e.pointerId };
  if (V === "B") { B.v = 0; B.go = null; area.setPointerCapture(e.pointerId); }
});
area.addEventListener("pointermove", e => {
  if (!down || e.pointerId !== down.id) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
  if (V === "B" && down.moved && !pinch) {
    const dy = e.clientY - down.py, m = B.map; down.py = e.clientY;
    const du = -dy / m.pi; B.f = Math.max(B.hw, Math.min(UT - B.hw, B.f + du)); B.v = du; bKick();
  }
});
area.addEventListener("pointerup", e => {
  if (!down || e.pointerId !== down.id) return;
  const d = down; down = null;
  if (!d.moved && performance.now() - d.t < 600) { if (V === "A") aTap(d.lx, d.ly); else if (V === "B") bTap(d.lx, d.ly); else cTap(d.lx, d.ly); }
  else if (V === "B") bKick();
});
area.addEventListener("pointercancel", () => { down = null; });
area.addEventListener("scroll", () => { if (V === "A") draw(); }, { passive: true });
// pinch (A): the year under the fingers stays under them
let pinch = null;
const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
area.addEventListener("touchstart", e => {
  if (V !== "A" || e.touches.length !== 2) return;
  const r = area.getBoundingClientRect(); down = null;
  pinch = { d0: tdist(e.touches), s0: A.s, my: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top };
}, { passive: true });
area.addEventListener("touchmove", e => {
  if (!pinch || e.touches.length !== 2) return; e.preventDefault();
  aZoom(pinch.s0 * tdist(e.touches) / pinch.d0, pinch.my);
}, { passive: false });
area.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });
document.addEventListener("gesturestart", e => e.preventDefault());
$("#zin").onclick = () => aZoomAnim(1.8);
$("#zout").onclick = () => aZoomAnim(1 / 1.8);

const keys = Object.keys(VARIANTS);
function goVariant(d) { const i = (keys.indexOf(V) + d + keys.length) % keys.length; location.search = "?variant=" + keys[i]; }
$("#vname").textContent = `${V} · ${VARIANTS[V]}`;
$("#prev").onclick = () => goVariant(-1); $("#next").onclick = () => goVariant(1);
$("#reset").href = "?variant=" + V;
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") goVariant(-1); if (e.key === "ArrowRight") goVariant(1); });

function boot() {
  readColors(); sizeCanvas();
  if (V === "A") aInit(); else spacer.style.height = "0";
  if (V === "C") cCrumbs();
  draw();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); draw(); });
addEventListener("resize", () => { const u = V === "A" ? (area.scrollTop) / A.s : 0; sizeCanvas(); if (V === "A") { A.fit = (H - 2 * PAD) / UT; A.s = Math.max(A.s, A.fit); aSize(); area.scrollTop = u * A.s; } draw(); });
boot();
</script>
