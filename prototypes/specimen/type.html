<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type sheet</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css?v=26">
<link rel="stylesheet" href="specimen.css?v=26">
<script src="specimen.js?v=26"></script>
</head>
<body>
<style>
  /* Sheet of sz-rs30.1.83.5: display faces, a ratio scale and three spacing roles. Every value comes from the tune panel. */
  .seg { display: flex; margin: var(--space-s) var(--pad-right) 0 var(--pad-left); padding: 2px; border-radius: 9px; background: var(--color-fill-quiet); }
  .seg button { flex: 1; height: 30px; border-radius: 7px; }
  .seg button.on { background: var(--color-background-elevated); box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); font-weight: 600; }
  .disp { font-family: var(--disp-family); font-weight: var(--disp-weight); letter-spacing: var(--disp-track); line-height: var(--disp-lh); font-optical-sizing: auto; }
  .disp.page { font-size: var(--disp-page); }
  .disp.rowsize { font-size: var(--type-body-size); }

  /* The wall: one card for each face. */
  .wall { padding: 0 var(--pad-right) var(--g-sec) var(--pad-left); }
  .card { padding: var(--g-between) 0; border-bottom: 0.5px solid var(--color-separator); }
  .card .top { display: flex; align-items: baseline; gap: var(--space-s); }
  .card .top .name { flex: 1; }
  .card .star { font-size: 22px; line-height: 1; padding: 4px 2px 4px 10px; color: var(--color-text-tertiary); }
  .card .star.on { color: var(--color-favourite); }
  .card .open { color: var(--color-tint); }
  .card > * + * { margin-top: var(--g-in); }
  .card.cur .name { color: var(--color-tint); }

  /* The context view: a work page, a composer's works and movement rows on the tuned values. */
  .ctx .page-head { padding-top: var(--g-between); }
  .ctx .page-head .meta { margin-top: var(--g-in); }
  .ctx .section { margin-top: var(--g-sec); }
  .ctx .section-head { font: 600 var(--type-title3-size)/1.25 var(--type-body-family); color: var(--color-text-primary); padding-bottom: var(--g-in); text-transform: none; }
  .ctx .section-head.disp { font-family: var(--disp-family); font-weight: var(--disp-weight); font-size: var(--type-title3-size); line-height: var(--disp-lh); letter-spacing: var(--disp-track); }
  /* The text face replaces SF inside the context view and the text cards only; the specimen chrome stays SF, as iOS chrome would. */
  .ctx, .tcard { --type-largeTitle-family: var(--text-family); --type-title1-family: var(--text-family); --type-title2-family: var(--text-family); --type-title3-family: var(--text-family);
    --type-headline-family: var(--text-family); --type-body-family: var(--text-family); --type-callout-family: var(--text-family); --type-subheadline-family: var(--text-family);
    --type-footnote-family: var(--text-family); --type-caption1-family: var(--text-family); --type-caption2-family: var(--text-family); }
  /* Durations and years align in columns: tabular and lining, whatever the face defaults to. */
  .ctx, .tcard, .card .disp, .ctx .nums, .tcard .nums { font-variant-numeric: var(--fig); }
  .wall h2 { margin-top: var(--g-sec); }
  .ctx .row { padding-top: calc(var(--g-between) / 2); padding-bottom: calc(var(--g-between) / 2); align-items: flex-start; }
  .ctx .row .main > * + * { margin-top: var(--g-in); }
  .ctx .lead { display: flex; gap: var(--space-s); align-items: baseline; }
  .ctx .lead > :first-child { flex: 1; }
  .ctx .row .trail { align-self: center; }
  .ctx.plain .list { background: transparent; border-radius: 0; overflow: visible; }
  .ctx.plain .section { margin-left: 0; margin-right: 0; }
  .ctx.plain .section-head { padding-left: var(--pad-left); padding-right: var(--pad-right); }
  .ctx.plain .row { padding-left: var(--pad-left); padding-right: var(--pad-right); }
  .ctx.plain .row + .row::before { left: var(--sep-plain, var(--pad-left)); right: 0; }
  .facepick { display: flex; flex-wrap: wrap; gap: var(--space-s); align-items: center; padding: var(--space-s) var(--pad-right) 0 var(--pad-left); }
  .facepick select { flex: 1 1 40%; min-width: 0; height: 32px; border-radius: 8px; border: 0; padding: 0 8px; background: var(--color-fill-quiet); -webkit-appearance: none; appearance: none; }

  /* The player rows of ADR 0027, drawn static: one played, one playing and open, one closed with content, one plain. */
  .ctx .track .row { align-items: center; }
  .ctx .track .slot { flex: none; width: 32px; display: flex; justify-content: flex-end; align-items: center; }
  .ctx .round { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
  .ctx .round svg { width: 14px; height: 14px; }
  .ctx .round.faint { background: var(--color-fill-quiet); color: var(--color-text-secondary); }
  .ctx .disclose { flex: none; display: inline-flex; width: 12px; justify-content: center; color: var(--color-tint); }
  .ctx .disclose svg { width: 7px; height: 12px; }
  .ctx .disclose.down { transform: rotate(90deg); }
  .ctx .open-body { padding: 0 var(--pad-right) calc(var(--g-between) / 2) var(--pad-left); display: grid; gap: var(--g-in); }
  .ctx.inset .open-body { padding-left: var(--space-l); padding-right: var(--space-l); }
  .ctx .people-rows, .ctx .notes { display: grid; gap: var(--g-in); }
  .ctx .note { display: flex; gap: var(--space-s); text-align: left; }
  .ctx .note .at { flex: none; color: var(--color-tint); }
  .ctx .mv-bar { position: relative; height: 6px; margin-top: var(--space-s); border-radius: var(--radius-full); background: var(--color-fill-standard); }
  .ctx .mv-bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--radius-full); background: var(--color-tint); }
  .ctx .mv-bar .note-dot { position: absolute; top: -9px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--color-text-secondary); }
  .ctx .mv-bar .note-span { position: absolute; top: -8px; height: 4px; border-radius: 2px; background: var(--color-text-secondary); }
  .ctx .mv-times { display: flex; justify-content: space-between; }
  .ctx .mv-controls { display: flex; justify-content: center; gap: var(--space-xxl); align-items: center; }
  .ctx .mv-controls button { width: var(--size-hitTarget); height: var(--size-hitTarget); display: grid; place-items: center; }
  .ctx .mv-controls svg { width: 22px; height: 22px; }
  .ctx .mv-controls .main-btn svg { width: 30px; height: 30px; }
  .ctx .add-note { justify-self: start; color: var(--color-tint); }

  /* The scale table. */
  .scale-t { width: calc(100% - var(--pad-left) - var(--pad-right)); margin: var(--g-between) var(--pad-right) 0 var(--pad-left); border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .scale-t td, .scale-t th { padding: 6px 4px 6px 0; border-bottom: 0.5px solid var(--color-separator); text-align: left; vertical-align: baseline; }
  .scale-t th { font-weight: 400; color: var(--color-text-secondary); }
  .gapbar { height: 10px; background: var(--color-tint); border-radius: 2px; }
  pre.out { margin: var(--space-s) var(--pad-right) 0 var(--pad-left); padding: var(--space-m); border-radius: var(--radius-m); background: var(--color-fill-quiet); font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }

  /* The tune panel: it rises over the tab bar and leaves the page above it visible, so a slide shows at once. */
  .tune { position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--color-background-elevated); box-shadow: 0 -2px 14px rgb(0 0 0 / 0.2); border-radius: 14px 14px 0 0;
    padding: var(--space-s) var(--space-l) calc(env(safe-area-inset-bottom) + var(--space-l)); transform: translateY(105%); transition: transform 0.3s; font: 13px/1.3 -apple-system, system-ui, sans-serif; }
  .tune.on { transform: none; }
  .tune .hd { display: flex; justify-content: space-between; align-items: center; position: sticky; top: calc(-1 * var(--space-s)); background: inherit; padding: 4px 0 6px; z-index: 1; }
  .tune .ctl { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 8px; min-height: 36px; }
  .tune .ctl output { text-align: right; font-variant-numeric: tabular-nums; color: var(--color-text-secondary); }
  .tune input[type=range] { width: 100%; accent-color: var(--color-tint); }
  .tune .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px 104px; }
  .tune .chips button, .tune .tog button { height: 28px; padding: 0 10px; border-radius: 14px; background: var(--color-fill-quiet); }
  .tune .chips button.on, .tune .tog button.on { background: var(--color-tint); color: #fff; }
  .tune .tog { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 2 / 4; }
  .tune h3 { font: 600 13px/1 -apple-system, system-ui, sans-serif; color: var(--color-text-secondary); margin: 12px 0 4px; }
  .tune .dim { opacity: 0.35; pointer-events: none; }
  .tune .tb { color: var(--color-tint); font-weight: 600; padding: 6px 0 6px 12px; }
</style>
<script>
const PHI = (1 + Math.sqrt(5)) / 2;
const GF = (q) => `https://fonts.googleapis.com/css2?family=${q}&display=swap`;
// The candidates: the six of the grilling, then the twelve of branch research/display-typefaces. All bundled faces are OFL 1.1.
const FACES = [
  { id: "sf", name: "SF Pro (no display face)", family: "-apple-system, system-ui, sans-serif", meta: "System · the control" },
  { id: "ny", name: "New York", family: "ui-serif, 'New York', serif", meta: "System serif · opsz · free · Safari only, elsewhere a fallback" },
  { id: "source", name: "Source Serif 4", family: "'Source Serif 4', serif", css: GF("Source+Serif+4:opsz,wght@8..60,200..900"), meta: "OFL · opsz 8–60 · tabular · Adobe 2021" },
  { id: "ebg", name: "EB Garamond", family: "'EB Garamond', serif", css: GF("EB+Garamond:wght@400..800"), meta: "OFL · Garamond revival · tabular" },
  { id: "corm", name: "Cormorant Garamond", family: "'K Cormorant Garamond', serif", file: "CormorantGaramond.ttf", meta: "OFL · display Garamond · old-style figures" },
  { id: "news", name: "Newsreader", family: "'Newsreader', serif", css: GF("Newsreader:opsz,wght@6..72,200..800"), meta: "OFL · opsz 6–72 · Production Type 2020" },
  { id: "hedvig", name: "Hedvig Letters Serif", family: "'Hedvig Letters Serif', serif", css: GF("Hedvig+Letters+Serif:opsz@12..24"), meta: "OFL · 2023 · opsz 12–24 · 400 only · no tabular" },
  { id: "witt", name: "Wittgenstein", family: "'K Wittgenstein', serif", file: "Wittgenstein.ttf", meta: "OFL · 2024 · classical book face · old-style figures" },
  { id: "ancizar", name: "Ancizar Serif", family: "'Ancizar Serif', serif", css: GF("Ancizar+Serif:wght@300..900"), meta: "OFL · 2025 · humanist · tabular · small caps" },
  { id: "playfair", name: "Playfair 2.0", family: "'Playfair', serif", css: GF("Playfair:opsz,wght@5..1200,300..900"), meta: "OFL · 2023 · opsz 5–1200 · 1.8 MB" },
  { id: "bodoni", name: "Bodoni Moda", family: "'Bodoni Moda', serif", css: GF("Bodoni+Moda:opsz,wght@6..96,400..900"), meta: "OFL · Didone · opsz 6–96" },
  { id: "piazzolla", name: "Piazzolla", family: "'K Piazzolla', serif", file: "Piazzolla.ttf", meta: "OFL · sharp old style · opsz 8–30 · old-style figures" },
  { id: "literata", name: "Literata", family: "'Literata', serif", css: GF("Literata:opsz,wght@7..72,200..900"), meta: "OFL · book serif · opsz 7–72" },
  { id: "brygada", name: "Brygada 1918", family: "'Brygada 1918', serif", css: GF("Brygada+1918:wght@400..700"), meta: "OFL · 2021 · Polish old style revival" },
  { id: "poltawski", name: "Poltawski Nowy", family: "'Poltawski Nowy', serif", css: GF("Poltawski+Nowy:wght@400..700"), meta: "OFL · 2023 · Antykwa revival (1928)" },
  { id: "ibarra", name: "Ibarra Real Nova", family: "'Ibarra Real Nova', serif", css: GF("Ibarra+Real+Nova:wght@400..700"), meta: "OFL · Spanish Baroque (1780) · no tabular" },
  { id: "junicode", name: "Junicode 2", family: "'Junicode', serif", face: "https://cdn.jsdelivr.net/gh/psb1558/Junicode-font@v2.226/webfiles/JunicodeVF-Roman.woff2", meta: "OFL · 2026 · scholarly Garamond · 1 MB" },
  { id: "ysabeau", name: "Ysabeau", family: "'K Ysabeau', sans-serif", file: "Ysabeau.ttf", meta: "OFL · 2023 · humanist sans, the foil" },
];
// Text faces in place of SF, for rows, names and facts. All OFL 1.1, checked with fontTools. Full files, because the
// Google Fonts web files drop old-style figures.
const TEXT = [
  { id: "sf", name: "SF Pro", family: "-apple-system, system-ui, sans-serif", meta: "System · no old-style figures" },
  { id: "ysabeau", name: "Ysabeau", family: "'K Ysabeau', sans-serif", meta: "Humanist on a Garamond skeleton · old-style figures" },
  { id: "alegreya", name: "Alegreya Sans", family: "'K Alegreya Sans', sans-serif", files: [["AlegreyaSans-Regular.ttf", 400], ["AlegreyaSans-Medium.ttf", 500], ["AlegreyaSans-Bold.ttf", 700]], meta: "Humanist, calligraphic · old-style figures" },
  { id: "source", name: "Source Sans 3", family: "'K Source Sans 3', sans-serif", file: "SourceSans3.ttf", meta: "Humanist · Adobe · old-style figures, not tabular" },
  { id: "plex", name: "IBM Plex Sans", family: "'K IBM Plex Sans', sans-serif", file: "IBMPlexSans.ttf", meta: "Grotesque, technical edge · old-style figures, not tabular" },
  { id: "public", name: "Public Sans", family: "'K Public Sans', sans-serif", file: "PublicSans.ttf", meta: "Neutral · old-style figures" },
  { id: "atkinson", name: "Atkinson Hyperlegible Next", family: "'K Atkinson Hyperlegible Next', sans-serif", file: "AtkinsonHyperlegibleNext.ttf", meta: "2025 · made for low vision · no old-style figures" },
  { id: "instrument", name: "Instrument Sans", family: "'K Instrument Sans', sans-serif", file: "InstrumentSans.ttf", meta: "2023 · neo-grotesque · no old-style figures" },
  { id: "inter", name: "Inter", family: "'K Inter', sans-serif", file: "Inter.ttf", meta: "opsz · close to SF · no old-style figures" },
  { id: "hanken", name: "Hanken Grotesk", family: "'K Hanken Grotesk', sans-serif", file: "HankenGrotesk.ttf", meta: "Quiet grotesque · no old-style figures" },
  { id: "figtree", name: "Figtree", family: "'K Figtree', sans-serif", file: "Figtree.ttf", meta: "Geometric, friendly · no old-style figures" },
];
// Figures: a face without old-style figures shows lining ones whatever the choice.
const FIGS = { onum: "oldstyle-nums proportional-nums", "onum tnum": "oldstyle-nums tabular-nums", "lnum tnum": "lining-nums tabular-nums", lnum: "lining-nums proportional-nums" };
// Steps of each text style on the ratio, body at 0. Half and quarter steps keep the iOS order of sizes.
const STEPS = [["largeTitle", 3, 34], ["title1", 2, 28], ["title2", 1.5, 22], ["title3", 1, 20], ["headline", 0, 17], ["body", 0, 17],
  ["callout", -0.25, 16], ["subheadline", -0.5, 15], ["footnote", -1, 13], ["caption1", -1.25, 12], ["caption2", -1.5, 11]];
const DEFAULTS = { face: "ny", text: "sf", stars: "ny,corm,witt,piazzolla", ratio: Math.sqrt(PHI).toFixed(3), pstep: "2", weight: "400", track: "0", lh: "1.15",
  heads: "display", fig: "onum", list: "plain", couple: "1", sratio: Math.sqrt(PHI).toFixed(3), gin: "-4", ggr: "1", gsec: "3", view: "wall", work: "Antonín Dvořák|Symphony No. 9 in E minor, Op. 95" };

const local = (family, file, weight) => `@font-face { font-family: '${family}'; src: url("fonts/${file}") format("truetype"); font-weight: ${weight}; font-display: swap; }`;
for (const f of [...FACES, ...TEXT]) {
  const fam = f.family.split(",")[0].replace(/'/g, "");
  if (f.file) document.head.append(Object.assign(document.createElement("style"), { textContent: local(fam, f.file, "100 1000") }));
  if (f.files) document.head.append(Object.assign(document.createElement("style"), { textContent: f.files.map(([file, w]) => local(fam, file, w)).join("\n") }));
  if (f.css) document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet", href: f.css }));
  if (f.face) document.head.append(Object.assign(document.createElement("style"), { textContent: `@font-face { font-family: 'Junicode'; src: url(${f.face}) format('woff2'); font-weight: 300 700; font-display: swap; }` }));
}

K.start(() => {
  const { el, M } = K;
  const S = {};
  for (const k in DEFAULTS) S[k] = K.params.get("t_" + k) ?? DEFAULTS[k];
  const save = () => {
    for (const k in DEFAULTS) S[k] === DEFAULTS[k] ? K.params.delete("t_" + k) : K.params.set("t_" + k, S[k]);
    history.replaceState(null, "", location.pathname + "?" + K.params.toString());
  };
  const num = (k) => parseFloat(S[k]);
  const stars = () => new Set(S.stars ? S.stars.split(",") : []);
  const faceOf = (id) => FACES.find((f) => f.id === id) || FACES[1];

  const tune = el("div", { class: "tune" });
  const { scroll } = K.page({ tab: "settings", title: "Type sheet", plain: true, back: { label: "Token sheet", href: "tokens.html" },
    actions: [{ label: "Tune", onClick: () => tune.classList.toggle("on") }] });
  document.body.append(tune);

  // ---------- Values: everything derives from the ratio, the Dynamic Type size and the panel. ----------
  function values() {
    const css = getComputedStyle(document.documentElement);
    // The specimen's Dynamic Type control sets the body size; its factor scales the whole ratio scale, as UIFontMetrics would.
    const root = document.documentElement;
    const saved = root.style.getPropertyValue("--type-body-size");
    root.style.removeProperty("--type-body-size");
    const dt = (parseFloat(getComputedStyle(root).getPropertyValue("--type-body-size")) || 17) / 17;
    if (saved) root.style.setProperty("--type-body-size", saved);
    const r = num("ratio"), rs = S.couple === "1" ? r : num("sratio"), base = 17 * dt;
    const sizes = Object.fromEntries(STEPS.map(([n, s]) => [n, 17 * Math.pow(r, s) * dt]));
    return { dt, r, rs, sizes, page: 17 * Math.pow(r, num("pstep")) * dt,
      gin: base * Math.pow(rs, num("gin")), ggr: base * Math.pow(rs, num("ggr")), gsec: base * Math.pow(rs, num("gsec")) };
  }

  function apply() {
    const v = values(), root = document.documentElement.style, f = faceOf(S.face);
    for (const [n] of STEPS) root.setProperty(`--type-${n}-size`, v.sizes[n].toFixed(2) + "px");
    root.setProperty("--disp-family", f.family);
    root.setProperty("--fig", FIGS[S.fig] || FIGS.onum);
    root.setProperty("--text-family", (TEXT.find((t) => t.id === S.text) || TEXT[0]).family);
    root.setProperty("--disp-weight", S.weight);
    root.setProperty("--disp-track", S.track + "em");
    root.setProperty("--disp-lh", S.lh);
    root.setProperty("--disp-page", v.page.toFixed(2) + "px");
    root.setProperty("--g-in", v.gin.toFixed(2) + "px");
    root.setProperty("--g-between", v.ggr.toFixed(2) + "px");
    root.setProperty("--g-sec", v.gsec.toFixed(2) + "px");
    return v;
  }

  // ---------- Views ----------
  const body = el("div");
  const seg = el("div", { class: "seg t-subheadline" });
  const VIEWS = [["wall", "Wall"], ["ctx", "In context"], ["scale", "Scale"]];
  function renderSeg() {
    seg.replaceChildren(...VIEWS.map(([id, label]) => el("button", { class: S.view === id ? "on" : null, onclick: () => { S.view = id; save(); render(); } }, label)));
  }

  const SAMPLE = { title: "Symphony No. 9 in E minor, Op. 95 “From the New World”", row: "Kinderszenen, Op. 15", names: "Dvořák · Janáček · Saint-Saëns · Lutosławski · Górecki · Grieg · Sjögren", german: "Brandenburgisches Konzert Nr. 5 D-Dur, BWV 1050" };

  function wall() {
    const st = stars();
    return el("div", { class: "wall" },
      el("p", { class: "t-footnote secondary", style: "padding-top: var(--space-s)" }, "Star the faces to keep. In context shows only the starred ones, or all when none is starred. Tap a name to open it in context."),
      ...FACES.map((f) => {
        const on = st.has(f.id);
        const style = `--disp-family: ${f.family}`;
        return el("div", { class: "card" + (S.face === f.id ? " cur" : ""), style },
          el("div", { class: "top" },
            el("button", { class: "name t-headline", style: "text-align:left", onclick: () => { S.face = f.id; S.view = "ctx"; save(); render(); } }, f.name, el("span", { class: "open t-footnote" }, "  ›")),
            el("button", { class: "star" + (on ? " on" : ""), "aria-label": on ? "Unstar" : "Star", onclick: () => { on ? st.delete(f.id) : st.add(f.id); S.stars = [...st].join(","); save(); render(); } }, on ? "★" : "☆")),
          el("div", { class: "t-caption1 secondary" }, f.meta),
          el("div", { class: "disp page" }, K.titled(SAMPLE.title, K.fermata(true))),
          el("div", { class: "disp rowsize" }, SAMPLE.row),
          el("div", { class: "disp rowsize" }, SAMPLE.german),
          el("div", { class: "disp", style: "font-size: var(--type-title3-size)" }, "Recordings"),
          el("div", { class: "disp rowsize secondary" }, SAMPLE.names));
      }),
      el("h2", { class: "t-title2" }, "Text faces"),
      el("p", { class: "t-footnote secondary" }, "In place of SF for names, facts and rows. Tap a name to open it in context."),
      ...TEXT.map((t) => el("div", { class: "card tcard" + (S.text === t.id ? " cur" : ""), style: `--text-family: ${t.family}` },
        el("div", { class: "top" }, el("button", { class: "name t-headline", style: "text-align:left", onclick: () => { S.text = t.id; S.view = "ctx"; save(); render(); } }, t.name, el("span", { class: "open t-footnote" }, "  ›"))),
        el("div", { class: "t-caption1 secondary", style: "font-family: -apple-system, system-ui, sans-serif" }, t.meta),
        el("div", { class: "t-headline" }, "Karel Ančerl, Wiener Symphoniker"),
        el("div", { class: "t-subheadline" }, "Ádám Fischer, Mariss Jansons, Jiří Bělohlávek, Krystian Zimerman"),
        el("div", { class: "t-footnote secondary nums" }, "Symphony No. 9; Vltava · 37:22 · 41:58 · 1958"),
        el("div", { class: "t-body" }, "III. Scherzo. Molto vivace – Poco sostenuto"))));
  }

  // Q9 of the grilling: the conductor or soloist and the ensemble lead; every other name follows, all shown.
  function splitPeople(r) {
    const lead = r.performers.filter((p) => p.role === "conductor" || p.subRole && ["Orchestra", "Choir", "Ensemble", "Trio", "Quartet"].includes(p.subRole));
    const first = lead.length ? lead : r.performers.slice(0, 1);
    return { lead: first, rest: r.performers.filter((p) => !first.includes(p)) };
  }

  // A static player: the second movement plays and is open, with a note span, a note and a name that differs from the header.
  // "N.N." is the concert-programme mark for an unnamed player; the specimen data credits no soloist per track.
  function playerRows(rec, work) {
    const I = K.ICON;
    const faint = () => el("span", { class: "round faint", html: I.play });
    const chevron = (down) => el("span", { class: "disclose" + (down ? " down" : ""), html: I.chevron.replace('class="chevron" ', "") });
    const songs = rec.songs.slice(0, 4);
    const playing = Math.min(1, songs.length - 1), at = Math.min(252, songs[playing].duration * 0.34);
    const notes = [{ at: 130, text: "Horns and woodwinds, then the cor anglais" }, { at: 340, span: 40, text: "The theme comes back, quieter" }];
    return songs.map((s, i) => {
      const title = K.movementTitle(s, work.name);
      const block = el("div", { class: "row-block track" });
      const isPlaying = i === playing, closedWithContent = i === 2;
      block.append(el("div", { class: "row" },
        el("div", { class: "main" }, el("div", { class: isPlaying ? "t-headline" : "t-body" }, title)),
        el("div", { class: "trail t-subheadline nums" }, K.time(s.duration), closedWithContent ? chevron(false) : null, el("span", { class: "slot" }, isPlaying ? null : faint()))));
      if (isPlaying) {
        const d = s.duration;
        const bar = el("div", { class: "mv-bar" }, el("div", { class: "fill", style: `width: ${(at / d) * 100}%` }),
          ...notes.map((n) => el("div", { class: n.span ? "note-span" : "note-dot", style: `left: ${(n.at / d) * 100}%` + (n.span ? `; width: ${(n.span / d) * 100}%` : "") })));
        block.append(el("div", { class: "open-body" },
          el("div", { class: "people-rows" }, el("div", { class: "t-subheadline" }, el("span", { class: "link" }, "N.N."), el("span", { class: "secondary" }, ", cor anglais"))),
          bar,
          el("div", { class: "mv-times t-caption1 secondary nums" }, el("span", {}, K.time(at)), el("span", {}, "−" + K.time(d - at))),
          el("div", { class: "mv-controls" }, el("button", { html: I.prev }), el("button", { class: "main-btn", html: I.pause }), el("button", { html: I.next })),
          el("div", { class: "notes" }, ...notes.map((n) => el("div", { class: "note t-subheadline" },
            el("span", { class: "at nums" }, K.time(n.at) + (n.span ? `–${K.time(n.at + n.span)}` : "")), el("span", {}, n.text)))),
          el("button", { class: "add-note t-subheadline" }, "Add a note here")));
      }
      return block;
    });
  }

  function ctx() {
    const pool = facePool();
    const workTitle = (cls, text, mark) => el("div", { class: cls === "page" ? "disp page" : "t-body" }, mark ? K.titled(text, mark) : text);
    const pick = el("div", { class: "facepick" },
      el("select", { class: "t-body", "aria-label": "Face", onchange: (e) => { S.face = e.target.value; save(); render(); } },
        ...pool.map((f) => el("option", { value: f.id, selected: f.id === S.face }, f.name))),
      el("select", { class: "t-body", "aria-label": "Text face", onchange: (e) => { S.text = e.target.value; save(); render(); } },
        ...TEXT.map((t) => el("option", { value: t.id, selected: t.id === S.text }, t.name))),
      el("select", { class: "t-body", "aria-label": "Work", onchange: (e) => { S.work = e.target.value; save(); render(); } },
        ...[...M.works.values()].filter((w) => w.recordings.length > 1).map((w) => el("option", { value: w.id, selected: w.id === S.work }, w.name))));
    const work = M.works.get(S.work) || [...M.works.values()].find((w) => w.recordings.length > 1);
    const recs = K.orderedRecordings(work);
    const head = el("div", { class: "page-head" },
      workTitle("page", work.name, K.fermata(true)),
      el("div", { class: "meta t-subheadline" }, el("span", { class: "link" }, work.composer), el("span", { class: "secondary nums" }, work.year ? ` · ${work.year}` : "")));
    const plainInset = "calc(var(--pad-left) + var(--size-coverRow) + var(--space-m))";
    const recRows = recs.map((r) => {
      const { lead, rest } = splitPeople(r);
      return el("div", { class: "row", style: `--sep-inset: calc(var(--space-l) + var(--size-coverRow) + var(--space-m)); --sep-plain: ${plainInset}` },
        K.coverImage(r.album),
        el("div", { class: "main" },
          el("div", { class: "lead" }, el("div", { class: "t-headline" }, lead.map((p) => p.name).join(", ")), el("div", { class: "t-body secondary nums" }, r.year || "")),
          rest.length ? el("div", { class: "t-subheadline" }, rest.map((p) => p.name).join(", ")) : null,
          el("div", { class: "t-footnote secondary nums" }, `${r.album.name} · ${K.time(r.duration)} · ${r.songs.length} movements`)),
        el("div", { class: "trail", html: K.ICON.chevron }));
    });
    const composer = M.composers.get("Frédéric Chopin");
    const works = [...composer.works].slice(0, 8);
    const workRows = works.map((w) => el("div", { class: "row" },
      el("div", { class: "main" }, workTitle("rowsize", w.name), el("div", { class: "t-footnote secondary nums" }, [w.year, `${w.recordings.length} recording${w.recordings.length === 1 ? "" : "s"}`].filter(Boolean).join(" · "))),
      el("div", { class: "trail", html: K.ICON.chevron })));
    const section = (title, rows) => el("section", { class: "section" }, el("div", { class: "section-head" + (S.heads === "display" ? " disp" : "") }, title), el("div", { class: "list" }, ...rows));
    return el("div", { class: "ctx " + S.list }, pick, head,
      el("div", { class: "button-row" }, el("button", { class: "capsule filled t-headline" }, "Play")),
      section(`Recordings · ${recs.length}`, recRows),
      section("Player · " + recs[0].performers.map((p) => p.name).join(", "), playerRows(recs[0], work)),
      section("Works by Frédéric Chopin", workRows),
      el("div", { style: "height: var(--g-sec)" }));
  }

  function tokensOut(v) {
    const f = faceOf(S.face);
    const px = (n) => ({ value: +(n / v.dt).toFixed(2), unit: "px" });
    const out = {
      font: { family: { display: { $value: f.family.split(",").map((s) => s.trim().replace(/'/g, "")) }, text: { $value: (TEXT.find((t) => t.id === S.text) || TEXT[0]).family.split(",").map((s) => s.trim().replace(/'/g, "")) } } },
      ratio: { type: +v.r.toFixed(4), space: +v.rs.toFixed(4) },
      type: Object.fromEntries(STEPS.map(([n, s]) => [n, { fontSize: px(v.sizes[n]), step: s }])),
      display: { page: { fontSize: px(v.page), step: num("pstep") }, fontWeight: +S.weight, letterSpacing: { value: +S.track, unit: "em" }, lineHeight: +S.lh, headings: S.heads, figures: FIGS[S.fig] },
      space: { inGroup: px(v.gin), betweenGroups: px(v.ggr), betweenSections: px(v.gsec) },
      list: S.list,
    };
    return JSON.stringify(out, null, 1);
  }

  function scale(v) {
    const t = el("table", { class: "scale-t t-footnote" },
      el("tr", {}, el("th", {}, "Style"), el("th", {}, "Step"), el("th", {}, "iOS"), el("th", {}, "Klassik"), el("th", {}, "Sample")),
      ...STEPS.map(([n, s, ios]) => el("tr", {}, el("td", {}, n), el("td", {}, String(s)), el("td", {}, String(ios)), el("td", {}, (v.sizes[n] / v.dt).toFixed(1)),
        el("td", { class: "t-" + n }, "Aa"))),
      el("tr", {}, el("td", {}, "display page"), el("td", {}, S.pstep), el("td", {}, "28"), el("td", {}, (v.page / v.dt).toFixed(1)), el("td", { class: "disp page" }, "Aa")));
    const gaps = [["inGroup", v.gin, "gin"], ["betweenGroups", v.ggr, "ggr"], ["betweenSections", v.gsec, "gsec"]];
    const out = el("pre", { class: "out" }, tokensOut(v));
    const copy = el("button", { class: "capsule filled t-headline", onclick: async () => {
      try { await navigator.clipboard.writeText(out.textContent); copy.textContent = "Copied"; } catch { copy.textContent = "Select the text below"; }
      setTimeout(() => (copy.textContent = "Copy tokens"), 1600);
    } }, "Copy tokens");
    return el("div", {},
      el("p", { class: "t-footnote secondary", style: "padding: var(--space-s) var(--pad-right) 0 var(--pad-left)" },
        `Body 17 at the default size. Each step multiplies by ${v.r.toFixed(3)}. Values are fractional; the ratio is the rule. Sizes show at the default text size; the page uses the size in the pill.`),
      t,
      el("div", { style: "padding: var(--g-sec) var(--pad-right) 0 var(--pad-left)" },
        el("div", { class: "t-headline" }, "Spacing"),
        ...gaps.map(([n, val, k]) => el("div", { style: "margin-top: var(--space-m)" },
          el("div", { class: "t-footnote nums" }, `${n} · step ${S[k]} · ${(val / v.dt).toFixed(1)} pt`),
          el("div", { class: "gapbar", style: `width: ${val}px` })))),
      el("div", { class: "button-row", style: "padding-top: var(--g-sec)" }, copy),
      out,
      el("div", { style: "height: var(--g-sec)" }));
  }

  function facePool() {
    const st = stars();
    return st.size ? FACES.filter((f) => st.has(f.id)) : FACES;
  }

  function render() {
    // In context offers only the starred faces; the face moves into that set before the values apply.
    const pool = facePool();
    if (S.view === "ctx" && !pool.some((f) => f.id === S.face)) { S.face = pool[0].id; save(); }
    const v = apply();
    renderSeg();
    body.replaceChildren(S.view === "wall" ? wall() : S.view === "ctx" ? ctx() : scale(v));
    renderTune(v);
  }

  // ---------- Tune panel ----------
  function slider(label, key, min, max, step, fmt = (x) => x) {
    const out = el("output", {}, fmt(S[key]));
    const input = el("input", { type: "range", min, max, step, value: S[key] });
    input.addEventListener("input", () => { S[key] = input.value; out.textContent = fmt(input.value); save(); const v = apply(); if (S.view === "scale") body.replaceChildren(scale(v)); });
    return el("div", { class: "ctl" }, el("span", {}, label), input, out);
  }
  function toggle(key, options) {
    return el("div", { class: "tog" }, ...options.map(([val, label]) => el("button", { class: S[key] === val ? "on" : null, onclick: () => { S[key] = val; save(); render(); } }, label)));
  }
  const PRESETS = [["1.2", "1.2"], ["1.25", "1.25"], ["1.333", "4:3"], [Math.sqrt(PHI).toFixed(3), "√φ"], [PHI.toFixed(3), "φ"]];
  function renderTune(v) {
    const chips = (key) => el("div", { class: "chips" }, ...PRESETS.map(([val, label]) =>
      el("button", { class: Math.abs(num(key) - val) < 0.0005 ? "on" : null, onclick: () => { S[key] = val; save(); render(); } }, label)));
    const spacing = el("div", { class: S.couple === "1" ? "dim" : null }, slider("Space ratio", "sratio", 1.05, 1.7, 0.001, (x) => (+x).toFixed(3)), chips("sratio"));
    const pt = (n) => (n / v.dt).toFixed(1);
    tune.replaceChildren(
      el("div", { class: "hd" }, el("strong", {}, faceOf(S.face).name + " + " + (TEXT.find((t) => t.id === S.text) || TEXT[0]).name),
        el("span", {}, el("button", { class: "tb", onclick: () => { for (const k in DEFAULTS) if (!["stars", "view", "face", "work"].includes(k)) S[k] = DEFAULTS[k]; save(); render(); } }, "Reset"),
          el("button", { class: "tb", onclick: () => tune.classList.remove("on") }, "Done"))),
      el("h3", {}, "Scale"),
      slider("Ratio", "ratio", 1.05, 1.7, 0.001, (x) => (+x).toFixed(3)), chips("ratio"),
      slider("Page title step", "pstep", 1, 4, 0.25, (x) => `${x} · ${pt(17 * Math.pow(num("ratio"), x) * v.dt)}`),
      el("h3", {}, "Display face"),
      slider("Weight", "weight", 300, 700, 10),
      slider("Tracking", "track", -0.04, 0.04, 0.002, (x) => (+x).toFixed(3)),
      slider("Line height", "lh", 0.95, 1.6, 0.01, (x) => (+x).toFixed(2)),
      el("div", { class: "ctl" }, el("span", {}, "Figures"), toggle("fig", [["onum", "Old-style"], ["onum tnum", "Old-style tabular"], ["lnum", "Lining"], ["lnum tnum", "Lining tabular"]])),
      el("div", { class: "ctl" }, el("span", {}, "Headings"), toggle("heads", [["display", "Display face"], ["sf", "Text face"]])),
      el("h3", {}, "Spacing"),
      el("div", { class: "ctl" }, el("span", {}, "Ratio"), toggle("couple", [["1", "Same as type"], ["0", "Own ratio"]])),
      spacing,
      slider("In group", "gin", -6, 0, 0.25, (x) => `${x} · ${pt(17 * v.dt * Math.pow(v.rs, x))}`),
      slider("Between groups", "ggr", -2, 3, 0.25, (x) => `${x} · ${pt(17 * v.dt * Math.pow(v.rs, x))}`),
      slider("Sections", "gsec", 0, 5, 0.25, (x) => `${x} · ${pt(17 * v.dt * Math.pow(v.rs, x))}`),
      el("div", { class: "ctl" }, el("span", {}, "Lists"), toggle("list", [["plain", "Plain"], ["inset", "Inset grouped"]])));
  }

  // The specimen's text size control changes data-type-size on the root; the scale follows it.
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-type-size"] });

  scroll.append(el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "Type sheet"),
    el("div", { class: "meta t-subheadline secondary" }, "Tune opens the sliders. The link keeps every value.")), seg, body);
  render();
});
</script>
</body>
</html>
