<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.10, round 1.
  Question: how do the work page, the recording page and the album page show performers and covers,
  and how does a recording page that does not play differ from the player?
  ?variant=a|b|c (tap and play behaviour)  ?rows=lean|full|card (recording rows)  ?look=wash|stage|edge (page against player)
  Locked from ADR 0014: timeline on the edge, mini player joined to it, player rows that open on tap.
  Recordings, albums and summaries are sample data. Die Schöpfung (Jacobs) tracks come from Flo's library at his request.
  No audio, no cover art.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Work and recording pages</title>
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.1); --fill: rgba(118,118,128,.14); --track: rgba(118,118,128,.32);
  --glass: rgba(250,250,252,.82); --glassLine: rgba(0,0,0,.08); --gap: #dcdce2;
  --barW: 26px; --lineX: 12px; --edgeTop: calc(env(safe-area-inset-top) + 52px);
  --bot: calc(env(safe-area-inset-bottom) + 12px); --tabH: 56px; --miniH: 76px; --navH: 44px;
  --top: calc(env(safe-area-inset-top) + 48px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.14); --fill: rgba(118,118,128,.24); --track: rgba(118,118,128,.5);
  --glass: rgba(40,40,44,.82); --glassLine: rgba(255,255,255,.1); --gap: #2a2a2e;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; text-align: left; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }
.lk { color: var(--tint); }

/* ---------- the stack of pages ---------- */
#nav { position: fixed; inset: 0; overflow: hidden; }
.pg { position: absolute; top: 0; left: 0; bottom: 0; right: var(--barW); background: var(--bg); color: var(--label); transition: transform .35s cubic-bezier(.2,.8,.2,1), background-color .6s, right .35s, border-radius .35s; will-change: transform; }
.pg .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--top) + var(--navH) + 4px) 6px calc(var(--bot) + var(--tabH) + var(--miniH) + 40px) 16px; }
#navbar { position: fixed; top: var(--top); left: 0; right: var(--barW); height: var(--navH); z-index: 8; display: flex; align-items: center; padding: 0 8px; gap: 6px; pointer-events: none; }
#navbar > * { pointer-events: auto; }
#back { color: var(--tint); font-size: 17px; max-width: 42%; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 6px; border-radius: 22px; }
#back b { font-size: 26px; font-weight: 400; line-height: 1; margin-top: -3px; }
#nt { flex: 1; text-align: center; font-weight: 600; font-size: 16px; opacity: 0; transition: opacity .2s; padding-right: 40px; }
#navbar.solid #nt { opacity: 1; }
#navbg { position: fixed; top: 0; left: 0; right: var(--barW); height: calc(var(--top) + var(--navH)); z-index: 7; opacity: 0; transition: opacity .2s; border-width: 0 0 .5px; }
#navbg.solid { opacity: 1; }

h1.pt { font-size: 28px; line-height: 1.15; margin: 4px 0 4px; }
.sub { font-size: 17px; margin-bottom: 10px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 8px 6px 14px; }
.sh button { text-transform: none; font-size: 15px; color: var(--tint); }
.foot { font-size: 13px; color: var(--label2); margin: 8px 14px 0; }
.list { background: var(--card); border-radius: 12px; overflow: hidden; }
.meta { font-size: 13px; color: var(--label2); margin: 6px 0 0; }
.sum { margin: 12px 0 0; font-size: 15px; line-height: 1.4; }
.sum p { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sum.open p { -webkit-line-clamp: unset; }
.sum .more { color: var(--tint); font-size: 15px; }
.sum .cred { font-size: 12px; color: var(--label2); }
.acts { display: flex; gap: 8px; margin: 14px 0 0; }
.btn { height: 40px; padding: 0 16px; border-radius: 20px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.pri { background: var(--tint); color: #fff; min-width: 112px; justify-content: center; }
.stub { font-size: 13px; color: var(--label2); background: var(--fill); border-radius: 10px; padding: 8px 12px; margin: 8px 0 0; }

/* plain link rows (library, composer, performer stubs) */
.pr { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; position: relative; }
.pr + .pr::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.pr .m { flex: 1; min-width: 0; } .pr .s { font-size: 13px; color: var(--label2); } .pr .chev { color: var(--label3); }
.pr:active { background: var(--fill); }

/* ---------- recording rows on the work page ---------- */
.rr { position: relative; overflow: hidden; }
.rr + .rr::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 3; }
.rr .fg { position: relative; z-index: 2; background: var(--card); display: flex; gap: 12px; padding: 12px 8px 12px 14px; touch-action: pan-y; transition: transform .25s; }
.rr .fg.drag { transition: none; }
.rr .fg:active { background: color-mix(in srgb, var(--card), var(--label) 4%); }
.rr .ra { position: absolute; top: 0; bottom: 0; display: flex; z-index: 1; }
.rr .ra.L { left: 0; } .rr .ra.R { right: 0; }
.rr .ra button { white-space: pre-line; width: 84px; color: #fff; font-size: 14px; font-weight: 600; display: grid; place-items: center; text-align: center; padding: 0 6px; line-height: 1.15; }
.rr .ra .q1 { background: #5856d6; } .rr .ra .q2 { background: #ff9500; } .rr .ra .d1 { background: #34a0a4; } .rr .ra .f1 { background: var(--tint); }
.rr .cv { flex: none; border-radius: 6px; overflow: hidden; }
.rr .mn { flex: 1; min-width: 0; }
.rr .l1 { font-size: 16px; font-weight: 600; } .rr .l2 { font-size: 14px; color: var(--label); } .rr .l3 { font-size: 13px; color: var(--label2); margin-top: 2px; }
.rr .why { font-size: 13px; color: var(--tint); margin-top: 3px; }
.rr .side { width: 64px; flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 4px; }
.rr .st { font-size: 12px; color: var(--tint); text-align: right; line-height: 1.25; white-space: pre-line; min-height: 15px; }
.rr .slot { width: 34px; height: 34px; display: grid; place-items: center; color: var(--label3); font-size: 15px; border-radius: 17px; }
.rr .slot.go { background: var(--tintSoft); color: var(--tint); font-size: 13px; }
.rr .slot.hd { font-size: 20px; color: var(--label2); touch-action: none; }
.rr.now .l1 { color: var(--tint); }
.rr.dim { opacity: .45; }
.rr.lifted { z-index: 9; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.rr .rb2 { display: none; background: var(--card); position: relative; z-index: 2; padding: 0 0 8px; }
.rr.open .rb2 { display: block; }
.strip { display: flex; gap: 2px; height: 6px; margin-top: 8px; }
.strip i { display: block; height: 100%; background: var(--track); border-radius: 1px; }
.rr.now .strip i { background: color-mix(in srgb, var(--tint), transparent 45%); }
body.rows-card .rr .fg { flex-wrap: wrap; }

/* ---------- recording and album pages: the player's layout ---------- */
.hero { padding: 0 0 6px; }
.hero .art { width: min(240px, 100%); aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hero h2 { font-size: 22px; margin: 0 0 3px; line-height: 1.15; font-weight: 700; }
.hero h2 button { font-weight: 700; color: var(--label); }
.hero .c { color: var(--tint); font-size: 16px; display: block; margin-bottom: 8px; }
.facts { background: var(--card); border-radius: 12px; margin-top: 4px; }
.fact { display: flex; gap: 10px; padding: 9px 14px; font-size: 15px; position: relative; width: 100%; }
.fact + .fact::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); }
.fact .k { color: var(--label2); width: 92px; flex: none; } .fact .v { flex: 1; min-width: 0; }
button.fact .v { color: var(--tint); }
.grp { margin: 22px 0 6px 14px; } .grp .gt { font-size: 16px; font-weight: 600; color: var(--label); } .grp .gs { font-size: 13px; color: var(--label2); }
.list.rows { margin-top: 14px; }
.grp + .list.rows { margin-top: 0; }
.row { position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: .5px solid var(--sep); z-index: 1; }
.rh { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 8px 11px 14px; min-height: 48px; }
.rh:active { background: var(--fill); }
.rh .main { flex: 1; min-width: 0; } .rh .t { font-size: 16px; }
.rh .t .d { font-size: 14px; color: var(--label2); white-space: nowrap; margin-left: 6px; }
.row.cur .rh .t { color: var(--tint); font-weight: 600; }
.rh .slot { width: 34px; height: 34px; flex: none; display: grid; place-items: center; color: var(--label3); font-size: 15px; }
.rh .slot.go { border-radius: 17px; background: var(--tintSoft); color: var(--tint); font-size: 13px; }
.rb { display: none; padding: 0 0 10px; }
.row.open .rb { display: block; }
.rb .fact { font-size: 14px; padding: 7px 14px; }
.seek { position: relative; height: 22px; touch-action: none; margin: 4px 14px 0; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: var(--track); } .seek .tr i { display: block; height: 100%; background: var(--tint); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--label2); margin: -2px 14px 0; }
.ctl { display: flex; align-items: center; justify-content: space-between; margin: 6px 18px 0; }
.ctl button { width: 48px; height: 44px; display: grid; place-items: center; font-size: 18px; }
.ctl button.pp { width: 56px; height: 56px; font-size: 24px; }

/* ---------- three looks: how a page differs from the player ---------- */
/* Wash: the player takes a tint from its cover; a page keeps the system background. */
body.look-wash .player-look, body.look-wash #player { background: hsl(var(--h), 42%, 89%); }
@media (prefers-color-scheme: dark) { body.look-wash .player-look, body.look-wash #player { background: hsl(var(--h), 32%, 13%); } }
body.look-wash .player-look .list, body.look-wash .player-look .facts { background: color-mix(in srgb, var(--card), hsl(var(--h), 50%, 60%) 8%); }
/* Stage: the player is dark, like a lit stage; a page stays light. */
body.look-stage .player-look { --bg: #121214; --card: #232326; --label: #fff; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.28); --track: rgba(118,118,128,.55); --tint: #ff8a6e; --tintSoft: rgba(255,138,110,.16); }
@media (prefers-color-scheme: dark) { body.look-stage .pg:not(.player-look) { --bg: #2c2c2e; --card: #3a3a3c; } body.look-stage .player-look { --bg: #000; --card: #161618; } }
/* Edge: what plays sits flush against the timeline; a page stands apart from it as a card. */
body.look-edge #nav { background: var(--gap); }
body.look-edge .pg:not(.player-look) { right: calc(var(--barW) + 8px); border-radius: 0 18px 18px 0; box-shadow: 4px 0 14px rgba(0,0,0,.08); }
body.look-edge .player-look { right: var(--lineX); border-radius: 0; box-shadow: inset -3px 0 0 var(--tint); }
body.look-edge #player { right: var(--lineX); box-shadow: inset -3px 0 0 var(--tint); }

/* ---------- tabs, mini player, timeline, player (locked, ADR 0014) ---------- */
#tabs { position: fixed; left: 16px; right: calc(var(--barW) + 6px); bottom: var(--bot); height: var(--tabH); display: flex; gap: 8px; z-index: 5; transition: opacity .3s; }
#tabs .cap { flex: 1; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 1px; } #tabs .cap b { font-size: 20px; font-weight: 400; }
#tabs .cap .on { color: var(--tint); }
#tabs .circ { width: var(--tabH); border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); flex: none; }
#mini { position: fixed; left: 16px; right: var(--lineX); bottom: calc(var(--bot) + var(--tabH) + 8px); height: var(--miniH); z-index: 6;
  background: var(--card); border-radius: 18px 0 0 18px; box-shadow: 0 4px 18px rgba(0,0,0,.14); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; transition: opacity .3s; }
#mini .art { width: 58px; height: 58px; border-radius: 8px; overflow: hidden; flex: none; }
#mini .txt { flex: 1; min-width: 0; line-height: 1.22; }
#mini .mv { font-size: 15px; font-weight: 600; } #mini .by, #mini .wk { font-size: 13px; color: var(--label2); }
#mini .pp { width: 42px; height: 42px; border-radius: 21px; display: grid; place-items: center; font-size: 18px; flex: none; }
.mq { overflow: hidden; white-space: nowrap; } .mq span { display: inline-block; padding-right: 32px; }
.mq.run span { animation: mq var(--dur) linear infinite; }
@keyframes mq { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift)); } }
body.player #mini, body.player #tabs, body.player #navbar, body.player #navbg { opacity: 0; pointer-events: none; }
#bar { position: fixed; right: 0; width: var(--barW); top: var(--edgeTop); bottom: calc(var(--bot) + var(--tabH) + 8px); z-index: 20; touch-action: none; }
#bar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#bubble { position: fixed; right: calc(var(--barW) + 6px); z-index: 25; pointer-events: none; display: none; max-width: 250px; padding: 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.25; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
#bubble b { color: var(--tint); font-weight: 600; }
#player { position: fixed; top: 0; left: 0; bottom: 0; right: var(--barW); z-index: 10; transform: translateX(-102%); transition: transform .4s cubic-bezier(.2,.8,.2,1); box-shadow: 6px 0 24px rgba(0,0,0,.12); background: var(--bg); color: var(--label); }
body.player #player { transform: none; }
#player .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top) + 100px) 6px calc(var(--bot) + 60px) 16px; }
#pin { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 46px); height: 52px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
#pin .close { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); display: grid; place-items: center; flex: none; font-size: 18px; }

/* prototype switches */
#sw { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 6px; right: 6px; z-index: 30; display: flex; gap: 5px; justify-content: center; }
#sw .p { display: flex; align-items: center; background: #111; color: #fff; border-radius: 18px; height: 34px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
#sw .p button, #sw .p a { color: #fff; height: 34px; padding: 0 9px; font-size: 13px; white-space: nowrap; display: flex; align-items: center; text-decoration: none; }
#sw .p button.arr { font-size: 18px; padding: 0 8px; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 46px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }
</style>
</head>

<script>

// ----- recording and album pages: the player's layout -----

// ---------- taps ----------
let suppressUntil = 0;
document.addEventListener("click", e => {
  if (e.target.closest("#sw")) return;
  if (Date.now() < suppressUntil) { e.preventDefault(); e.stopPropagation(); return; }
  if (openSwipe && !e.target.closest(".ra")) { closeSwipe(); e.preventDefault(); e.stopPropagation(); return; }
  const sw = e.target.closest("[data-sw]"); if (sw) { e.stopPropagation(); swipeAct(sw.closest(".rr").dataset.rec, sw.dataset.sw); return; }
  const ln = e.target.closest("[data-link]");
  if (ln) { e.stopPropagation(); if (e.target.closest("#player")) document.body.classList.remove("player"); go(ln.dataset.link); return; }
  const a = e.target.closest("[data-a]"); if (a) { e.stopPropagation(); act(a.dataset.a, a.dataset); return; }

    if (S.variant === "c") { pg.openRec.has(id) ? pg.openRec.delete(id) : pg.openRec.add(id); paintList(w); }
    else { go("rec:" + id); toast(S.variant === "a" ? "Recording page. Play turns it into the player." : "Recording page. Play makes it play as a page."); }
    return; }

  if (rh) { const i = +rh.dataset.row, key = rh.dataset.k; if (P.key === key && cur().i === i) return;
    const pg = pageOf(key); pg.open.has(i) ? pg.open.delete(i) : pg.open.add(i); const box = rh.closest("[data-rows]"); box.innerHTML = rowsHTML(key, box.closest("#player") ? "player" : modeOf(key)); tick(true); }
}, true);

  if (a === "pp") { S.playing = !S.playing; miniKey = ""; renderMini(); document.querySelectorAll('.btn[data-a="pp"]').forEach(b => b.textContent = S.playing ? "❚❚ Pause" : "▶ Resume"); tick(true); return; }
  if (a === "playkey") { startPlay(d.k, 0); toast(S.variant === "b" ? "Plays. The page stays a page." : "Plays. The page is now the player."); return; }
  if (a === "playfrom") { pageOf(d.k).open.delete(+d.i); startPlay(d.k, +d.i); return; }
  if (a === "playwork") { const id = pageOf("work:" + d.w).order[0].id; startPlay("rec:" + id, 0); toast("Plays the first recording: " + RECS[id].cond); return; }

};
document.addEventListener("pointerup", endPointer); document.addEventListener("pointercancel", endPointer);
document.addEventListener("touchmove", e => { if (dragRow || (G2 && G2.mode === "swipe")) e.preventDefault(); }, { passive: false });

// ---------- per frame ----------
let t0 = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - t0) / 1000); t0 = now;
  if (S.playing) { T += dt; if (T >= P.total) { T = 0; S.playing = false; } }
  for (const id in S.dl) if (S.dl[id] < 1) S.dl[id] = Math.min(1, S.dl[id] + dt / 12);
  if (now - slow > 250) { slow = now; tick(); document.querySelectorAll(".st[data-st]").forEach(s => { const t = stateText(s.dataset.st); if (s.textContent !== t) s.textContent = t; }); }
  requestAnimationFrame(frame);
}

// ---------- switches ----------
function setQ() { history.replaceState(null, "", "?" + new URLSearchParams({ variant: S.variant, rows: S.rows, look: S.look })); }
function bodyClasses() { document.body.className = document.body.className.replace(/\b(rows|look)-\w+/g, "").trim(); document.body.classList.add("rows-" + S.rows, "look-" + S.look); }
function label() { $("#vl").textContent = VARIANTS.find(v => v[0] === S.variant)[1]; $("#rw").textContent = "Rows " + ROWS.find(v => v[0] === S.rows)[1]; $("#lk").textContent = "Look " + LOOKS.find(v => v[0] === S.look)[1]; }
function step(list, k, dir) { const i = list.findIndex(v => v[0] === S[k]); S[k] = list[(i + dir + list.length) % list.length][0]; setQ(); bodyClasses(); label(); stack.forEach(e => { Object.values(S.pages).forEach(p => p.openRec.clear()); paint(e); }); if (document.body.classList.contains("player")) paintPlayer(); tick(true); }
$("#vp").onclick = () => { step(VARIANTS, "variant", -1); toast(VARIANTS.find(v => v[0] === S.variant)[2]); };
$("#vn").onclick = $("#vl").onclick = () => { step(VARIANTS, "variant", 1); toast(VARIANTS.find(v => v[0] === S.variant)[2]); };
$("#rw").onclick = () => step(ROWS, "rows", 1);
$("#lk").onclick = () => { step(LOOKS, "look", 1); toast(LOOKS.find(v => v[0] === S.look)[2]); };
let tt = 0;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }
addEventListener("resize", () => { drawBar(); tick(true); });

// Start: Die Schöpfung plays; the listener browses to Beethoven's Fifth.
setPlaying("rec:ja09", 13); T += 20;
bodyClasses(); label();
for (const k of ["lib", "comp:lvb", "work:b5"]) { const e = { key: k, el: makePage(k) }; paint(e); stack.push(e); }
layout(); renderMini(); drawBar(); repaintLive(); requestAnimationFrame(frame);
</script>
</body>
