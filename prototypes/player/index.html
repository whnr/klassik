<!doctype html>
<!--
  PROTOTYPE, throw away. Map ticket sz-rs30.1.74.7: how does the vertical player look and behave?
  Player variants: ?variant=accordion|bridges|scroll|score. Mini player forms: ?mini=who|context|twoline|ticks.
  Timeline on the edge of the places: ?edge=on. Notes drawer: ?drawer=list|widen. Timeline side: ?side=right|left.
  Work: ?work=creation|b5. Speed: ?speed=1|10|60. The pill at the top opens all switches.
  Tags and a 2-second loudness envelope come from two recordings in Flo's library. No audio, no cover art.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vertical player prototype</title>
<style>
:root {
  --bg: #f2f2f7; --card: #fff; --label: #000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.18); --tint: #b5482f; --tintSoft: rgba(181,72,47,.14); --fill: rgba(118,118,128,.14); --fill2: rgba(118,118,128,.28);
  --glass: rgba(250,250,252,.8); --glassLine: rgba(0,0,0,.08); --onTint: #fff; --sheet: #fff;
  --tlw: 44px; --gap: 8px; --top: calc(env(safe-area-inset-top) + 40px); --pinH: 52px; --barH: 60px;
  --bot: calc(env(safe-area-inset-bottom) + 10px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000; --card: #1c1c1e; --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.6); --tint: #ff7a5c; --tintSoft: rgba(255,122,92,.2); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.42);
  --glass: rgba(40,40,44,.8); --glassLine: rgba(255,255,255,.1); --onTint: #000; --sheet: #111113;
} }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); font: 17px/1.3 -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8); border: .5px solid var(--glassLine); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- place (Library) ---------- */
#place { position: fixed; inset: 0; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 44px) 0 200px; }
#place h1 { font-size: 34px; margin: 6px 16px 10px; }
.navbar { height: 44px; display: flex; align-items: center; padding: 0 8px; color: var(--tint); }
.navbar button::before { content: "‹ "; font-size: 26px; vertical-align: -2px; }
.section-h { font-size: 13px; text-transform: uppercase; color: var(--label2); margin: 22px 32px 6px; }
.list { background: var(--card); border-radius: 12px; margin: 0 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 44px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.row:active { background: var(--fill); }
.row .main { flex: 1; min-width: 0; } .row .s { font-size: 14px; color: var(--label2); }
.chev::after { content: "›"; color: var(--label3); font-size: 22px; }
.eq { color: var(--tint); font-size: 13px; }
#tabs { position: fixed; left: 12px; right: 12px; bottom: var(--bot); display: flex; gap: 8px; z-index: 5; }
#tabs .cap { flex: 1; height: 56px; border-radius: 28px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: var(--label2); }
#tabs .cap span { display: flex; flex-direction: column; align-items: center; gap: 2px; } #tabs .cap span b { font-size: 20px; font-weight: 400; }
#tabs .cap span.on { color: var(--tint); }
#tabs .circ { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; font-size: 22px; color: var(--label2); }
#acc { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bot) + 64px); height: 52px; border-radius: 26px; z-index: 6; }
#edge { position: fixed; top: calc(env(safe-area-inset-top) + 52px); bottom: calc(var(--bot) + 64px + 26px); width: 22px; z-index: 6; display: none; }
body.edge-on #edge { display: block; }
body.edge-on.side-right #place { padding-right: 12px; } body.edge-on.side-left #place { padding-left: 12px; }
body.side-right #edge { right: 0; } body.side-left #edge { left: 0; }
#edge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
body.edge-on.side-right #acc { right: 26px; } body.edge-on.side-left #acc { left: 26px; }

/* ---------- mini player forms (shared by the accessory and the player bar) ---------- */
.mini { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 6px 0 7px; position: relative; overflow: hidden; border-radius: inherit; }
.mini .art { width: 38px; height: 38px; border-radius: 9px; flex: none; overflow: hidden; }
.mini .txt { flex: 1; min-width: 0; line-height: 1.2; }
.mini .l1 { font-size: 15px; font-weight: 500; } .mini .l2 { font-size: 13px; color: var(--label2); }
.mini .pp { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; font-size: 18px; flex: none; }
.mini .prog { position: absolute; left: 22px; right: 22px; bottom: 3px; height: 2px; border-radius: 1px; background: var(--fill); overflow: hidden; }
.mini .prog i { display: block; height: 100%; background: var(--tint); }
.mini .ticks { flex: 1; height: 22px; position: relative; }
.mini .ticks svg { width: 100%; height: 100%; display: block; }
.mini .cnt { font-size: 13px; color: var(--label2); flex: none; }
.mini .arrow { font-size: 15px; color: var(--tint); flex: none; width: 18px; text-align: center; }

/* ---------- player sheet ---------- */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; opacity: 0; pointer-events: none; transition: opacity .3s; }
body.player #scrim { opacity: 1; pointer-events: auto; }
#sheet { position: fixed; left: 0; right: 0; top: var(--top); bottom: 0; background: var(--sheet); border-radius: 14px 14px 0 0; z-index: 10; transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
body.player #sheet { transform: none; }
#sheet.dragging { transition: none; }
#content { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--pinH) 0 calc(var(--barH) + var(--bot) + 40px); }
body.side-right #content { padding-right: calc(var(--tlw) + var(--gap)); padding-left: 16px; }
body.side-left #content { padding-left: calc(var(--tlw) + var(--gap)); padding-right: 16px; }
body.v-bridges { --gap: 40px; }
body.v-scroll #content { padding-right: 16px; padding-left: 16px; }
#pin { position: absolute; left: 0; right: 0; top: 0; height: var(--pinH); z-index: 4; display: flex; align-items: center; gap: 8px; padding: 0 10px; touch-action: none; }
#pin .bg { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; border-radius: 0; border-width: 0 0 .5px; box-shadow: none; }
#pin.solid .bg { opacity: 1; }
#pin .grab { position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); }
#pin .rb { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; font-size: 17px; position: relative; flex: none; background: var(--fill); }
#pin .rb small { position: absolute; top: -2px; right: -4px; font-size: 10px; background: var(--tint); color: var(--onTint); border-radius: 8px; padding: 1px 5px; }
#pin .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .2s; position: relative; }
#pin.solid .ttl { opacity: 1; }
#pin .ttl .art { width: 30px; height: 30px; border-radius: 6px; overflow: hidden; flex: none; }
#pin .ttl .a { font-size: 15px; font-weight: 600; } #pin .ttl .b { font-size: 12px; color: var(--label2); }

.hero { padding: 6px 0 18px; }
.hero .art { width: min(240px, 100%); aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin: 0 auto 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hero h2 { font-size: 24px; margin: 0 0 4px; line-height: 1.15; }
.hero .comp { font-size: 17px; color: var(--tint); margin-bottom: 10px; }
.hero .rec { font-size: 14px; color: var(--label2); line-height: 1.45; }
.hero .rec b { color: var(--label); font-weight: 500; }

/* blocks */
.blk { position: relative; border-radius: 12px; background: var(--card); margin-bottom: 6px; overflow: hidden; }
@media (prefers-color-scheme: light) { .blk { box-shadow: 0 0 0 .5px var(--sep); } }
.blk .bh { display: flex; gap: 10px; align-items: baseline; padding: 11px 12px; width: 100%; text-align: left; }
.blk .num { font-size: 13px; color: var(--label2); min-width: 18px; font-variant-numeric: tabular-nums; }
.blk .tt { flex: 1; min-width: 0; font-size: 16px; }
.blk .dur { font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums; }
.blk .bd { padding: 0 12px 12px 40px; font-size: 14px; color: var(--label2); }
.blk.cur { box-shadow: inset 3px 0 0 var(--tint); }
body.side-left .blk.cur { box-shadow: inset -3px 0 0 var(--tint); }
.blk.cur .num, .blk.cur .tt { color: var(--tint); }
.blk .state { font-size: 12px; font-weight: 600; color: var(--tint); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
.ppl { margin: 2px 0; } .ppl .role { color: var(--label2); } .ppl .nm { color: var(--label); }
.ppl.in .nm::after { content: " enters"; font-size: 11px; color: var(--tint); font-weight: 600; text-transform: uppercase; margin-left: 4px; }
.ppl.out { color: var(--label3); text-decoration: line-through; } .ppl.out .nm { color: var(--label3); }
.nt { display: flex; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 9px; background: var(--fill); color: var(--label); width: 100%; text-align: left; font-size: 14px; }
.nt .at { color: var(--tint); font-variant-numeric: tabular-nums; flex: none; }
.det { margin-top: 8px; font-size: 12px; color: var(--label3); }
/* accordion */
body.v-accordion .blk:not(.open) .bd { display: none; }
body.v-accordion .blk:not(.open) .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.v-accordion .blk:not(.open) { margin-bottom: 2px; border-radius: 9px; }
body.v-accordion .blk:not(.open) .bh { padding-top: 9px; padding-bottom: 9px; }
body.v-accordion .blk:not(.open) .tt { font-size: 15px; }
/* score */
body.v-score .blk, body.v-scroll .blk { overflow: visible; }
body.v-score .blk { background: none; box-shadow: none; border-radius: 0; margin: 0; border-top: .5px solid var(--sep); padding-left: 68px; }
body.v-score .blk .bh { padding: 10px 0 2px; display: block; }
body.v-score .blk .num { display: block; font: 300 13px/1 ui-serif, Georgia, serif; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
body.v-score .blk .tt { display: block; font: italic 400 22px/1.15 ui-serif, Georgia, serif; }
body.v-score .blk .dur { display: none; }
body.v-score .blk .bd { padding: 6px 0 0; }
body.v-score .blk.cur { box-shadow: none; }
body.v-score .mnote { position: absolute; left: 0; width: 62px; font: italic 11px/1.2 ui-serif, Georgia, serif; color: var(--label2); border-top: 1px solid var(--tint); padding-top: 3px; text-align: left; }
body.v-score .mline { position: absolute; left: 68px; right: 0; border-top: .5px dashed var(--sep); pointer-events: none; }
.phl { position: absolute; left: 0; right: -6px; height: 0; border-top: 1.5px solid var(--tint); pointer-events: none; display: none; z-index: 2; }
.phl span { position: absolute; right: 6px; top: -17px; font-size: 11px; color: var(--tint); font-variant-numeric: tabular-nums; background: var(--sheet); padding: 0 3px; }
body.v-score .blk.cur .phl { display: block; }
/* scroll: blocks share the content column with the timeline */
body.v-scroll .blk { margin: 0 calc(var(--tlw) + 8px) 0 0; border-radius: 0; background: none; box-shadow: none; border-top: .5px solid var(--sep); }
body.side-left.v-scroll .blk { margin: 0 0 0 calc(var(--tlw) + 8px); }
body.v-scroll .blk .bh { position: sticky; top: var(--pinH); background: var(--sheet); z-index: 1; }
body.v-scroll .blk.cur { box-shadow: none; }
#blocks { position: relative; }

.next { margin-top: 18px; border-radius: 12px; border: 1.5px dashed var(--label3); padding: 12px; }
.next .h { font-size: 12px; text-transform: uppercase; color: var(--label2); margin-bottom: 8px; letter-spacing: .03em; }
.next .r { display: flex; gap: 12px; align-items: center; }
.next .art { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex: none; }
.next .a { font-size: 15px; font-weight: 500; } .next .b { font-size: 13px; color: var(--label2); }
.next .mv { margin-top: 10px; font-size: 13px; color: var(--label2); display: none; }
.next.open .mv { display: block; } .next .mv div { padding: 4px 0; border-top: .5px solid var(--sep); }
.next .btns { display: flex; gap: 8px; margin-top: 10px; }
.pill { font-size: 14px; padding: 7px 14px; border-radius: 16px; background: var(--tintSoft); color: var(--tint); font-weight: 500; }

/* timeline */
#tl { position: absolute; top: calc(var(--pinH) + 6px); bottom: calc(var(--barH) + var(--bot) + 10px); width: var(--tlw); z-index: 3; touch-action: none; }
body.side-right #tl { right: 0; } body.side-left #tl { left: 0; }
body.v-scroll #tl { display: none; }
#tl svg, #stl svg { position: absolute; left: 0; top: 0; width: 100%; overflow: visible; }
#stl { position: absolute; top: 0; width: var(--tlw); touch-action: none; }
body.side-right #stl { right: 0; } body.side-left #stl { left: 0; }
.marker { position: absolute; left: 0; width: var(--tlw); height: 44px; margin-top: -22px; touch-action: none; z-index: 2; }
.marker::before { content: ""; position: absolute; left: 4px; right: 4px; top: 21px; height: 2px; background: var(--tint); border-radius: 1px; }
.marker::after { content: ""; position: absolute; left: 50%; top: 22px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 8px; background: var(--tint); box-shadow: 0 1px 4px rgba(0,0,0,.3), 0 0 0 3px var(--sheet); }
.marker.drag::after { transform: scale(1.35); }
#bubble { position: absolute; z-index: 8; pointer-events: none; display: none; max-width: 240px; padding: 7px 10px; border-radius: 10px; font-size: 13px; line-height: 1.25; }
#bubble b { color: var(--tint); font-variant-numeric: tabular-nums; }
#bridges { position: absolute; inset: 0; pointer-events: none; z-index: 2; width: 100%; height: 100%; }

/* bar: transport and mini player */
#bar { position: absolute; left: 12px; right: 12px; bottom: var(--bot); height: var(--barH); border-radius: 30px; z-index: 6; overflow: hidden; }
#bar .ctl, #bar .mini { position: absolute; inset: 0; transition: opacity .2s, transform .25s; }
#bar .ctl { display: flex; align-items: center; justify-content: space-around; padding: 0 8px; }
#bar .ctl button { width: 44px; height: 44px; border-radius: 22px; font-size: 17px; display: grid; place-items: center; }
#bar .ctl button.big { font-size: 24px; width: 52px; height: 52px; background: var(--tint); color: var(--onTint); }
#bar .ctl .tm { font-size: 12px; color: var(--label2); text-align: center; line-height: 1.25; min-width: 64px; }
#bar .ctl .prog, #bar .mini .prog { position: absolute; left: 26px; right: 26px; bottom: 3px; height: 2px; border-radius: 1px; background: var(--fill); overflow: hidden; }
#bar .ctl .prog i { display: block; height: 100%; background: var(--tint); }
#bar.away .ctl { opacity: 0; transform: translateY(12px); pointer-events: none; }
#bar:not(.away) .mini { opacity: 0; transform: translateY(-12px); pointer-events: none; }

/* notes drawer */
#drawer { position: absolute; top: var(--pinH); bottom: calc(var(--barH) + var(--bot) + 6px); width: calc(100% - var(--tlw) - 14px); z-index: 5; background: var(--card); box-shadow: 0 10px 40px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 14px 0; }
body.side-right #drawer { left: 0; border-radius: 0 16px 16px 0; transform: translateX(-105%); }
body.side-left #drawer { right: 0; border-radius: 16px 0 0 16px; transform: translateX(105%); }
body.drawer-open #drawer { transform: none; }
#drawer h3 { margin: 0 16px 2px; font-size: 20px; } #drawer .sub { margin: 0 16px 12px; font-size: 13px; color: var(--label2); }
#drawer .row .at { color: var(--tint); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 64px; }
#dscrim { position: absolute; inset: 0; z-index: 4; display: none; }
body.drawer-open #dscrim, body.widen-open #dscrim { display: block; }
#widen { position: absolute; top: var(--pinH); bottom: calc(var(--barH) + var(--bot) + 6px); width: calc(100% - 12px); z-index: 5; background: var(--card); box-shadow: 0 10px 40px rgba(0,0,0,.3); transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; opacity: 0; pointer-events: none; overflow: hidden; }
body.side-right #widen { right: 0; border-radius: 16px 0 0 16px; transform: scaleX(.12); transform-origin: right; }
body.side-left #widen { left: 0; border-radius: 0 16px 16px 0; transform: scaleX(.12); transform-origin: left; }
body.widen-open #widen { transform: none; opacity: 1; pointer-events: auto; }
#widen .wtl { position: absolute; top: 40px; bottom: 12px; width: 56px; }
body.side-right #widen .wtl { right: 6px; } body.side-left #widen .wtl { left: 6px; }
#widen .wtl svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#widen .wh { position: absolute; top: 10px; left: 14px; right: 14px; font-size: 13px; color: var(--label2); display: flex; justify-content: space-between; }
#widen .wn { position: absolute; font-size: 13px; line-height: 1.25; padding: 6px 9px; border-radius: 9px; background: var(--fill); text-align: left; }
#widen .wn b { color: var(--tint); font-weight: 500; font-variant-numeric: tabular-nums; }
#widen .lead { position: absolute; height: 0; border-top: 1px solid var(--tint); opacity: .6; }

/* lab: the prototype's own switches */
#switch { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%); z-index: 30; background: #111; color: #fff; border-radius: 16px; font-size: 13px; padding: 6px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: nowrap; }
#lab { position: fixed; top: calc(env(safe-area-inset-top) + 42px); left: 10px; right: 10px; z-index: 31; border-radius: 18px; padding: 10px 12px 12px; display: none; max-height: 75vh; overflow-y: auto; background: var(--card); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
#lab.open { display: block; }
#lab .lr { margin: 8px 0; } #lab .lr > div:first-child { font-size: 12px; color: var(--label2); margin: 0 0 4px 4px; text-transform: uppercase; }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { flex: 1; padding: 6px 4px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--sheet); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
#lab .foot { display: flex; justify-content: space-between; font-size: 14px; margin-top: 10px; color: var(--label2); }
#lab .foot a { color: var(--tint); text-decoration: none; }
#toast { position: fixed; top: calc(env(safe-area-inset-top) + 44px); left: 50%; transform: translateX(-50%); z-index: 29; background: rgba(17,17,17,.88); color: #fff; font-size: 13px; padding: 7px 12px; border-radius: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="place"></div>
<div id="tabs"><div class="cap glass"><span class="on"><b>♪</b>Library</span><span><b>◷</b>Chronology</span><span><b>⚙︎</b>Settings</span></div><div class="circ glass">⌕</div></div>
<div id="acc" class="glass"></div>
<div id="edge"></div>
<div id="scrim"></div>
<div id="sheet">
  <div id="content"></div>
  <svg id="bridges"></svg>
  <div id="tl"></div>
  <div id="pin"><div class="bg glass"></div><div class="grab"></div>
    <button class="rb" id="close" aria-label="Close player">⌄</button>
    <div class="ttl"></div>
    <button class="rb" id="notesBtn" aria-label="Listening notes">✎<small></small></button>
  </div>
  <div id="dscrim"></div>
  <div id="drawer"></div>
  <div id="widen"></div>
  <div id="bar" class="glass"><div class="ctl"></div><div class="mini"></div></div>
  <div id="bubble" class="glass"></div>
</div>
<button id="switch"></button>
<div id="lab"></div>

    <div class="list">${ns.map(n => `<button class="row" data-seek="${n.at}"><span class="at">${n.i + 1} · ${fmt(n.t)}</span><span class="main"><div>${esc(n.x)}</div><div class="s ell">${esc(W.mv[n.i].t)}</div></span></button>`).join("")}</div>`;
  $("#addNote").onclick = () => { S.notes[W.key].push({ i: m.i, t: Math.floor(T - m.start), x: "New note" }); renderDrawer(); renderPlayer(); toast("Note added at " + fmt(T - m.start)); };
}
function renderWiden() {
  const el = $("#widen"); el.innerHTML = `<div class="wh"><span>Listening notes · whole work</span><button id="wclose" style="color:var(--tint)">Done</button></div><div class="wtl"></div>`;
  const wtl = el.querySelector(".wtl"), H = wtl.clientHeight, g = geom(fitSegs(H));
  const sv = timelineSvg(g, 56, H); wtl.innerHTML = sv; wtl.querySelector(".playedClip").setAttribute("height", g.y(T));
  const right = S.side === "right"; let lastY = -99; const top0 = wtl.offsetTop;
  for (const n of notes()) {
    const y = g.y(n.at) + top0, ny = Math.max(y - 14, lastY + 4);
    const b = document.createElement("button"); b.className = "wn"; b.dataset.seek = n.at;
    b.style.top = ny + "px"; b.style[right ? "right" : "left"] = "84px"; b.style[right ? "left" : "right"] = "12px";
    b.innerHTML = `<b>${n.i + 1} · ${fmt(n.t)}</b> ${esc(n.x)}`; el.appendChild(b);
    const ld = document.createElement("div"); ld.className = "lead"; ld.style.top = y + "px"; ld.style[right ? "right" : "left"] = "62px"; ld.style.width = "22px"; el.appendChild(ld);
    lastY = ny + b.offsetHeight;
  }
  $("#wclose").onclick = closeNotes;
}
function openNotes() {
  if (S.drawer === "list") { renderDrawer(); document.body.classList.add("drawer-open"); }
  else { document.body.classList.add("widen-open"); renderWiden(); }
}
function closeNotes() { document.body.classList.remove("drawer-open", "widen-open"); }
$("#notesBtn").onclick = openNotes;
$("#dscrim").onclick = closeNotes;

// ---------- gestures in the content ----------
const content = $("#content");
let sx = 0, sy = 0;
content.addEventListener("touchstart", e => { touching = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
content.addEventListener("touchend", e => {
  touching = false; holdUntil = Date.now() + 1500;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    const towardTimeline = S.side === "right" ? dx < 0 : dx > 0;
    if (S.drawer === "list" && !towardTimeline) { openNotes(); toast("Swipe: notes drawer"); }
    else if (S.drawer === "widen" && towardTimeline) { openNotes(); toast("Swipe: the timeline widens"); }
  }
}, { passive: true });
["#drawer", "#widen"].forEach(sel => {
  const el = $(sel); let x0 = 0;
  el.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  el.addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) closeNotes(); }, { passive: true });
});
content.addEventListener("wheel", () => holdUntil = Date.now() + 1500, { passive: true });
content.addEventListener("scroll", () => {
  if (Date.now() > progUntil) holdUntil = Math.max(holdUntil, Date.now() + 1200);
  drawBridges();
  const h2 = content.querySelector(".hero h2"); $("#pin").classList.toggle("solid", !!h2 && h2.getBoundingClientRect().bottom < content.getBoundingClientRect().top + 52);
}, { passive: true });

// taps
document.addEventListener("click", e => {
  const a = e.target.closest("[data-a]");
  if (a) { act(a.dataset.a); e.stopPropagation(); return; }
  const sk = e.target.closest("[data-seek]");
  if (sk) { T = +sk.dataset.seek; S.playing = true; closeNotes(); holdUntil = 0; update(true); scrollToNow(true); toast("Plays from the note"); return; }
  const bh = e.target.closest(".blk .bh");
  if (bh && S.variant === "accordion") { const i = +bh.parentNode.dataset.i, b = bh.parentNode; const open = !b.classList.contains("open"); S.manual.set(i, open); b.classList.toggle("open", open); toast(open ? "Opened. The timeline plays it." : "Closed"); requestAnimationFrame(() => { update(); drawBridges(); }); return; }
  if (bh) { toast("Tap the timeline to play this movement"); return; }
  if (e.target.id === "nextOpen") { $("#next").classList.toggle("open"); return; }
  if (e.target.id === "nextPlay") { loadWork(W.next, 0); renderAll(); toast("Plays the next work"); return; }
}, true);
function act(a) {
  const m = curM();
  if (a === "pp") { S.playing = !S.playing; toast(S.playing ? "Play" : "Pause"); }
  if (a === "back") T = Math.max(0, T - 15);
  if (a === "fwd") T = Math.min(W.total - 1, T + 15);
  if (a === "prev") T = T - m.start > 3 || !m.i ? m.start : W.mv[m.i - 1].start;
  if (a === "next") T = m.i < W.mv.length - 1 ? W.mv[m.i + 1].start : T;
  update(true);
}

// ---------- sheet open and close ----------
function openPlayer() { S.screen = "player"; document.body.classList.add("player"); requestAnimationFrame(() => { layout(); scrollToNow(false); }); }
function closePlayer() { S.screen = "place"; document.body.classList.remove("player"); closeNotes(); renderPlace(); }
$("#close").onclick = closePlayer;
$("#scrim").onclick = closePlayer;
(() => { // drag down on the title bar closes the sheet; the timeline marker never does
  const pin = $("#pin"), sh = $("#sheet"); let y0 = null, dy = 0;
  pin.onpointerdown = e => { if (e.target.closest("button")) return; y0 = e.clientY; dy = 0; sh.classList.add("dragging"); pin.setPointerCapture(e.pointerId); };
  pin.onpointermove = e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  pin.onpointerup = pin.onpointercancel = () => { if (y0 == null) return; y0 = null; sh.classList.remove("dragging"); sh.style.transform = ""; if (dy > 110) closePlayer(); };
})();

// ---------- place: a small Library ----------
function renderPlace() {
  const p = $("#place");
  if (S.page === "library") {
    const comps = [...new Set(Object.values(DATA).map(w => w.composer))];
    p.innerHTML = `<h1>Library</h1><div class="section-h">Composers</div><div class="list">${comps.map(c => `<button class="row" data-page="composer:${esc(c)}"><span class="main">${esc(c)}</span>${c === W.composer ? `<span class="eq">♫</span>` : ""}<span class="chev"></span></button>`).join("")}</div>
      <div class="section-h">Favourites</div><div class="list"><div class="row"><span class="main">Works</span><span class="chev"></span></div><div class="row"><span class="main">Recordings</span><span class="chev"></span></div></div>
      <p style="margin:24px 32px;color:var(--label2);font-size:14px">The mini player sits above the tabs. Turn on the edge timeline in the pill at the top. Open a composer: the Context form changes there.</p>`;
  } else {
    const c = S.page.slice(9), works = Object.values(DATA).filter(w => w.composer === c);
    p.innerHTML = `<div class="navbar"><button data-page="library">Library</button></div><h1>${esc(c)}</h1><div class="section-h">Works</div><div class="list">${works.map(w => `<div class="row"><span class="main"><div>${esc(w.work)}</div><div class="s">${esc(w.conductor)} · ${esc(w.year)}</div></span>${w.work === W.work ? `<span class="eq">♫ playing</span>` : ""}</div>`).join("")}</div>`;
  }
  p.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { S.page = b.dataset.page; renderPlace(); update(); });
}

// ---------- lab ----------
function renderLab() {
  $("#switch").textContent = `${OPT.variant.find(o => o[0] === S.variant)[1]} · ${OPT.mini.find(o => o[0] === S.mini)[1]}${S.edge === "on" ? " · edge" : ""} ▾`;
  $("#lab").innerHTML = Object.keys(OPT).map(k => `<div class="lr"><div>${LABEL[k]}</div><div class="seg">${OPT[k].map(([v, l]) => `<button data-k="${k}" data-v="${v}" class="${S[k] === v ? "on" : ""}">${l}</button>`).join("")}</div></div>`).join("")
    + `<div class="foot"><a href="?">Reset</a><span>sz-rs30.1.74.7</span><button id="labClose" style="color:var(--tint);font-weight:600">Done</button></div>`;
  $("#lab").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { set(b.dataset.k, b.dataset.v); });
  $("#labClose").onclick = () => $("#lab").classList.remove("open");
}
function set(k, v) {
  if (k === "work") loadWork(v); else S[k] = v;
  const q = new URLSearchParams(); for (const kk in OPT) if (S[kk] !== OPT[kk][0][0]) q.set(kk, S[kk]);
  history.replaceState(null, "", "?" + q);
  renderAll();
}
$("#switch").onclick = () => $("#lab").classList.toggle("open");

let toastT = 0;
function toast(s) { const t = $("#toast"); t.textContent = s; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

function renderAll() {
  const b = document.body;
  b.className = `v-${S.variant} side-${S.side} edge-${S.edge}` + (S.screen === "player" ? " player" : "");
  edgeKey = ""; closeNotes(); renderLab(); renderPlace(); renderPlayer();
}

// ---------- clock ----------
let t0 = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.1, (now - t0) / 1000) * +S.speed; t0 = now;
  if (S.playing) {
    T += dt;
    if (T >= W.total) { loadWork(W.next, 0); renderAll(); }
  }
  // Duration variants glide with the music while the playing position is on screen.
  if ((S.variant === "score" || S.variant === "scroll") && S.screen === "player" && !S.away && !touching && Date.now() > holdUntil) {
    const v = viewRect(), want = v.top + (v.bottom - v.top) * .38, d = playY() - want;
    if (Math.abs(d) > .5) { progUntil = Date.now() + 100; content.scrollTop += Math.abs(d) > 200 ? d : d * .08; }
  }
  const ah = S.variant === "scroll" ? $("#stl") : null; if (ah && ah._auto && ah._auto()) { progUntil = Date.now() + 100; content.scrollTop += ah._auto(); }
  if (now - slow > 120) { slow = now; update(); }
  requestAnimationFrame(frame);
}
addEventListener("resize", () => { edgeKey = ""; layout(); });
loadWork(S.work);
renderAll();
requestAnimationFrame(frame);
</script>
</body>
</html>
