<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Local Storage</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=52" />
    <link rel="stylesheet" href="specimen.css?v=52" />
    <script src="specimen.js?v=52"></script>
  </head>
  <body>
    <!--
  A download is a recording or an album that the listener asked for. The cache never drops it.
-->
    <script>
      // The Local Storage page of Settings (ADR 0051): one bar for the four stores, then a limit and a clear button for the music cache. Pictures and Album Art only show their size.
      K.start(() => {
        const { el, href, form } = K;
        const { scroll } = K.page({
          tab: "library",
          title: "Local Storage",
          back: { label: "Settings", href: href("settings.html", { tab: "library", back: "Library" }) },
          grouped: true,
        });
        const stores = [
          { name: "Music", colour: "tint", size: 1.62 },
          { name: "Downloads", colour: "swipe-download", size: 0.84 },
          { name: "Pictures", colour: "text-secondary", size: 0.21 },
          { name: "Album Art", colour: "text-tertiary", size: 0.09 },
        ];
        const total = stores.reduce((sum, store) => sum + store.size, 0);
        const gb = (size) => `${size.toFixed(2)} GB`;
        const row = form.value;
        // The hairline starts at the store name, past the dot, as in the app.
        const legend = (store) =>
          el(
            "div",
            { class: "row legend" },
            el("span", { class: "storage-dot", style: `background: var(--color-${store.colour})` }),
            el("span", { class: "main" }, store.name),
            el("span", { class: "trail" }, gb(store.size)),
          );
        scroll.append(
          el("div", { class: "page-head" }, el("h1", { class: "t-largeTitle" }, "Local Storage")),
          form.group(
            null,
            [
              el(
                "div",
                { class: "row" },
                el(
                  "span",
                  { class: "storage-bar", "data-id": "storage-bar", role: "img", "aria-label": `${gb(total)} used` },
                  ...stores.map((store) =>
                    el("span", {
                      style: `flex-grow: ${store.size}; background: var(--color-${store.colour})`,
                    }),
                  ),
                ),
              ),
              ...stores.map(legend),
            ],
            `Klassik uses ${gb(total)}. 41.3 GB free on this iPhone.`,
          ),
          form.group(
            "Music",
            [form.stepper("Limit", "2 GB"), form.button("Clear Music", { destructive: true })],
            "Every track that plays stays here. When the cache is full, the tracks played longest ago go first.",
          ),
          form.group(
            "Downloads",
            [row("Symphony No. 3 in E-flat major", "512 MB"), row("Piano Sonata No. 32 in C minor", "330 MB")],
            "A download stays until you remove it. The music limit does not count it. Signing out removes it.",
          ),
        );
      });
    </script>
  </body>
</html>
