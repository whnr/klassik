name: Specimen Pages

on:
  push:
    branches: [main]
    paths: ["design/**", ".github/workflows/specimen-pages.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: Repository branch or commit to preview
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: specimen-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: uv run --no-project --with playwright==1.64.1 playwright install --with-deps chromium
      - run: design/scripts/lint.sh
      - name: Prepare the public specimen
        run: |
          mkdir -p _site
          cp -R design/specimen design/fonts _site/
          cp design/tokens.css _site/
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=specimen/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
