<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Search</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../tokens.css?v=52" />
    <link rel="stylesheet" href="specimen.css?v=52" />
    <link rel="stylesheet" href="sheet.css?v=52" />
    <link rel="stylesheet" href="filters.css?v=53" />
    <script src="specimen.js?v=52"></script>
    <script src="sheet.js?v=52"></script>
    <script src="filters.js?v=52"></script>
  </head>
  <body>
    <!--
  - Composers, performers, works, then albums. A recording shows only inside its work.
  - Matching folds case and diacritics. No catalogue prefixes, no aliases, no suggestions.
  - Recent searches stay on the device.
-->
    <style>
      .specimen-bar {
        max-width: calc(100vw - 12px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .roundglass {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: var(--radius-full);
        display: grid;
        place-items: center;
        position: relative;
        color: var(--color-text-primary);
      }
      .roundglass svg {
        width: 22px;
        height: 22px;
      }
      .roundglass.on {
        color: var(--color-tint);
      }
      .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 19px;
        height: 19px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--color-accent-fill, var(--color-tint));
        color: var(--color-on-accent, #fff);
        font:
          600 12px/19px -apple-system,
          system-ui,
          sans-serif;
        text-align: center;
      }
      .field {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: var(--space-s);
        min-height: 48px;
        padding: 0 var(--space-m) 0 var(--space-l);
        border-radius: var(--radius-full);
      }
      .field svg {
        width: 18px;
        height: 18px;
        flex: none;
        color: var(--color-text-secondary);
      }
      .field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: max(16px, var(--type-body-size));
      }
      .field input::placeholder {
        color: var(--color-text-secondary);
      }
      .field input::-webkit-search-cancel-button {
        display: none;
      }
      .clear {
        color: var(--color-text-secondary);
        padding: var(--space-xs);
        visibility: hidden;
      }

      .hint {
        padding: var(--space-xl) var(--pad-right) 0 var(--space-xl);
        color: var(--color-text-secondary);
      }
      .nomatch {
        padding: var(--space-l) var(--space-l) 0;
        color: var(--color-text-secondary);
      }

      /* The page stays visible and scrollable above the half sheet. */
      .search-page.sheet-open .scroll {
        padding-bottom: 50vh;
      }

      /* The field row sits under the bar and stays there: a system inline field. Only the content scrolls. */
      .fieldrow {
        position: fixed;
        z-index: 25;
        left: 0;
        right: 0;
        top: calc(max(env(safe-area-inset-top), 6px) + var(--pill-space, 34px) + var(--size-hitTarget));
        display: flex;
        gap: var(--space-s);
        align-items: center;
        padding: 0 var(--pad-right) var(--space-s) var(--pad-left);
        background: var(--color-background-grouped);
      }
      .fieldrow .field {
        min-height: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--color-fill-quiet);
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        padding-left: var(--space-m);
      }
      .fieldrow .roundglass {
        width: 40px;
        height: 40px;
        background: var(--color-fill-quiet);
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .search-page .nav {
        background: var(--color-background-grouped);
      }
      .search-page .scroll {
        padding-top: calc(max(env(safe-area-inset-top), 6px) + var(--pill-space, 34px) + var(--size-hitTarget) + 48px);
      }
      .fieldrow .reset svg {
        width: 18px;
        height: 18px;
      }
      .fieldrow .reset:disabled {
        color: var(--color-text-tertiary);
        cursor: default;
      }
      .recent .row {
        width: 100%;
        text-align: left;
      }
      .recent .row svg {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--color-text-secondary);
      }
      .section-head button {
        color: var(--color-tint);
        text-transform: none;
        font: inherit;
      }
    </style>
    <script>
      K.start(() => {
        const { el, href, ICON, M } = K;
        // The matching, the term index and the filter sheet parts are in filters.js, shared with the Library edit sheet.
        const { ONE, label, kindOf, words, queryTokens, matches, passes, line: filterLine } = Filters;
        const { recs } = Filters.index();
        const FUNNEL =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>';

        const EXAMPLE = [
          ["composer:Frédéric Chopin", "composer:Johann Sebastian Bach"],
          ["genre:Piano"],
          [
            "performer:Vladimir Ashkenazy",
            "performer:Maurizio Pollini",
            "performer:City of Birmingham Symphony Orchestra",
          ],
        ];
        // A work or an album answers for some track titles: a tagged track for its work, an untagged one for its
        // album. A match that needs a track title names that track in the row.
        const tracksOf = (songs) =>
          [...new Set(songs.map((s) => s.title).filter(Boolean))].map((title) => ({ title, words: words(title) }));
        const why = (x, tokens) => {
          if (matches(tokens, x.hay)) return "";
          const t = x.tracks.find((t) => matches(tokens, [...x.hay, ...t.words]));
          return t ? t.title : null;
        };
        // A nickname is a quoted name in the part that all track titles of a recording share, such as "Emperor" in
        // `Piano Concerto No. 5 "Emperor": I. Allegro`. It names the work as its title does; a match that needs it
        // says so in the row.
        const QUOTES = { '"': '"', "“": "”", "„": "“”", "«": "»", "»": "«", "‘": "’" };
        const sharedTitle = (titles) => {
          if (titles.length === 1) return titles[0].split(":")[0];
          let prefix = titles[0];
          for (const t of titles.slice(1)) {
            let i = 0;
            while (i < prefix.length && i < t.length && prefix[i] === t[i]) i++;
            prefix = prefix.slice(0, i);
          }
          const cut = Math.max(...[..." :(-–,["].map((c) => prefix.lastIndexOf(c)));
          return cut < 0 ? "" : prefix.slice(0, cut);
        };
        const nicknamesOf = (recordings) => {
          const names = [];
          for (const r of recordings) {
            const shared = sharedTitle(r.songs.map((s) => s.title));
            for (let i = 0; i < shared.length; i++) {
              const close = QUOTES[shared[i]];
              const end = close ? [...shared.slice(i + 1)].findIndex((c) => close.includes(c)) : -1;
              if (end < 0) continue;
              const name = shared.slice(i + 1, i + 1 + end).trim();
              if (name && !names.includes(name)) names.push(name);
              i += end + 1;
            }
          }
          return names.map((name) => ({ name, words: words(name) }));
        };
        const works = [...M.works.values()].map((w) => {
          const nicks = nicknamesOf(w.recordings);
          const plain = words(w.name + " " + w.composer + " " + (w.grouping || ""));
          return {
            w,
            plain,
            nicks,
            hay: [...plain, ...nicks.flatMap((n) => n.words)],
            tracks: tracksOf(w.recordings.flatMap((r) => r.songs)),
            title: Filters.fold(w.name),
          };
        });
        // The nickname that the match needs, or null when the title, composer and set match without it.
        const nicknameOf = (x, tokens) => {
          if (!tokens.length || !x.nicks || matches(tokens, x.plain)) return null;
          const whole = x.nicks.find((n) => matches(tokens, [...x.plain, ...n.words]));
          if (whole) return whole.name;
          return x.nicks.find((n) => tokens.some((t) => n.words.some((w) => w.startsWith(t))))?.name ?? null;
        };
        const people = new Map();
        for (const { r, terms } of recs)
          for (const t of terms) {
            const k = kindOf(t);
            if (k === "genre") continue;
            const name = label(t);
            if (!people.has(name))
              people.set(name, { name, roles: new Set(), recs: new Set(), byRole: new Map(), hay: words(name) });
            people.get(name).roles.add(k);
            if (!people.get(name).byRole.has(k)) people.get(name).byRole.set(k, new Set());
            people.get(name).byRole.get(k).add(r);
            people.get(name).recs.add(r);
          }
        const albums = [...M.albums.values()].map((a) => ({
          a,
          hay: words([a.name, a.artist, a.displayArtist].join(" ")),
          tracks: tracksOf(a.song.filter((s) => !s.works?.[0])),
        }));

        // ---------- State. The query and the conditions stay when the filters hide. ----------
        let query = K.store("search3.q") || "";
        let open = K.store("search3.open") || false;
        // The filter sheet parts. The counts and the reach are those of the results that the page shows.
        const fx = Filters.make({
          conds: K.store("search3.conds") || [],
          kind: K.params.get("filters") === "example" ? "performer" : "composer",
          count: (list) => count(list),
          scope: () => found(),
          onChange: () => {
            save();
            update();
          },
        });
        const save = () => {
          K.store("search3.q", query);
          K.store("search3.conds", fx.conds);
          K.store("search3.open", open);
        };
        // Back from a result keeps the search. Any other arrival (a tab, a link) starts fresh: leaving the page already put the search into Recent.
        const nav = performance.getEntriesByType("navigation")[0];
        if (!nav || nav.type === "navigate") {
          query = "";
          fx.conds = [];
          open = false;
          save();
          K.store("search.session", null);
        }
        // Specimen only: ?filters=example opens the sheet on three conditions and the performers of the third, with a chip that breaks across lines.
        if (K.params.get("filters") === "example") {
          fx.conds = EXAMPLE.map((c) => [...c]);
          // The marked condition lists enough performers to scroll the picker up to the header.
          fx.marked = 2;
          open = true;
          save();
        }
        // The filters count only what the text already found: the recordings of matching works, people and albums.
        let foundKey = null,
          foundSet = null;
        function found() {
          const tokens = queryTokens(query);
          if (!tokens.length) return null;
          if (foundKey === query) return foundSet;
          const set = new Set();
          works
            .filter((x) => why(x, tokens) !== null)
            .forEach((x) => {
              x.w.recordings.forEach((r) => {
                set.add(r);
              });
            });
          people.forEach((p) => {
            if (matches(tokens, p.hay))
              p.recs.forEach((r) => {
                set.add(r);
              });
          });
          albums
            .filter((x) => why(x, tokens) !== null)
            .forEach((x) => {
              x.a.recordings.forEach((r) => {
                set.add(r);
              });
            });
          foundKey = query;
          foundSet = set;
          return set;
        }
        // The rows that Search shows are works, people and albums. Each pool is the recordings of one such row.
        // A row shows when one of its recordings meets the conditions.
        let poolKey = null,
          poolList = null;
        function pools() {
          if (poolList && poolKey === query) return poolList;
          const tokens = queryTokens(query);
          const hit = (x) => !tokens.length || why(x, tokens) !== null;
          poolList = [
            ...works.filter(hit).map((x) => x.w.recordings),
            ...[...people.values()].filter((p) => !tokens.length || matches(tokens, p.hay)).map((p) => [...p.recs]),
            ...albums.filter(hit).map((x) => x.a.recordings),
          ];
          poolKey = query;
          return poolList;
        }
        // The number of results that the conditions leave: the rows of the page and of the footnote.
        const count = (list) => {
          const ok = new Set(recs.filter((x) => passes(x, list)).map((x) => x.r));
          return pools().filter((rs) => rs.some((r) => ok.has(r))).length;
        };

        // ---------- Page, field and tab bar ----------
        // Search is a tab, yet it keeps a back arrow to the page it was opened from (Flo, round 8).
        const { scroll } = K.page({
          tab: "search",
          title: "Search",
          back: { label: "Library", href: "index.html" },
        });
        document.body.classList.add("search-page");
        const input = el("input", {
          type: "search",
          enterkeyhint: "search",
          autocomplete: "off",
          autocorrect: "off",
          spellcheck: "false",
          placeholder: "Work or name",
        });
        input.value = query;
        const clear = el(
          "button",
          {
            class: "clear t-body",
            "aria-label": "Clear",
            onclick: () => {
              input.value = "";
              query = "";
              save();
              update();
              input.focus();
            },
          },
          "✕",
        );
        const badge = el("span", { class: "badge" });
        // The keyboard goes down at the moment the sheet comes up; the sheet never rides on a closing keyboard.
        const filtersBtn = el("button", {
          class: "roundglass",
          "aria-label": "Filters",
          html: FUNNEL,
          onpointerdown: (e) => e.preventDefault(),
          onclick: () => {
            input.blur();
            setOpen(!open);
          },
        });
        filtersBtn.append(badge);
        // The x pill clears the text and every condition. It stays in place when there is nothing to clear, so the field never changes width.
        const resetBtn = el("button", {
          class: "roundglass reset",
          "aria-label": "Clear search and filters",
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
          onpointerdown: (e) => e.preventDefault(),
          onclick: () => {
            commit();
            endSession();
            input.value = "";
            query = "";
            fx.conds = [];
            fx.marked = null;
            save();
            update();
          },
        });
        const field = el("label", { class: "field" }, el("span", { html: ICON.search }), input, clear);
        document.body.append(el("div", { class: "fieldrow" }, field, filtersBtn, resetBtn));
        input.addEventListener("input", () => {
          query = input.value;
          save();
          update();
        });
        input.addEventListener("focus", () => document.body.classList.add("typing"));
        input.addEventListener("blur", () => document.body.classList.remove("typing"));
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            commit();
            input.blur();
          }
        });

        // ---------- Recent searches: newest first, on this device only. Each keeps its filters. ----------
        // A search session is one entry. Every commit replaces the session's entry, so edits never add a row each.
        // Commits: Enter, Done on the filters, opening a result, leaving the page. The x pill ends the session.
        const asRecent = (r) => (typeof r === "string" ? { q: r, conds: [] } : r);
        let recent = (K.store("search.recent") || [])
          .map(asRecent)
          .map((r) => ({ id: r.id || Math.random().toString(36).slice(2), ...r }));
        let session = K.store("search.session");
        const recentKey = (r) => r.q.trim().toLowerCase() + "|" + JSON.stringify(r.conds);
        function commit() {
          const entry = {
            id: session || Math.random().toString(36).slice(2),
            q: query.trim(),
            conds: fx.conds.map((c) => [...c]),
          };
          if (!entry.q && !entry.conds.length) return;
          session = entry.id;
          recent = [entry, ...recent.filter((r) => r.id !== entry.id && recentKey(r) !== recentKey(entry))].slice(
            0,
            42,
          );
          K.store("search.recent", recent);
          K.store("search.session", session);
        }
        function endSession() {
          session = null;
          K.store("search.session", null);
        }
        scroll.addEventListener("click", (e) => {
          if (e.target.closest("a.row")) commit();
        });
        // The back arrow, a tab or a link: whatever the search holds when the page goes is what the listener searched.
        addEventListener("pagehide", commit);

        // ---------- The keyboard: only the content scrolls. The sheet rides on the keyboard only for its own field. ----------
        const riders = [];
        function ride() {
          if (scrollY || document.documentElement.scrollTop) scrollTo(0, 0);
          const vv = window.visualViewport;
          const kb = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
          riders.forEach((r) => {
            r(kb, kb > 40);
          });
          K.layoutChrome();
        }
        // iOS sends the viewport events late, so the riders follow each frame while the keyboard moves.
        let until = 0;
        function follow() {
          until = performance.now() + 900;
          const step = () => {
            ride();
            if (performance.now() < until) requestAnimationFrame(step);
          };
          step();
        }
        if (window.visualViewport) {
          visualViewport.addEventListener("resize", follow);
          visualViewport.addEventListener("scroll", ride);
        }
        addEventListener("scroll", ride);
        document.addEventListener("focusin", follow);
        document.addEventListener("focusout", follow);
        // ---------- Results: sections by kind; the conditions narrow every section. ----------
        const resultsBox = el("div");
        scroll.append(resultsBox);

        function section(title, n, rows, inset) {
          return el(
            "section",
            { class: "section" },
            el(
              "div",
              { class: "section-head t-footnote" },
              el("span", {}, title),
              el("span", { class: "count" }, `(${n})`),
            ),
            el("div", { class: "list", style: inset ? `--sep-inset: ${inset}` : null }, ...rows),
          );
        }
        const plural = (n, word) => K.count(n, word);
        // Each role has its own count: a composer has works, a conductor or performer has recordings.
        // The biggest comes first: "Conductor on 212 recordings, composer of 30 works and performer on 3 recordings".
        function roleCounts(p) {
          const parts = [...p.byRole]
            .map(([k, set]) => {
              const mine = [...set].filter((r) => ok.has(r));
              if (k === "composer") {
                const n = new Set(mine.map((r) => (r.workRef ? r.workRef.id : r.work))).size;
                return { n, text: `composer of ${plural(n, "work")}` };
              }
              return { n: mine.length, text: `${ONE[k].toLowerCase()} on ${plural(mine.length, "recording")}` };
            })
            .filter((x) => x.n > 0)
            .sort((a, b) => b.n - a.n);
          return K.joinNames(parts.map((x) => x.text)).replace(/^./, (c) => c.toUpperCase());
        }
        let ok = new Set();
        function results() {
          const tokens = queryTokens(query);
          if (!tokens.length && !fx.conds.length) {
            if (!recent.length)
              return [
                el(
                  "div",
                  { class: "hint t-subheadline" },
                  "Type a work, a catalogue number such as Op. 67 or K. 626, or a name.",
                ),
              ];
            return [
              el(
                "section",
                { class: "section recent" },
                el(
                  "div",
                  { class: "section-head t-footnote" },
                  el("span", {}, "Recent"),
                  el(
                    "button",
                    {
                      onclick: () => {
                        recent = [];
                        K.store("search.recent", recent);
                        update();
                      },
                    },
                    "Clear",
                  ),
                ),
                el(
                  "div",
                  { class: "list" },
                  ...recent.map((r) =>
                    el(
                      "button",
                      {
                        class: "row",
                        onclick: () => {
                          input.value = r.q;
                          query = r.q;
                          fx.conds = r.conds.map((c) => [...c]);
                          fx.marked = null;
                          session = r.id;
                          commit();
                          save();
                          update();
                        },
                      },
                      el("span", { html: r.conds.length && !r.q ? FUNNEL : ICON.search }),
                      el(
                        "div",
                        { class: "main" },
                        r.q ? el("div", { class: "t-body" }, r.q) : null,
                        r.conds.length
                          ? el("div", { class: r.q ? "t-subheadline secondary" : "t-body" }, filterLine(r.conds))
                          : null,
                      ),
                    ),
                  ),
                ),
              ),
            ];
          }
          ok = new Set(recs.filter((x) => passes(x, fx.conds)).map((x) => x.r));
          const out = [];
          // A title that starts with the text comes first, then a title that holds it, then a match on the composer or
          // the set, then a match that needs a track title.
          const rank = (x) =>
            !tokens.length
              ? 0
              : x.track
                ? 3
                : x.title.startsWith(tokens[0])
                  ? 0
                  : matches(tokens, words(x.w.name))
                    ? 1
                    : 2;
          const trackLine = (track, nickname) =>
            nickname
              ? el("div", { class: "t-subheadline secondary" }, `Nickname: ${nickname}`)
              : track
                ? el("div", { class: "t-subheadline secondary" }, `Track: ${track}`)
                : null;
          const wl = works
            .map((x) => ({ ...x, track: tokens.length ? why(x, tokens) : "" }))
            .filter((x) => x.track !== null)
            .map((x) => ({
              ...x,
              nickname: nicknameOf(x, tokens),
              n: x.w.recordings.filter((r) => ok.has(r)).length,
              score: rank(x),
            }));
          const shown = wl
            .filter((x) => x.n > 0)
            .sort((a, b) => a.score - b.score || a.w.name.localeCompare(b.w.name, undefined, { numeric: true }));
          if (shown.length)
            out.push(
              section(
                "Works",
                shown.length,
                shown.map(({ w, n, track, nickname }) =>
                  el(
                    "a",
                    { class: "row", href: href("work.html", { work: w.id, back: "Search" }) },
                    el(
                      "div",
                      { class: "main" },
                      el("div", { class: "t-body" }, w.name),
                      el(
                        "div",
                        { class: "t-subheadline secondary" },
                        `${w.composer}, ${fx.conds.length ? `${n} of ${plural(w.recordings.length, "recording")} match` : plural(n, "recording")}`,
                      ),
                      trackLine(track, nickname),
                    ),
                    el("span", { html: ICON.chevron }),
                  ),
                ),
              ),
            );
          {
            const pl = [...people.values()]
              .filter((p) => !tokens.length || matches(tokens, p.hay))
              .map((p) => ({ p, n: [...p.recs].filter((r) => ok.has(r)).length }))
              .filter((x) => x.n > 0)
              .sort((a, b) => b.n - a.n || a.p.name.localeCompare(b.p.name));
            const sections = [
              ["Composers", pl.filter(({ p }) => p.roles.has("composer"))],
              ["Performers", pl.filter(({ p }) => !p.roles.has("composer"))],
            ]
              .filter(([, rows]) => rows.length)
              .map(([title, rows]) =>
                section(
                  title,
                  rows.length,
                  rows.map(({ p }) =>
                    el(
                      "a",
                      { class: "row", href: K.personHref(p.name, { back: "Search" }) },
                      el(
                        "div",
                        { class: "main" },
                        el("div", { class: "t-body" }, p.name),
                        el("div", { class: "t-subheadline secondary" }, roleCounts(p)),
                      ),
                      el("span", { html: ICON.chevron }),
                    ),
                  ),
                ),
              );
            out.unshift(...sections);
          }
          // Albums holds only albums. A recording shows only inside its work, the favourites among them too.
          const al = albums
            .map((x) => ({ ...x, track: tokens.length ? why(x, tokens) : "" }))
            .filter((x) => x.track !== null)
            .map((x) => ({ ...x, n: x.a.recordings.filter((r) => ok.has(r)).length }))
            .filter((x) => x.n > 0)
            .sort((a, b) => a.a.name.localeCompare(b.a.name));
          if (al.length)
            out.push(
              section(
                "Albums",
                al.length,
                [
                  ...al.map(({ a, track }) =>
                    el(
                      "a",
                      { class: "row", href: href("player.html", { album: a.id, back: "Search" }) },
                      K.coverImage(a),
                      el(
                        "div",
                        { class: "main" },
                        el("div", { class: "t-body" }, a.name),
                        el(
                          "div",
                          { class: "t-subheadline secondary" },
                          [a.displayArtist || a.artist, a.year].filter(Boolean).join(", "),
                        ),
                        trackLine(track),
                      ),
                      el("span", { html: ICON.chevron }),
                    ),
                  ),
                ],
                "calc(var(--space-l) + var(--size-coverRow) + var(--space-m))",
              ),
            );
          if (!out.length) out.push(el("div", { class: "nomatch t-subheadline" }, "No work, name or album matches."));
          return out;
        }

        // ---------- The filter sheet: the shared frame, changes apply live ----------
        let frame = null;
        let handle = null;
        function buildSheet() {
          frame = Frame.make({ title: "Filters", body: fx.body() });
          frame.draw = () => {
            // The count counts the rows that the page shows below: composers, performers, works and albums.
            const shown = resultsBox.querySelectorAll("section:not(.recent) .list > .row").length;
            // With no text and no condition the page shows Recent, and the count is that of the whole library.
            frame.set({ count: plural(fx.conds.length || query.trim() ? shown : count([]), "result") });
            fx.draw();
          };
          riders.push((kb, up) => {
            if (!frame) return;
            up = up && frame.box.contains(document.activeElement);
            frame.box.style.bottom = up ? kb + "px" : "";
            frame.box.style.height = up ? Math.min(visualViewport.height - 70, innerHeight * 0.5) + "px" : "";
          });
        }

        function setOpen(v) {
          open = v;
          save();
          if (!open) commit();
          document.body.classList.toggle("sheet-open", open);
          if (open && !handle) {
            if (!frame) buildSheet();
            handle = Frame.open(frame, {
              onClose: () => {
                handle = null;
                open = false;
                save();
                commit();
                document.body.classList.remove("sheet-open");
                update();
              },
            });
          } else if (!open && handle) handle.close();
          update();
        }

        function update() {
          clear.style.visibility = input.value ? "visible" : "hidden";
          resetBtn.disabled = !query && !fx.conds.length;
          badge.textContent = String(fx.conds.length);
          badge.style.display = fx.conds.length && !open ? "" : "none";
          filtersBtn.classList.toggle("on", open);
          resultsBox.replaceChildren(...results());
          if (frame) frame.draw();
        }

        // Specimen only: a reset for the search state.
        const sbar = document.querySelector(".specimen-bar");
        if (sbar)
          sbar.append(
            el(
              "button",
              {
                onclick: () => {
                  ["q", "conds", "open"].forEach((k) => {
                    K.store("search3." + k, null);
                  });
                  location.reload();
                },
              },
              "Reset",
            ),
            el(
              "button",
              {
                onclick: () => {
                  location.search = "?filters=example";
                },
              },
              "Example",
            ),
          );

        update();
        if (open) requestAnimationFrame(() => setOpen(true));
        K.layoutChrome();
        follow();
      });
    </script>
  </body>
</html>
